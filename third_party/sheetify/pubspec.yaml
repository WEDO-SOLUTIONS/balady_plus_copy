name: sheetify
description: "A Flutter package that provides customizable bottom sheet widgets with snapping behaviors, gesture support, animation, and dynamic state control."
version: 1.1.3

repository: https://github.com/urbi-ae/sheetify
homepage: https://github.com/urbi-ae/sheetify

environment:
  # BALADY-3755: upstream declares ">=3.5.0". Raised to 3.7 so `dart format` honours
  # the `// dart format off` marker at the top of every file here — the marker only
  # exists in the 3.7 formatter, and below that language version the files would be
  # reflowed to this repo's 120-column style. See VENDORING.md.
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=2.17.0"

dependencies:
  flutter:
    sdk: flutter
  keyboard_insets: ^0.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0