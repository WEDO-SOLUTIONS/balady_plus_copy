<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Drift the Desert — background baker</title>
<style>html,body{margin:0;background:#111;color:#ccc;font:13px monospace}canvas{display:block;max-width:100%}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Offline renderer for the game's background plates.

   This is the runtime shader's rich cousin. Nothing here has to fit in a
   frame budget on a cheap Android GPU, so it can afford what the live version
   could not: eight octaves of warped noise, sedimentary strata and erosion
   gullies in the rock, wind ripples and rim light on the dunes, two cloud
   decks with god rays. tools/bake_background.js drives it headlessly and
   writes the results into img/bg/.

   Every layer is horizontally seamless. Noise is sampled around a circle in
   x, so u = 0 and u = 1 land on the same point and the plates can wrap
   forever under parallax. */

const VERT = `
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FRAG = `
precision highp float;

uniform vec2  uRes;
uniform float uDusk;     // 0 = golden hour, 1 = dusk
uniform int   uLayer;    // 0 sky, 1 far range, 2 near range, 3 dunes

#define TAU 6.28318530718

/* ------------------------------------------------------------------ noise

   Seamless horizontally: the plate's x axis is wrapped around a cylinder and
   sampled with 3D noise, so u = 0 and u = 1 are the same point. Horizontal
   frequency therefore comes from the cylinder radius, never from scaling u —
   scaling u by a non-integer would break the wrap.                         */

float hash3(vec3 p) {
  return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);
}

float vnoise3(vec3 p) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  vec3 w = f * f * (3.0 - 2.0 * f);
  float n000 = hash3(i);
  float n100 = hash3(i + vec3(1.0, 0.0, 0.0));
  float n010 = hash3(i + vec3(0.0, 1.0, 0.0));
  float n110 = hash3(i + vec3(1.0, 1.0, 0.0));
  float n001 = hash3(i + vec3(0.0, 0.0, 1.0));
  float n101 = hash3(i + vec3(1.0, 0.0, 1.0));
  float n011 = hash3(i + vec3(0.0, 1.0, 1.0));
  float n111 = hash3(i + vec3(1.0, 1.0, 1.0));
  return mix(mix(mix(n000, n100, w.x), mix(n010, n110, w.x), w.y),
             mix(mix(n001, n101, w.x), mix(n011, n111, w.x), w.y), w.z);
}

// The radius sets how many features fit across the plate; y is already scaled.
float wnoise(float u, float y, float radius) {
  float a = u * TAU;
  return vnoise3(vec3(cos(a) * radius, sin(a) * radius, y));
}

float wfbm(float u, float y, float radius, int octaves) {
  float s = 0.0, amp = 0.5, r = radius, yy = y;
  for (int i = 0; i < 8; i++) {
    if (i >= octaves) break;
    s += amp * wnoise(u, yy, r);
    r *= 2.0; yy *= 2.0; amp *= 0.5;
  }
  return s;
}

// Ridged variant — the sharp creases that make dunes and rock read as solid.
float wridge(float u, float y, float radius, int octaves) {
  float s = 0.0, amp = 0.5, r = radius, yy = y;
  for (int i = 0; i < 8; i++) {
    if (i >= octaves) break;
    s += amp * (1.0 - abs(wnoise(u, yy, r) * 2.0 - 1.0));
    r *= 2.0; yy *= 2.0; amp *= 0.5;
  }
  return s;
}

// Vertical scale that makes noise of this radius isotropic on the plate: the
// cylinder puts TAU * radius noise units across the width, so the height needs
// the same units per pixel. Without this the two axes drift apart and the
// noise smears into corduroy.
float ys(float radius) {
  return TAU * radius * uRes.y / uRes.x;
}

/* -------------------------------------------------------------- palettes */

vec3 skyColour(float t, float dusk) {
  vec3 zenithDay  = vec3(0.06, 0.20, 0.38);
  vec3 midDay     = vec3(0.38, 0.55, 0.66);
  vec3 lowDay     = vec3(0.99, 0.80, 0.52);
  vec3 zenithDusk = vec3(0.03, 0.04, 0.13);
  vec3 midDusk    = vec3(0.18, 0.13, 0.27);
  vec3 lowDusk    = vec3(0.78, 0.35, 0.24);
  vec3 zenith = mix(zenithDay, zenithDusk, dusk);
  vec3 mid    = mix(midDay,    midDusk,    dusk);
  vec3 low    = mix(lowDay,    lowDusk,    dusk);
  return t < 0.62 ? mix(zenith, mid, smoothstep(0.0, 0.62, t))
                  : mix(mid, low, smoothstep(0.62, 1.0, t));
}

vec3 sunColour(float dusk) {
  return mix(vec3(1.0, 0.93, 0.76), vec3(1.0, 0.50, 0.30), dusk);
}

/* ------------------------------------------------------------------- sky */

vec4 bakeSky(float u, float v, float dusk) {
  // v: 0 at the top of the plate, 1 at the horizon.
  vec3 col = skyColour(v, dusk);
  vec3 sunT = sunColour(dusk);
  vec2 sunPos = vec2(0.66, 0.955 - 0.02 * dusk);
  float aspect = uRes.x / uRes.y;
  float sunDist = length((vec2(u, v) - sunPos) * vec2(aspect, 1.0));

  // --- high cirrus: stretched thin, so low vertical frequency -------------
  float cir = wfbm(u, v * ys(7.0) * 2.4, 7.0, 5);
  cir = smoothstep(0.50, 0.72, cir) * smoothstep(0.04, 0.26, v) * smoothstep(0.70, 0.40, v);
  vec3 cirCol = mix(vec3(1.0, 0.96, 0.90), vec3(0.62, 0.34, 0.36), dusk);
  col = mix(col, cirCol, cir * 0.40);

  // --- cumulus deck: domain-warped, lit from the sun side -----------------
  // Billow noise, not plain fbm: cumulus is built of stacked cauliflower
  // heads, and a smooth field gave flat grey smoke.
  float warp = wfbm(u, v * ys(1.8), 1.8, 4);
  // Flattened on purpose, and warped only a little: cumulus is wider than it
  // is tall. y advances faster than x here, which squashes the noise into
  // that shape; slowing it down stretched the deck into stalactites, and a
  // strong vertical warp hung the whole thing in drips.
  float yc = v * ys(3.0) * 1.75 + warp * 0.22;
  float dens = wfbm(u + warp * 0.03, yc, 3.0, 6);
  dens = mix(dens, 1.0 - abs(dens * 2.0 - 1.0), 0.40);
  dens += (wfbm(u, v * ys(11.0), 11.0, 3) - 0.5) * 0.08;   // frayed edges

  // Held clear of the horizon: the reference has a clean warm band under the
  // deck, and clouds running all the way down fought the haze.
  float band = smoothstep(0.16, 0.40, v) * smoothstep(0.90, 0.64, v);
  float cover = smoothstep(0.60, 0.74, dens) * band;

  // Shade from the density gradient towards the sun. The offset is small on
  // purpose: a long one smeared every cloud into a column of virga.
  float densUp = wfbm(u + warp * 0.03, yc - 0.13, 3.0, 5);
  densUp = mix(densUp, 1.0 - abs(densUp * 2.0 - 1.0), 0.40);
  float lit = smoothstep(-0.05, 0.08, densUp - dens);

  vec3 cloudLit  = mix(vec3(1.0, 0.98, 0.94), vec3(0.88, 0.50, 0.37), dusk);
  vec3 cloudDark = mix(vec3(0.62, 0.58, 0.60), vec3(0.22, 0.15, 0.23), dusk);
  vec3 cloudCol = mix(cloudDark, cloudLit, lit);
  cloudCol += sunT * exp(-sunDist * 4.0) * 0.5;
  col = mix(col, cloudCol, cover);

  // --- a low deck, flattened and far off, for depth under the big one -----
  float lowN = wfbm(u + 4.1, v * ys(6.0) * 2.6 + 9.0, 6.0, 4);
  float lowBand = smoothstep(0.62, 0.74, v) * smoothstep(0.94, 0.80, v);
  float lowCover = smoothstep(0.50, 0.66, lowN) * lowBand * 0.75;
  vec3 lowCol = mix(mix(vec3(0.98, 0.90, 0.78), vec3(0.70, 0.40, 0.34), dusk),
                    sunT, exp(-sunDist * 3.0) * 0.5);
  col = mix(col, lowCol, lowCover);

  // --- sun: bloom, then a restrained fan of rays through the deck ---------
  col += sunT * (0.38 * exp(-sunDist * 5.0) + 0.85 * exp(-sunDist * 20.0));

  float ang = atan(v - sunPos.y, (u - sunPos.x) * aspect);
  float rays = wfbm(ang / TAU + 0.5, 0.0, 9.0, 3);
  col += sunT * smoothstep(0.52, 0.92, rays) * exp(-sunDist * 5.5) * 0.18 * (1.0 - cover * 0.8);

  // Brighter than the bloom around it, or the disc reads as a dark hole
  // punched in its own glow.
  col = mix(col, sunT * 2.1, smoothstep(0.032, 0.020, sunDist));

  // Aerial haze piling up at the horizon.
  col = mix(col, skyColour(1.0, dusk), smoothstep(0.72, 1.0, v) * 0.72);

  return vec4(col, 1.0);
}

/* ----------------------------------------------------------------- rock */

// Silhouette height of a range, 0..1 of the plate height. Terracing the
// height field is what turns hills into flat-topped buttes.
float rangeHeight(float u, float seed, float radius, float fill) {
  float h = wfbm(u, seed, radius, 4);
  h = smoothstep(0.24, 0.78, h);

  // Four terraces with soft risers.
  float steps = 4.0;
  float t = h * steps;
  h = (floor(t) + smoothstep(0.34, 0.66, fract(t))) / steps;

  // A little erosion on the rim so the plateaus are not perfectly level.
  h += (wfbm(u, seed + 5.0, radius * 4.0, 3) - 0.5) * 0.06;
  return clamp(h, 0.0, 1.0) * fill;
}

vec4 bakeRange(float u, float v, float dusk, float seed, float radius, float fill,
               float hazeAmt, vec3 rockLit, vec3 rockDark) {
  float h = rangeHeight(u, seed, radius, fill);
  float top = 1.0 - h;
  if (v < top) return vec4(0.0);

  float into = (v - top) / max(0.0001, 1.0 - top);   // 0 crest .. 1 base

  // Sedimentary strata: banded in v, drifting slowly in u so they follow the
  // rock rather than ruling straight lines across the plate.
  float drift = wfbm(u, seed * 2.0, radius * 0.6, 3);
  float bands = 0.5 + 0.5 * sin((v + drift * 0.05) * 42.0);
  bands *= smoothstep(0.02, 0.18, into);

  // Erosion gullies: high frequency across the face, low down it.
  float gully = wridge(u, v * ys(radius * 3.0) * 0.22 + seed, radius * 3.0, 3);
  gully = smoothstep(0.55, 0.95, gully) * smoothstep(0.05, 0.4, into);

  // Light from the sun side: the slope of the silhouette tells us which way
  // the face turns.
  float slope = rangeHeight(u + 0.0025, seed, radius, fill) - h;
  float face = clamp(0.5 - slope * 18.0, 0.0, 1.0);

  vec3 col = mix(rockDark, rockLit, face);
  col *= 1.0 - smoothstep(0.1, 1.0, into) * 0.22;      // shade down the face
  col *= 0.90 + 0.10 * bands;
  col *= 1.0 - gully * 0.16;

  // Talus fans at the base catch more light and more dust.
  col = mix(col, mix(col, rockLit, 0.30) * 1.03, smoothstep(0.62, 1.0, into));

  vec3 haze = skyColour(1.0, dusk);
  col = mix(col, haze, hazeAmt + (1.0 - hazeAmt) * smoothstep(0.72, 1.0, into) * 0.5);

  float edge = smoothstep(0.0, 1.5 / uRes.y, v - top);
  return vec4(col, edge);
}

/* ---------------------------------------------------------------- dunes */

vec4 bakeDunes(float u, float v, float dusk) {
  vec3 col = vec3(0.0);
  float alpha = 0.0;

  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    float seed = 11.0 + fi * 7.0;
    float radius = 1.3 + fi * 0.7;
    // Two scales of crest: the long sweep of the ridge, plus the scallops
    // that stop it from ruling a straight line across the plate.
    float crest = wfbm(u, seed, radius, 4) + (wfbm(u, seed + 31.0, radius * 3.4, 3) - 0.5) * 0.35;
    float top = 0.08 + fi * 0.26 + (crest - 0.5) * 0.19;
    if (v < top) continue;

    float into = (v - top) / max(0.0001, 1.0 - top);   // 0 crest .. 1 base
    float slope = wfbm(u + 0.0025, seed, radius, 4) - wfbm(u, seed, radius, 4);

    vec3 lit  = mix(vec3(0.96, 0.81, 0.56), vec3(0.52, 0.32, 0.31), dusk);
    vec3 dark = mix(vec3(0.55, 0.36, 0.20), vec3(0.17, 0.11, 0.14), dusk);

    // The face has to shade *down* the slope, not just across it: lighting
    // that depended on u alone painted each column a single flat colour.
    float down = smoothstep(0.0, 0.95, into);
    float aspect = clamp(0.5 - slope * 18.0, 0.0, 1.0);   // which way it turns

    // Relief across the face. Without it the shading term varies in u only,
    // and the lower half of every plate hung in vertical curtains.
    float relief = wfbm(u + into * 0.09, v * ys(2.6) * 1.3 + seed * 3.0, 2.6, 4);
    // Kept clear of 1.0 on purpose: once the shading term clipped, the dark
    // side of every column flattened to the same value and the face hung in
    // vertical curtains again.
    float shade = clamp(down * (0.42 + 0.34 * (1.0 - aspect)) + (relief - 0.5) * 0.34 * down,
                        0.0, 0.96);
    vec3 c = mix(lit, dark, shade);

    // Mottling in both axes, centred on 1.0: scaling the sand *up* clipped
    // the blue channel first and turned the crests chartreuse.
    float mottle = wfbm(u, v * ys(2.2), 2.2, 4);
    float grain = wfbm(u, v * ys(9.0), 9.0, 3);
    c *= 0.97 + 0.16 * (mottle - 0.5) + 0.10 * (grain - 0.5);

    // Wind ripples follow the crest: wide across the plate, tight up it, and
    // fading out as the slope turns away.
    float ripple = wridge(u, v * 150.0 + seed, 5.0, 2);
    c *= 1.0 + (ripple - 0.5) * 0.14 * (1.0 - down * 0.6);

    // Rim light right on the crest, and a shadow pooling just under it. It
    // is a blend, not an addition: adding blew the crest past white and the
    // clipped result read as a pale green ledge along the horizon.
    vec3 rim = mix(vec3(1.00, 0.95, 0.82), vec3(0.86, 0.56, 0.48), dusk);
    c = mix(c, rim, smoothstep(0.055, 0.0, into) * 0.52);
    c *= 1.0 - smoothstep(0.02, 0.10, into) * smoothstep(0.30, 0.12, into) * 0.12;

    // Scattered scrub and stones, thinning into the distance.
    float sprinkle = step(0.9955, hash3(vec3(floor(u * 1400.0), floor(v * 700.0), fi)));
    c *= 1.0 - sprinkle * 0.5 * smoothstep(0.08, 0.45, into);

    c *= 1.0 - fi * 0.09;

    float edge = smoothstep(0.0, 1.5 / uRes.y, v - top);
    col = mix(col, c, edge);
    alpha = max(alpha, edge);
  }

  col = mix(skyColour(1.0, dusk), col, smoothstep(0.0, 0.10, v));
  return vec4(col, alpha);
}

/* ----------------------------------------------------------------- sand

   The desert floor, seen from above and tiled across the ground plane by the
   game. Everything here has to wrap in BOTH axes, so the lattice is wrapped
   with mod() and every ripple frequency is a whole number of cycles per tile.

   Deliberately no large forms: the texture repeats several times across the
   near field, and anything bigger than a stride would announce the grid. The
   big shapes are the game's job; this supplies what a photograph of sand has
   and a gradient does not — ripples, grain, drift and stones. */

float thash(vec2 c, float n) {
  c = mod(c, vec2(n));
  return fract(sin(dot(c, vec2(127.1, 311.7))) * 43758.5453123);
}

float tnoise(vec2 p, float n) {
  vec2 i = floor(p), f = fract(p);
  vec2 w = f * f * (3.0 - 2.0 * f);
  float a = thash(i, n);
  float b = thash(i + vec2(1.0, 0.0), n);
  float c = thash(i + vec2(0.0, 1.0), n);
  float d = thash(i + vec2(1.0, 1.0), n);
  return mix(mix(a, b, w.x), mix(c, d, w.x), w.y);
}

/* uv in 0..1; cells is how many lattice cells the first octave spans. */
float tfbm(vec2 uv, float cells, int octaves) {
  float s = 0.0, amp = 0.5, n = cells;
  for (int i = 0; i < 8; i++) {
    if (i >= octaves) break;
    s += amp * tnoise(uv * n, n);
    n *= 2.0; amp *= 0.5;
  }
  return s;
}

/* Height of the sand surface at uv, in arbitrary units. Sampled three times
   per pixel so the shading can come from a real gradient rather than from a
   guess about which way the slope faces. */
float sandHeight(vec2 uv) {
  // Meandering drift, the low swells between ripple fields.
  float drift = tfbm(uv, 3.0, 4);

  // Two ripple trains crossing at a shallow angle, each warped by the drift.
  // Integer wave vectors keep them tiling; the warp keeps them from ruling
  // straight lines across the texture.
  float w1 = tfbm(uv, 5.0, 3) - 0.5;
  float w2 = tfbm(uv + 0.37, 7.0, 3) - 0.5;
  float r1 = sin(TAU * (3.0 * uv.x + 26.0 * uv.y) + w1 * 17.0);
  float r2 = sin(TAU * (11.0 * uv.x + 31.0 * uv.y) + w2 * 14.0);

  // Ripples are not sine waves: the windward side is long, the lee side short.
  r1 = 1.0 - pow(abs(r1), 0.65);
  r2 = 1.0 - pow(abs(r2), 0.70);

  // The two trains take turns across the field instead of both running
  // everywhere. Evenly spaced parallel lines over a whole tile read as wood
  // grain the moment the tile repeats.
  float patch = smoothstep(0.32, 0.64, drift);
  float ripple = r1 * 0.60 * (1.0 - patch * 0.75) + r2 * 0.52 * patch;

  // Grain, right at the limit of what survives the JPEG.
  float grain = tfbm(uv, 90.0, 2) - 0.5;

  return drift * 1.30 + ripple * 0.26 + grain * 0.045;
}

vec4 bakeSand(vec2 uv, float dusk) {
  float e = 1.0 / uRes.x;
  float h = sandHeight(uv);
  float hx = sandHeight(uv + vec2(e, 0.0));
  float hy = sandHeight(uv + vec2(0.0, e));

  // Slope into a normal. The vertical exaggeration is what decides whether
  // this reads as sand or as crumpled paper.
  vec3 nrm = normalize(vec3(-(hx - h) / e * 0.055, -(hy - h) / e * 0.055, 1.0));

  // Low sun raking across the tile, away from the camera, so the lee sides
  // face the player in shadow — the same read as the reference photograph.
  vec3 L = normalize(vec3(-0.55, -0.78, 0.30));
  float diff = clamp(dot(nrm, L), 0.0, 1.0);
  float sky = 0.5 + 0.5 * nrm.z;                      // ambient from above

  vec3 lit  = mix(vec3(0.95, 0.80, 0.55), vec3(0.55, 0.34, 0.33), dusk);
  vec3 mid  = mix(vec3(0.78, 0.58, 0.35), vec3(0.37, 0.23, 0.24), dusk);
  vec3 dark = mix(vec3(0.46, 0.30, 0.16), vec3(0.16, 0.10, 0.13), dusk);

  vec3 col = mix(dark, mid, sky);
  col = mix(col, lit, diff * 0.85);

  // Colour drift: sand is never one hue over a whole field.
  float tone = tfbm(uv + 0.71, 2.0, 3);
  col *= 0.93 + 0.16 * tone;
  col = mix(col, col * vec3(1.06, 0.98, 0.88), tfbm(uv + 1.31, 4.0, 3));

  // Stones. Two sizes, each on its own wrapped lattice. Every pixel tests the
  // nine cells around it rather than only its own: a stone confined to one
  // cell had its shadow clipped at the cell border, which tiled the texture
  // with little grey squares.
  for (int k = 0; k < 2; k++) {
    float cells = k == 0 ? 26.0 : 44.0;
    float base = k == 0 ? 0.24 : 0.13;
    float thresh = k == 0 ? 0.90 : 0.945;
    vec2 gp = uv * cells;
    vec2 home = floor(gp);

    // Shadows first, so no stone is darkened by its neighbour's.
    for (int oy = -1; oy <= 1; oy++) {
      for (int ox = -1; ox <= 1; ox++) {
        vec2 cell = home + vec2(float(ox), float(oy));
        if (thash(cell + float(k) * 13.0, cells) <= thresh) continue;
        vec2 at = cell + vec2(thash(cell + 3.0, cells), thash(cell + 9.0, cells));
        float r = base * (0.55 + thash(cell + 5.0, cells) * 0.85);
        float sh = smoothstep(r * 2.1, r * 0.7, length(gp - at - vec2(0.55, 0.80) * r));
        col *= 1.0 - sh * 0.34;
      }
    }

    for (int oy = -1; oy <= 1; oy++) {
      for (int ox = -1; ox <= 1; ox++) {
        vec2 cell = home + vec2(float(ox), float(oy));
        if (thash(cell + float(k) * 13.0, cells) <= thresh) continue;
        vec2 at = cell + vec2(thash(cell + 3.0, cells), thash(cell + 9.0, cells));
        float r = base * (0.55 + thash(cell + 5.0, cells) * 0.85);

        // Squashed and turned, so they are not a field of identical discs.
        // Only the silhouette turns: the first version lit the stone from the
        // rotated frame too, which gave every pebble its own private sun.
        vec2 raw = gp - at;
        float rot = thash(cell + 21.0, cells) * TAU;
        vec2 d = vec2(raw.x * cos(rot) - raw.y * sin(rot), raw.x * sin(rot) + raw.y * cos(rot));
        d.y /= 0.62 + thash(cell + 27.0, cells) * 0.5;
        float dist = length(d) / r;

        float stone = smoothstep(1.0, 0.86, dist);
        if (stone <= 0.0) continue;

        vec3 sc = mix(vec3(0.54, 0.43, 0.31), vec3(0.20, 0.14, 0.16), dusk);
        sc *= 0.70 + 0.80 * thash(cell + 17.0, cells);
        // Curvature in the world frame: the upsun shoulder catches the light,
        // the far side does not, which is all it takes for a disc to read as
        // a pebble sitting on the sand.
        float shade = clamp(0.52 - (raw.x * 0.55 + raw.y * 0.78) / r, 0.0, 1.25);
        sc *= 0.58 + 1.00 * shade;
        col = mix(col, sc, stone);
      }
    }
  }

  return vec4(col, 1.0);
}

/* ---------------------------------------------------------------- props

   A sheet of the things that stand beside the track: four rocks and four dry
   bushes, 512 px each in a 4x2 grid. They used to be drawn as canvas paths,
   which was fine over a painted floor and stopped being fine the moment the
   sand under them became a photograph — a flat blob with an ellipse of
   highlight on it reads as a sticker.

   Both are lit from the upper left, like everything else in the bake, and
   both are cut off at their waterline so the game can bed them into the sand
   with its own contact shadow. */

float h21(vec2 p) {
  return fract(sin(dot(p, vec2(41.7, 289.3))) * 43758.5453123);
}

/* Height of a rock at p (0..1 inside its cell), 0 outside it. Sampled three
   times per pixel: the shading is a real gradient, not a guess. */
float rockHeight(vec2 p, float seed, out float mask) {
  vec2 q = (p - vec2(0.5, 0.635)) / vec2(0.415, 0.315);
  float ang = atan(q.y, q.x);

  // A rounded polygon, not a cloud: the radius is constant across each of
  // seven sectors and eased across the corners, with a little harmonic noise
  // on top. Sines alone gave blobs that read as dough.
  float sect = (ang / TAU + 0.5) * 7.0;
  float si = floor(sect);
  float sf = smoothstep(0.62, 1.0, fract(sect));
  float ra = 0.80 + h21(vec2(mod(si, 7.0), seed)) * 0.34;
  float rb = 0.80 + h21(vec2(mod(si + 1.0, 7.0), seed)) * 0.34;
  float lump = mix(ra, rb, sf)
    + 0.055 * sin(ang * 5.0 + seed * 2.1)
    + 0.030 * sin(ang * 11.0 + seed * 1.9);

  float r = length(q) / lump;
  mask = 1.0 - smoothstep(0.94, 1.0, r);
  if (mask <= 0.0) return 0.0;

  // A dome, roughened by two scales of noise and creased by a ridged one.
  // Heights are in the same units as p, so the gradient below is a real
  // slope: the first version scaled it down by fifty and shaded every rock
  // flat.
  float dome = sqrt(max(0.0, 1.0 - r * r));
  float bump = tfbm(p * 0.9 + seed, 4.0, 4) - 0.5;
  float crack = 1.0 - abs(tfbm(p * 1.3 + seed * 2.0, 7.0, 3) * 2.0 - 1.0);
  return dome * 0.34 + bump * 0.020 - pow(crack, 4.0) * 0.016;
}

vec4 rockSprite(vec2 p, float id, float dusk) {
  float seed = 3.1 + id * 7.37;
  float e = 1.0 / 512.0;
  float m, mx, my;
  float h = rockHeight(p, seed, m);
  if (m <= 0.0) return vec4(0.0);
  float hx = rockHeight(p + vec2(e, 0.0), seed, mx);
  float hy = rockHeight(p + vec2(0.0, e), seed, my);

  vec3 nrm = normalize(vec3(-(hx - h) / e, -(hy - h) / e, 1.0));
  vec3 L = normalize(vec3(-0.58, -0.72, 0.38));
  float diff = clamp(dot(nrm, L), 0.0, 1.0);
  float sky = 0.5 + 0.5 * nrm.z;

  vec3 lit  = mix(vec3(0.78, 0.68, 0.54), vec3(0.36, 0.25, 0.27), dusk);
  vec3 mid  = mix(vec3(0.44, 0.36, 0.28), vec3(0.18, 0.13, 0.15), dusk);
  vec3 dark = mix(vec3(0.18, 0.14, 0.11), vec3(0.06, 0.05, 0.07), dusk);

  vec3 col = mix(dark, mid, sky);
  col = mix(col, lit, diff * 0.9);

  // Mineral streaks and a dusting of the sand it sits in.
  float grain = tfbm(p * 2.0 + seed * 3.0, 14.0, 3);
  col *= 0.86 + 0.28 * grain;
  float dust = smoothstep(0.55, 0.95, nrm.z) * smoothstep(0.35, 0.05, p.y);
  col = mix(col, mix(vec3(0.80, 0.66, 0.45), vec3(0.34, 0.22, 0.24), dusk), dust * 0.28);

  // Bedded into the sand: the last tenth fades out rather than ending on a
  // line, and darkens where the sand piles against it.
  float bed = smoothstep(0.96, 0.90, p.y);
  col *= 1.0 - smoothstep(0.86, 0.94, p.y) * 0.35;
  return vec4(col, m * bed);
}

/* Distance from p to the segment ab. */
float segDist(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a, ba = b - a;
  float t = clamp(dot(pa, ba) / max(1e-6, dot(ba, ba)), 0.0, 1.0);
  return length(pa - ba * t);
}

/* Where stem fi of a bush ends up. Shared so the seed heads can sit on the
   stems that carry them instead of floating over the clump. */
vec2 stemTip(float fi, float seed) {
  float r1 = h21(vec2(fi, seed));
  float r2 = h21(vec2(fi + 31.0, seed));
  float r3 = h21(vec2(fi + 67.0, seed));
  float r4 = h21(vec2(fi + 97.0, seed));
  vec2 root = vec2(0.5 + (r4 - 0.5) * 0.13, 0.95 - r3 * 0.03);
  float ang = -1.5708 + (r1 - 0.5) * 1.45;
  float len = 0.22 + r2 * 0.34 - abs(r1 - 0.5) * 0.14;
  vec2 dir = vec2(cos(ang), sin(ang));
  vec2 tip = root + dir * len;
  vec2 side = vec2(-dir.y, dir.x) * (r1 - 0.5) * len * 0.55;
  return tip + vec2(side.x * 0.5, len * 0.10 * r2);
}

vec4 bushSprite(vec2 p, float id, float dusk) {
  float seed = 17.0 + id * 11.13;

  float alpha = 0.0;
  vec3 col = vec3(0.0);
  float best = 1e9;

  for (int i = 0; i < 38; i++) {
    float fi = float(i);
    float r1 = h21(vec2(fi, seed));
    float r2 = h21(vec2(fi + 31.0, seed));
    float r3 = h21(vec2(fi + 67.0, seed));
    float r4 = h21(vec2(fi + 97.0, seed));

    // Branches leave a short root line rather than a single point, and lean
    // out no further than forty degrees: a full fan made a starburst.
    vec2 root = vec2(0.5 + (r4 - 0.5) * 0.13, 0.95 - r3 * 0.03);
    float ang = -1.5708 + (r1 - 0.5) * 1.45;
    float len = 0.22 + r2 * 0.34 - abs(r1 - 0.5) * 0.14;
    vec2 dir = vec2(cos(ang), sin(ang));
    vec2 tip = root + dir * len;

    // Arc: the middle bows away from the straight line, and the tip droops,
    // which is what a dry shrub does under its own weight.
    vec2 side = vec2(-dir.y, dir.x) * (r1 - 0.5) * len * 0.55;
    vec2 mid = mix(root, tip, 0.5) + side;
    tip += vec2(side.x * 0.5, len * 0.10 * r2);

    float d = min(segDist(p, root, mid), segDist(p, mid, tip));
    float along = clamp((root.y - p.y) / max(0.02, root.y - tip.y), 0.0, 1.0);
    float wide = mix(0.0065, 0.0012, along) * (0.7 + r2 * 0.7);
    float a = 1.0 - smoothstep(wide * 0.55, wide * 1.45, d);
    if (a <= 0.0) continue;

    vec3 tipCol = mix(vec3(0.84, 0.74, 0.46), vec3(0.35, 0.25, 0.27), dusk);
    vec3 rootCol = mix(vec3(0.31, 0.29, 0.14), vec3(0.11, 0.10, 0.11), dusk);
    vec3 c = mix(rootCol, tipCol, along * (0.55 + 0.6 * r2));
    c *= 0.74 + 0.42 * r1 + 0.22 * r4;          // some branches catch the sun

    if (d < best) { best = d; col = c; }
    alpha = max(alpha, a);
  }

  // Seed heads, each one on the tip of a stem.
  for (int k = 0; k < 9; k++) {
    float fk = float(k);
    vec2 at = stemTip(fk * 4.0 + 1.0, seed);
    float rr = 0.011 + h21(vec2(fk + 41.0, seed)) * 0.012;
    float d = length((p - at) / vec2(1.0, 1.7)) / rr;
    float a = 1.0 - smoothstep(0.70, 1.0, d);
    if (a <= 0.0) continue;
    vec3 c = mix(vec3(0.78, 0.68, 0.40), vec3(0.30, 0.22, 0.23), dusk);
    c *= 0.78 + 0.45 * clamp(1.0 - d, 0.0, 1.0);
    col = mix(col, c, a);
    alpha = max(alpha, a);
  }

  return vec4(col, alpha);
}

vec4 bakeProps(vec2 uv, float dusk) {
  vec2 cell = vec2(floor(uv.x * 4.0), floor(uv.y * 2.0));
  vec2 p = vec2(fract(uv.x * 4.0), fract(uv.y * 2.0));
  float id = cell.y * 4.0 + cell.x;
  return id < 4.0 ? rockSprite(p, id, dusk) : bushSprite(p, id - 4.0, dusk);
}

/* ------------------------------------------------------------------ main */

/* One sample of whichever layer is being baked, at plate coordinates
   u (0..1 across) and v (0 top .. 1 bottom). Colour is returned straight,
   not premultiplied; main() handles the weighting. */
vec4 plate(float u, float v, float dusk) {
  vec4 outc;

  if (uLayer == 0) {
    outc = bakeSky(u, v, dusk);
  } else if (uLayer == 1) {
    outc = bakeRange(u, v, dusk, 3.0, 2.6, 0.62, 0.42,
                     mix(vec3(0.64, 0.49, 0.38), vec3(0.24, 0.17, 0.25), dusk),
                     mix(vec3(0.40, 0.29, 0.25), vec3(0.13, 0.09, 0.16), dusk));
  } else if (uLayer == 2) {
    outc = bakeRange(u, v, dusk, 17.0, 1.7, 0.55, 0.10,
                     mix(vec3(0.74, 0.55, 0.38), vec3(0.28, 0.18, 0.22), dusk),
                     mix(vec3(0.38, 0.26, 0.21), vec3(0.10, 0.07, 0.12), dusk));
  } else if (uLayer == 3) {
    outc = bakeDunes(u, v, dusk);
  } else if (uLayer == 4) {
    outc = bakeSand(vec2(u, v), dusk);
  } else {
    outc = bakeProps(vec2(u, v), dusk);
  }
  return outc;
}

/* Rotated-grid supersampling. Everything interesting in this shader is high
   frequency — strata banded 42 to the plate, wind ripples at 150, the
   silhouette itself — and at one sample per pixel all of it aliased into
   moire. Four jittered samples cost nothing offline and are the single
   cheapest quality win available here. */
vec3 gAcc;      // coverage-weighted colour
float gCov;     // summed coverage

void addSample(vec2 px, float dusk) {
  vec4 c = plate(px.x / uRes.x, 1.0 - px.y / uRes.y, dusk);
  gAcc += c.rgb * c.a;   // weighted by coverage, so a silhouette edge does
  gCov += c.a;           // not drag the colour of empty sky into the rock
}

void main() {
  float dusk = uDusk;
  gAcc = vec3(0.0);
  gCov = 0.0;

  addSample(gl_FragCoord.xy + vec2(-0.375, -0.125), dusk);
  addSample(gl_FragCoord.xy + vec2( 0.125, -0.375), dusk);
  addSample(gl_FragCoord.xy + vec2( 0.375,  0.125), dusk);
  addSample(gl_FragCoord.xy + vec2(-0.125,  0.375), dusk);

  vec3 col = gCov > 0.0001 ? gAcc / gCov : vec3(0.0);
  float alpha = gCov * 0.25;

  // A whisper of grain keeps the big gradients from banding in 8 bits.
  col += (hash3(vec3(gl_FragCoord.xy * 0.37, 1.0)) - 0.5) * 0.012;

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), alpha);
}`;

const canvas = document.getElementById('c');
let gl, prog, uni = {};

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(sh));
  }
  return sh;
}

function init() {
  gl = canvas.getContext('webgl', {
    alpha: true, premultipliedAlpha: false, antialias: false,
    preserveDrawingBuffer: true, depth: false, stencil: false
  });
  if (!gl) throw new Error('no webgl');

  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  for (const n of ['uRes', 'uDusk', 'uLayer']) uni[n] = gl.getUniformLocation(prog, n);
}

/** Render one plate and hand back a data URL. Called from the Node driver. */
window.bake = function (w, h, layer, dusk) {
  if (!gl) init();
  canvas.width = w;
  canvas.height = h;
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(uni.uRes, w, h);
  gl.uniform1f(uni.uDusk, dusk);
  gl.uniform1i(uni.uLayer, layer);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.finish();
  return canvas.toDataURL('image/png');
};

window.bakeReady = true;
</script>
