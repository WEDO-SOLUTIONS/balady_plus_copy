<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Drift the Desert — background baker</title>
<style>html,body{margin:0;background:#111;color:#ccc;font:13px monospace}canvas{display:block;max-width:100%}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Offline renderer for the game's background plates.

   This is the runtime shader's rich cousin. Nothing here has to fit in a
   frame budget on a cheap Android GPU, so it can afford what the live version
   could not: eight octaves of warped noise, sedimentary strata and erosion
   gullies in the rock, wind ripples and rim light on the dunes, two cloud
   decks with god rays. tools/bake_background.js drives it headlessly and
   writes the results into img/bg/.

   Every layer is horizontally seamless. Noise is sampled around a circle in
   x, so u = 0 and u = 1 land on the same point and the plates can wrap
   forever under parallax. */

const VERT = `
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FRAG = `
precision highp float;

uniform vec2  uRes;
uniform float uDusk;     // 0 = golden hour, 1 = dusk
uniform int   uLayer;    // 0 sky, 1 far range, 2 near range, 3 dunes

#define TAU 6.28318530718

/* ------------------------------------------------------------------ noise

   Seamless horizontally: the plate's x axis is wrapped around a cylinder and
   sampled with 3D noise, so u = 0 and u = 1 are the same point. Horizontal
   frequency therefore comes from the cylinder radius, never from scaling u —
   scaling u by a non-integer would break the wrap.                         */

float hash3(vec3 p) {
  return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);
}

float vnoise3(vec3 p) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  vec3 w = f * f * (3.0 - 2.0 * f);
  float n000 = hash3(i);
  float n100 = hash3(i + vec3(1.0, 0.0, 0.0));
  float n010 = hash3(i + vec3(0.0, 1.0, 0.0));
  float n110 = hash3(i + vec3(1.0, 1.0, 0.0));
  float n001 = hash3(i + vec3(0.0, 0.0, 1.0));
  float n101 = hash3(i + vec3(1.0, 0.0, 1.0));
  float n011 = hash3(i + vec3(0.0, 1.0, 1.0));
  float n111 = hash3(i + vec3(1.0, 1.0, 1.0));
  return mix(mix(mix(n000, n100, w.x), mix(n010, n110, w.x), w.y),
             mix(mix(n001, n101, w.x), mix(n011, n111, w.x), w.y), w.z);
}

// The radius sets how many features fit across the plate; y is already scaled.
float wnoise(float u, float y, float radius) {
  float a = u * TAU;
  return vnoise3(vec3(cos(a) * radius, sin(a) * radius, y));
}

float wfbm(float u, float y, float radius, int octaves) {
  float s = 0.0, amp = 0.5, r = radius, yy = y;
  for (int i = 0; i < 8; i++) {
    if (i >= octaves) break;
    s += amp * wnoise(u, yy, r);
    r *= 2.0; yy *= 2.0; amp *= 0.5;
  }
  return s;
}

// Ridged variant — the sharp creases that make dunes and rock read as solid.
float wridge(float u, float y, float radius, int octaves) {
  float s = 0.0, amp = 0.5, r = radius, yy = y;
  for (int i = 0; i < 8; i++) {
    if (i >= octaves) break;
    s += amp * (1.0 - abs(wnoise(u, yy, r) * 2.0 - 1.0));
    r *= 2.0; yy *= 2.0; amp *= 0.5;
  }
  return s;
}

// Vertical scale that makes noise of this radius isotropic on the plate: the
// cylinder puts TAU * radius noise units across the width, so the height needs
// the same units per pixel. Without this the two axes drift apart and the
// noise smears into corduroy.
float ys(float radius) {
  return TAU * radius * uRes.y / uRes.x;
}

/* -------------------------------------------------------------- palettes */

vec3 skyColour(float t, float dusk) {
  vec3 zenithDay  = vec3(0.06, 0.20, 0.38);
  vec3 midDay     = vec3(0.38, 0.55, 0.66);
  vec3 lowDay     = vec3(0.99, 0.80, 0.52);
  vec3 zenithDusk = vec3(0.03, 0.04, 0.13);
  vec3 midDusk    = vec3(0.18, 0.13, 0.27);
  vec3 lowDusk    = vec3(0.78, 0.35, 0.24);
  vec3 zenith = mix(zenithDay, zenithDusk, dusk);
  vec3 mid    = mix(midDay,    midDusk,    dusk);
  vec3 low    = mix(lowDay,    lowDusk,    dusk);
  return t < 0.62 ? mix(zenith, mid, smoothstep(0.0, 0.62, t))
                  : mix(mid, low, smoothstep(0.62, 1.0, t));
}

vec3 sunColour(float dusk) {
  return mix(vec3(1.0, 0.93, 0.76), vec3(1.0, 0.50, 0.30), dusk);
}

/* ------------------------------------------------------------------- sky */

vec4 bakeSky(float u, float v, float dusk) {
  // v: 0 at the top of the plate, 1 at the horizon.
  vec3 col = skyColour(v, dusk);
  vec3 sunT = sunColour(dusk);
  vec2 sunPos = vec2(0.66, 0.955 - 0.02 * dusk);
  float aspect = uRes.x / uRes.y;
  float sunDist = length((vec2(u, v) - sunPos) * vec2(aspect, 1.0));

  // --- high cirrus: stretched thin, so low vertical frequency -------------
  float cir = wfbm(u, v * ys(7.0) * 2.4, 7.0, 5);
  cir = smoothstep(0.50, 0.72, cir) * smoothstep(0.04, 0.26, v) * smoothstep(0.70, 0.40, v);
  vec3 cirCol = mix(vec3(1.0, 0.96, 0.90), vec3(0.62, 0.34, 0.36), dusk);
  col = mix(col, cirCol, cir * 0.40);

  // --- cumulus deck: domain-warped, lit from the sun side -----------------
  // Billow noise, not plain fbm: cumulus is built of stacked cauliflower
  // heads, and a smooth field gave flat grey smoke.
  float warp = wfbm(u, v * ys(1.8), 1.8, 4);
  // Flattened on purpose, and warped only a little: cumulus is wider than it
  // is tall. y advances faster than x here, which squashes the noise into
  // that shape; slowing it down stretched the deck into stalactites, and a
  // strong vertical warp hung the whole thing in drips.
  float yc = v * ys(3.0) * 1.75 + warp * 0.22;
  float dens = wfbm(u + warp * 0.03, yc, 3.0, 6);
  dens = mix(dens, 1.0 - abs(dens * 2.0 - 1.0), 0.40);
  dens += (wfbm(u, v * ys(11.0), 11.0, 3) - 0.5) * 0.08;   // frayed edges

  // Held clear of the horizon: the reference has a clean warm band under the
  // deck, and clouds running all the way down fought the haze.
  float band = smoothstep(0.16, 0.40, v) * smoothstep(0.90, 0.64, v);
  float cover = smoothstep(0.60, 0.74, dens) * band;

  // Shade from the density gradient towards the sun. The offset is small on
  // purpose: a long one smeared every cloud into a column of virga.
  float densUp = wfbm(u + warp * 0.03, yc - 0.13, 3.0, 5);
  densUp = mix(densUp, 1.0 - abs(densUp * 2.0 - 1.0), 0.40);
  float lit = smoothstep(-0.05, 0.08, densUp - dens);

  vec3 cloudLit  = mix(vec3(1.0, 0.98, 0.94), vec3(0.88, 0.50, 0.37), dusk);
  vec3 cloudDark = mix(vec3(0.62, 0.58, 0.60), vec3(0.22, 0.15, 0.23), dusk);
  vec3 cloudCol = mix(cloudDark, cloudLit, lit);
  cloudCol += sunT * exp(-sunDist * 4.0) * 0.5;
  col = mix(col, cloudCol, cover);

  // --- a low deck, flattened and far off, for depth under the big one -----
  float lowN = wfbm(u + 4.1, v * ys(6.0) * 2.6 + 9.0, 6.0, 4);
  float lowBand = smoothstep(0.62, 0.74, v) * smoothstep(0.94, 0.80, v);
  float lowCover = smoothstep(0.50, 0.66, lowN) * lowBand * 0.75;
  vec3 lowCol = mix(mix(vec3(0.98, 0.90, 0.78), vec3(0.70, 0.40, 0.34), dusk),
                    sunT, exp(-sunDist * 3.0) * 0.5);
  col = mix(col, lowCol, lowCover);

  // --- sun: bloom, then a restrained fan of rays through the deck ---------
  col += sunT * (0.38 * exp(-sunDist * 5.0) + 0.85 * exp(-sunDist * 20.0));

  float ang = atan(v - sunPos.y, (u - sunPos.x) * aspect);
  float rays = wfbm(ang / TAU + 0.5, 0.0, 9.0, 3);
  col += sunT * smoothstep(0.52, 0.92, rays) * exp(-sunDist * 5.5) * 0.18 * (1.0 - cover * 0.8);

  // Brighter than the bloom around it, or the disc reads as a dark hole
  // punched in its own glow.
  col = mix(col, sunT * 2.1, smoothstep(0.032, 0.020, sunDist));

  // Aerial haze piling up at the horizon.
  col = mix(col, skyColour(1.0, dusk), smoothstep(0.72, 1.0, v) * 0.72);

  // And the dust in it. The air over the Nefud is never clear at this time of
  // day: there is always a tan band standing on the horizon, and without it
  // the sky reads as somewhere much wetter than Arabia.
  vec3 dustCol = mix(vec3(0.85, 0.72, 0.53), vec3(0.42, 0.25, 0.25), dusk);
  col = mix(col, dustCol, smoothstep(0.68, 1.0, v) * 0.45);

  return vec4(col, 1.0);
}

/* ----------------------------------------------------------------- rock */

// Silhouette height of a range, 0..1 of the plate height. Terracing the
// height field is what turns hills into flat-topped buttes.
float rangeHeight(float u, float seed, float radius, float fill) {
  float h = wfbm(u, seed, radius, 4);
  h = smoothstep(0.24, 0.78, h);

  // Four terraces with soft risers.
  float steps = 4.0;
  float t = h * steps;
  h = (floor(t) + smoothstep(0.34, 0.66, fract(t))) / steps;

  // A little erosion on the rim so the plateaus are not perfectly level.
  h += (wfbm(u, seed + 5.0, radius * 4.0, 3) - 0.5) * 0.06;
  return clamp(h, 0.0, 1.0) * fill;
}

vec4 bakeRange(float u, float v, float dusk, float seed, float radius, float fill,
               float hazeAmt, vec3 rockLit, vec3 rockDark) {
  float h = rangeHeight(u, seed, radius, fill);
  float top = 1.0 - h;
  if (v < top) return vec4(0.0);

  float into = (v - top) / max(0.0001, 1.0 - top);   // 0 crest .. 1 base

  // Sedimentary strata: banded in v, drifting slowly in u so they follow the
  // rock rather than ruling straight lines across the plate.
  float drift = wfbm(u, seed * 2.0, radius * 0.6, 3);
  float bands = 0.5 + 0.5 * sin((v + drift * 0.05) * 42.0);
  bands *= smoothstep(0.02, 0.18, into);

  // Erosion gullies: high frequency across the face, low down it.
  float gully = wridge(u, v * ys(radius * 3.0) * 0.22 + seed, radius * 3.0, 3);
  gully = smoothstep(0.55, 0.95, gully) * smoothstep(0.05, 0.4, into);

  // Light from the sun side: the slope of the silhouette tells us which way
  // the face turns.
  float slope = rangeHeight(u + 0.0025, seed, radius, fill) - h;
  float face = clamp(0.5 - slope * 18.0, 0.0, 1.0);

  vec3 col = mix(rockDark, rockLit, face);
  col *= 1.0 - smoothstep(0.1, 1.0, into) * 0.22;      // shade down the face
  col *= 0.90 + 0.10 * bands;
  col *= 1.0 - gully * 0.16;

  // Talus fans at the base catch more light and more dust.
  col = mix(col, mix(col, rockLit, 0.30) * 1.03, smoothstep(0.62, 1.0, into));

  vec3 haze = skyColour(1.0, dusk);
  col = mix(col, haze, hazeAmt + (1.0 - hazeAmt) * smoothstep(0.72, 1.0, into) * 0.5);

  float edge = smoothstep(0.0, 1.5 / uRes.y, v - top);
  return vec4(col, edge);
}

/* ---------------------------------------------------------------- dunes */

vec4 bakeDunes(float u, float v, float dusk) {
  vec3 col = vec3(0.0);
  float alpha = 0.0;

  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    float seed = 11.0 + fi * 7.0;
    float radius = 1.3 + fi * 0.7;
    // Two scales of crest: the long sweep of the ridge, plus the scallops
    // that stop it from ruling a straight line across the plate.
    float crest = wfbm(u, seed, radius, 4) + (wfbm(u, seed + 31.0, radius * 3.4, 3) - 0.5) * 0.35;
    float top = 0.08 + fi * 0.26 + (crest - 0.5) * 0.19;
    if (v < top) continue;

    float into = (v - top) / max(0.0001, 1.0 - top);   // 0 crest .. 1 base
    float slope = wfbm(u + 0.0025, seed, radius, 4) - wfbm(u, seed, radius, 4);

    vec3 lit  = mix(vec3(0.94, 0.75, 0.50), vec3(0.51, 0.30, 0.30), dusk);
    vec3 dark = mix(vec3(0.48, 0.28, 0.15), vec3(0.16, 0.10, 0.13), dusk);

    // The face has to shade *down* the slope, not just across it: lighting
    // that depended on u alone painted each column a single flat colour.
    float down = smoothstep(0.0, 0.95, into);
    float aspect = clamp(0.5 - slope * 18.0, 0.0, 1.0);   // which way it turns

    // Relief across the face. Without it the shading term varies in u only,
    // and the lower half of every plate hung in vertical curtains.
    float relief = wfbm(u + into * 0.09, v * ys(2.6) * 1.3 + seed * 3.0, 2.6, 4);
    // Kept clear of 1.0 on purpose: once the shading term clipped, the dark
    // side of every column flattened to the same value and the face hung in
    // vertical curtains again.
    float shade = clamp(down * (0.42 + 0.34 * (1.0 - aspect)) + (relief - 0.5) * 0.34 * down,
                        0.0, 0.96);
    vec3 c = mix(lit, dark, shade);

    // Mottling in both axes, centred on 1.0: scaling the sand *up* clipped
    // the blue channel first and turned the crests chartreuse.
    float mottle = wfbm(u, v * ys(2.2), 2.2, 4);
    float grain = wfbm(u, v * ys(9.0), 9.0, 3);
    c *= 0.97 + 0.16 * (mottle - 0.5) + 0.10 * (grain - 0.5);

    // Wind ripples follow the crest: wide across the plate, tight up it, and
    // fading out as the slope turns away.
    float ripple = wridge(u, v * 150.0 + seed, 5.0, 2);
    c *= 1.0 + (ripple - 0.5) * 0.14 * (1.0 - down * 0.6);

    // Rim light right on the crest, and a shadow pooling just under it. It
    // is a blend, not an addition: adding blew the crest past white and the
    // clipped result read as a pale green ledge along the horizon.
    vec3 rim = mix(vec3(1.00, 0.95, 0.82), vec3(0.86, 0.56, 0.48), dusk);
    c = mix(c, rim, smoothstep(0.055, 0.0, into) * 0.52);
    c *= 1.0 - smoothstep(0.02, 0.10, into) * smoothstep(0.30, 0.12, into) * 0.12;

    // Scattered scrub and stones, thinning into the distance.
    float sprinkle = step(0.9955, hash3(vec3(floor(u * 1400.0), floor(v * 700.0), fi)));
    c *= 1.0 - sprinkle * 0.5 * smoothstep(0.08, 0.45, into);

    c *= 1.0 - fi * 0.09;

    float edge = smoothstep(0.0, 1.5 / uRes.y, v - top);
    col = mix(col, c, edge);
    alpha = max(alpha, edge);
  }

  col = mix(skyColour(1.0, dusk), col, smoothstep(0.0, 0.10, v));
  return vec4(col, alpha);
}

/* ----------------------------------------------------------------- sand

   The desert floor, seen from above and tiled across the ground plane by the
   game. Everything here has to wrap in BOTH axes, so the lattice is wrapped
   with mod() and every ripple frequency is a whole number of cycles per tile.

   Deliberately no large forms: the texture repeats several times across the
   near field, and anything bigger than a stride would announce the grid. The
   big shapes are the game's job; this supplies what a photograph of sand has
   and a gradient does not — ripples, grain, drift and stones. */

float thash(vec2 c, float n) {
  c = mod(c, vec2(n));
  return fract(sin(dot(c, vec2(127.1, 311.7))) * 43758.5453123);
}

float tnoise(vec2 p, float n) {
  vec2 i = floor(p), f = fract(p);
  vec2 w = f * f * (3.0 - 2.0 * f);
  float a = thash(i, n);
  float b = thash(i + vec2(1.0, 0.0), n);
  float c = thash(i + vec2(0.0, 1.0), n);
  float d = thash(i + vec2(1.0, 1.0), n);
  return mix(mix(a, b, w.x), mix(c, d, w.x), w.y);
}

/* uv in 0..1; cells is how many lattice cells the first octave spans. */
float tfbm(vec2 uv, float cells, int octaves) {
  float s = 0.0, amp = 0.5, n = cells;
  for (int i = 0; i < 8; i++) {
    if (i >= octaves) break;
    s += amp * tnoise(uv * n, n);
    n *= 2.0; amp *= 0.5;
  }
  return s;
}

/* A second hash, on a plain vec2 — used by the track's ruts and by the prop
   sheet, neither of which needs to tile. */
float h21(vec2 p) {
  return fract(sin(dot(p, vec2(41.7, 289.3))) * 43758.5453123);
}

/* Height of the sand surface at uv, in arbitrary units. Sampled three times
   per pixel so the shading can come from a real gradient rather than from a
   guess about which way the slope faces. */
float sandHeight(vec2 uv) {
  // Meandering drift, the low swells between ripple fields.
  float drift = tfbm(uv, 3.0, 4);

  // Two ripple trains crossing at a shallow angle, each warped by the drift.
  // Integer wave vectors keep them tiling; the warp keeps them from ruling
  // straight lines across the texture.
  float w1 = tfbm(uv, 5.0, 3) - 0.5;
  float w2 = tfbm(uv + 0.37, 7.0, 3) - 0.5;
  float r1 = sin(TAU * (3.0 * uv.x + 26.0 * uv.y) + w1 * 17.0);
  float r2 = sin(TAU * (11.0 * uv.x + 31.0 * uv.y) + w2 * 14.0);

  // Ripples are not sine waves: the windward side is long, the lee side short.
  r1 = 1.0 - pow(abs(r1), 0.65);
  r2 = 1.0 - pow(abs(r2), 0.70);

  // The two trains take turns across the field instead of both running
  // everywhere. Evenly spaced parallel lines over a whole tile read as wood
  // grain the moment the tile repeats.
  float patch = smoothstep(0.32, 0.64, drift);
  float ripple = r1 * 0.60 * (1.0 - patch * 0.75) + r2 * 0.52 * patch;

  // Grain, right at the limit of what survives the JPEG.
  float grain = tfbm(uv, 90.0, 2) - 0.5;

  return drift * 1.30 + ripple * 0.26 + grain * 0.045;
}

vec4 bakeSand(vec2 uv, float dusk) {
  float e = 1.0 / uRes.x;
  float h = sandHeight(uv);
  float hx = sandHeight(uv + vec2(e, 0.0));
  float hy = sandHeight(uv + vec2(0.0, e));

  // Slope into a normal. The vertical exaggeration is what decides whether
  // this reads as sand or as crumpled paper.
  vec3 nrm = normalize(vec3(-(hx - h) / e * 0.055, -(hy - h) / e * 0.055, 1.0));

  // Low sun raking across the tile, away from the camera, so the lee sides
  // face the player in shadow — the same read as the reference photograph.
  vec3 L = normalize(vec3(-0.55, -0.78, 0.30));
  float diff = clamp(dot(nrm, L), 0.0, 1.0);
  float sky = 0.5 + 0.5 * nrm.z;                      // ambient from above

  // Nefud red, not Sahara yellow. The quartz here is coated in iron oxide,
  // which is why Saudi dune fields photograph apricot in the sun and rust in
  // the shade; the yellow-tan this started as read as a generic desert.
  vec3 lit  = mix(vec3(0.94, 0.74, 0.50), vec3(0.54, 0.31, 0.30), dusk);
  vec3 mid  = mix(vec3(0.76, 0.51, 0.29), vec3(0.36, 0.20, 0.21), dusk);
  vec3 dark = mix(vec3(0.42, 0.23, 0.12), vec3(0.15, 0.09, 0.11), dusk);

  vec3 col = mix(dark, mid, sky);
  col = mix(col, lit, diff * 0.85);

  // Colour drift: sand is never one hue over a whole field, and the paler
  // patches are where the wind has stripped the red coating off.
  float tone = tfbm(uv + 0.71, 2.0, 3);
  col *= 0.93 + 0.16 * tone;
  col = mix(col, col * vec3(1.05, 1.01, 0.94), tfbm(uv + 1.31, 4.0, 3));

  // Stones. Two sizes, each on its own wrapped lattice. Every pixel tests the
  // nine cells around it rather than only its own: a stone confined to one
  // cell had its shadow clipped at the cell border, which tiled the texture
  // with little grey squares.
  for (int k = 0; k < 2; k++) {
    float cells = k == 0 ? 26.0 : 44.0;
    float base = k == 0 ? 0.20 : 0.10;
    float thresh = k == 0 ? 0.945 : 0.972;
    vec2 gp = uv * cells;
    vec2 home = floor(gp);

    // Shadows first, so no stone is darkened by its neighbour's.
    for (int oy = -1; oy <= 1; oy++) {
      for (int ox = -1; ox <= 1; ox++) {
        vec2 cell = home + vec2(float(ox), float(oy));
        if (thash(cell + float(k) * 13.0, cells) <= thresh) continue;
        vec2 at = cell + vec2(thash(cell + 3.0, cells), thash(cell + 9.0, cells));
        float r = base * (0.55 + thash(cell + 5.0, cells) * 0.85);
        float sh = smoothstep(r * 2.1, r * 0.7, length(gp - at - vec2(0.55, 0.80) * r));
        col *= 1.0 - sh * 0.34;
      }
    }

    for (int oy = -1; oy <= 1; oy++) {
      for (int ox = -1; ox <= 1; ox++) {
        vec2 cell = home + vec2(float(ox), float(oy));
        if (thash(cell + float(k) * 13.0, cells) <= thresh) continue;
        vec2 at = cell + vec2(thash(cell + 3.0, cells), thash(cell + 9.0, cells));
        float r = base * (0.55 + thash(cell + 5.0, cells) * 0.85);

        // Squashed and turned, so they are not a field of identical discs.
        // Only the silhouette turns: the first version lit the stone from the
        // rotated frame too, which gave every pebble its own private sun.
        vec2 raw = gp - at;
        float rot = thash(cell + 21.0, cells) * TAU;
        vec2 d = vec2(raw.x * cos(rot) - raw.y * sin(rot), raw.x * sin(rot) + raw.y * cos(rot));
        d.y /= 0.62 + thash(cell + 27.0, cells) * 0.5;
        float dist = length(d) / r;

        float stone = smoothstep(1.0, 0.86, dist);
        if (stone <= 0.0) continue;

        // Desert pavement is two rocks, not one: chalky limestone spalled
        // off the escarpment, and dark ironstone blown clean by the wind.
        float kind = thash(cell + 53.0, cells);
        vec3 pale = mix(vec3(0.56, 0.50, 0.42), vec3(0.25, 0.19, 0.20), dusk);
        vec3 iron = mix(vec3(0.30, 0.25, 0.21), vec3(0.11, 0.08, 0.10), dusk);
        vec3 sc = mix(iron, pale, step(0.42, kind));
        sc *= 0.82 + 0.36 * thash(cell + 17.0, cells);
        // Curvature in the world frame: the upsun shoulder catches the light,
        // the far side does not, which is all it takes for a disc to read as
        // a pebble sitting on the sand.
        // The lit shoulder is brightened, not blown out: a gain that ran past
        // 1.7 turned every pale stone into a golf ball.
        float shade = clamp(0.52 - (raw.x * 0.55 + raw.y * 0.78) / r, 0.0, 1.25);
        sc *= 0.70 + 0.54 * shade;
        col = mix(col, sc, stone);
      }
    }
  }

  return vec4(col, 1.0);
}

/* ---------------------------------------------------------------- track

   The road, as a second ground texture tiled the same way as the sand and
   clipped to the track by the game. A desert track in Saudi is not a road: it
   is a braid of tyre ruts worn through the loose sand into the crust
   underneath, so it is paler and smoother than what is either side of it,
   with the sand it displaced piled along its berms.

   Travel runs along the texture's y axis, so the ruts are constant in y and
   the tread blocks repeat along it. The band is centred on the tile and fades
   back into ordinary sand at both edges, because the track is between a half
   and two thirds of a tile wide depending how far down the frame it is. */

/* The road tile spans the road, not two screen widths, so one texel across
   is about half a texel along. Anything that has to come out round on screen
   is measured through this. */
#define ROAD_ASPECT 0.542

float trackHeight(vec2 uv, out float crust, out float wear) {
  // The compacted surface itself: the same drift as the open sand, but the
  // ripples on it have long since been driven flat.
  float drift = tfbm(uv, 3.0, 4);
  float h = drift * 0.75;
  crust = 0.0;
  wear = 0.0;

  for (int i = 0; i < 7; i++) {
    float fi = float(i);
    float x0 = 0.5 + (h21(vec2(fi, 7.3)) - 0.5) * 0.78;
    // The ruts run straight. They used to wander a whole cycle per tile,
    // because a tile is the longest wavelength a tiling texture has — and a
    // tile is five metres of desert, which arrives twice a second and read as
    // the road snaking. The wander belongs to the road's centre line, which
    // the game bends over hundreds of metres instead.
    float mean = sin(TAU * uv.y + fi * 2.1) * 0.004;
    float d = abs(uv.x - x0 - mean);
    float w = 0.028 + h21(vec2(fi, 11.7)) * 0.024;

    float groove = 1.0 - smoothstep(w * 0.45, w, d);
    float berm = smoothstep(w, w * 1.5, d) * (1.0 - smoothstep(w * 1.5, w * 2.6, d));

    h += -groove * 0.062 + berm * 0.032;
    crust = max(crust, groove);
    wear = max(wear, groove + berm * 0.5);
  }

  // Tread: blocks across the rut, faint, and only where a tyre actually ran.
  float blocks = 0.5 + 0.5 * sin(TAU * 96.0 * uv.y + sin(TAU * 8.0 * uv.x) * 0.6);
  h += (blocks - 0.5) * 0.010 * crust;

  // Loose sand thrown out of the ruts, dragged along the direction of
  // travel, plus the odd churned patch and the grain underneath it all.
  float drag = sin(TAU * (20.0 * uv.x + 2.0 * uv.y) + tfbm(uv + 7.1, 6.0, 3) * 12.0);
  h += drag * 0.010 * (1.0 - crust * 0.6);
  h += (tfbm(uv + 2.3, 30.0, 3) - 0.5) * 0.024 * (1.0 - crust * 0.7);
  h += (tfbm(uv + 5.9, 90.0, 2) - 0.5) * 0.050;
  return h;
}

vec4 bakeTrack(vec2 uv, float dusk) {
  float e = 1.0 / uRes.x;
  float c0, w0, c1, w1, c2, w2;
  float h = trackHeight(uv, c0, w0);
  float hx = trackHeight(uv + vec2(e, 0.0), c1, w1);
  float hy = trackHeight(uv + vec2(0.0, e), c2, w2);

  // The x slope is measured through the tile's aspect, or the ruts light as
  // though they were twice as steep as they are.
  vec3 nrm = normalize(vec3(-(hx - h) / e * 0.055 * ROAD_ASPECT,
                            -(hy - h) / e * 0.055, 1.0));
  vec3 L = normalize(vec3(-0.55, -0.78, 0.30));
  float diff = clamp(dot(nrm, L), 0.0, 1.0);
  float sky = 0.5 + 0.5 * nrm.z;

  // Driven sand loses its red coat and shows the pale crust underneath, so
  // the track reads lighter and greyer than the dune it cuts across.
  vec3 lit  = mix(vec3(0.90, 0.71, 0.48), vec3(0.51, 0.30, 0.29), dusk);
  vec3 mid  = mix(vec3(0.71, 0.49, 0.28), vec3(0.34, 0.19, 0.20), dusk);
  vec3 dark = mix(vec3(0.38, 0.22, 0.12), vec3(0.13, 0.08, 0.10), dusk);

  vec3 col = mix(dark, mid, sky);
  col = mix(col, lit, diff * 0.85);

  // The crust is paler than the dune around it, but only a little: driven
  // sand is still Nefud sand, and a heavy hand here turned the track into a
  // concrete strip laid across the desert.
  vec3 crustCol = mix(vec3(0.74, 0.60, 0.43), vec3(0.35, 0.22, 0.23), dusk);
  col = mix(col, crustCol, c0 * 0.34);
  col *= 0.94 + 0.14 * tfbm(uv + 0.71, 2.0, 3);

  // Gravel, shouldered out of the ruts and lying along their edges.
  for (int k = 0; k < 2; k++) {
    float cells = k == 0 ? 34.0 : 58.0;
    float base = k == 0 ? 0.13 : 0.08;
    float thresh = k == 0 ? 0.955 : 0.976;
    // Fewer cells across than along, so each one is square on the ground and
    // the stones in it come out round rather than stretched into lozenges.
    float cellsX = max(2.0, floor(cells * ROAD_ASPECT + 0.5));
    vec2 gp = uv * vec2(cellsX, cells);
    vec2 home = floor(gp);
    for (int oy = -1; oy <= 1; oy++) {
      for (int ox = -1; ox <= 1; ox++) {
        vec2 cell = home + vec2(float(ox), float(oy));
        vec2 wrapped = vec2(mod(cell.x, cellsX), mod(cell.y, cells));
        if (h21(wrapped + float(k) * 13.0) <= thresh) continue;
        vec2 at = cell + vec2(h21(wrapped + 3.0), h21(wrapped + 9.0));
        float r = base * (0.55 + h21(wrapped + 5.0) * 0.85);
        vec2 raw = gp - at;
        float sh = smoothstep(r * 2.0, r * 0.7, length(raw - vec2(0.55, 0.80) * r));
        col *= 1.0 - sh * 0.26;
        float stone = smoothstep(1.0, 0.85, length(raw) / r);
        if (stone <= 0.0) continue;
        vec3 sc = mix(mix(vec3(0.27, 0.22, 0.18), vec3(0.58, 0.52, 0.43),
                          step(0.45, h21(wrapped + 53.0))),
                      vec3(0.12, 0.09, 0.10), dusk);
        sc *= 0.82 + 0.36 * h21(wrapped + 17.0);
        sc *= 0.70 + 0.54 * clamp(0.52 - (raw.x * 0.55 + raw.y * 0.78) / r, 0.0, 1.25);
        col = mix(col, sc, stone);
      }
    }
  }

  // Back to plain sand at the edges of the tile: the clip the game applies is
  // never exactly this wide, and a hard end to the ruts would show.
  float band = smoothstep(0.015, 0.10, 0.5 - abs(uv.x - 0.5));
  vec4 open = bakeSand(uv, dusk);
  return vec4(mix(open.rgb, col, band), 1.0);
}

/* ---------------------------------------------------------------- props

   A sheet of the things that stand beside the track: four rocks and four dry
   bushes, 512 px each in a 4x2 grid. They used to be drawn as canvas paths,
   which was fine over a painted floor and stopped being fine the moment the
   sand under them became a photograph — a flat blob with an ellipse of
   highlight on it reads as a sticker.

   Both are lit from the upper left, like everything else in the bake, and
   both are cut off at their waterline so the game can bed them into the sand
   with its own contact shadow. */


/* Height of a rock at p (0..1 inside its cell), 0 outside it. Sampled three
   times per pixel: the shading is a real gradient, not a guess.

   Two geologies, because the ground here has two. The Tuwaiq escarpment sheds
   pale limestone, which weathers into flat, layered, angular slabs; the harrat
   lava fields to the west shed ironstone, which weathers round and dark. Mixed
   together on a gravel plain, they are half of what makes a Saudi desert floor
   look like itself. */
float rockHeight(vec2 p, float seed, float slab, out float mask) {
  // Per-rock proportions, or the three limestone slabs come out as one rock
  // drawn three times.
  float wide = 0.34 + h21(vec2(seed, 5.0)) * 0.14;
  float tall = (0.26 + h21(vec2(seed, 9.0)) * 0.12) - slab * 0.07;
  vec2 q = (p - vec2(0.5, 0.635)) / vec2(wide, tall);
  float ang = atan(q.y, q.x);

  // A rounded polygon, not a cloud: the radius is constant across each of
  // seven sectors and eased across the corners, with a little harmonic noise
  // on top. Sines alone gave blobs that read as dough. Limestone keeps its
  // corners; ironstone rounds them off.
  float sect = (ang / TAU + 0.5) * 7.0;
  float si = floor(sect);
  float sf = smoothstep(0.62 - slab * 0.45, 1.0, fract(sect));
  float ra = 0.80 + h21(vec2(mod(si, 7.0), seed)) * 0.34;
  float rb = 0.80 + h21(vec2(mod(si + 1.0, 7.0), seed)) * 0.34;
  float lump = mix(ra, rb, sf)
    + 0.055 * sin(ang * 5.0 + seed * 2.1)
    + 0.030 * sin(ang * 11.0 + seed * 1.9);

  float r = length(q) / lump;
  mask = 1.0 - smoothstep(0.94, 1.0, r);
  if (mask <= 0.0) return 0.0;

  // A dome, roughened by two scales of noise and creased by a ridged one.
  // Heights are in the same units as p, so the gradient below is a real
  // slope: scaling it down by fifty shaded every rock flat.
  float dome = sqrt(max(0.0, 1.0 - r * r));
  float bump = tfbm(p * 0.9 + seed, 4.0, 4) - 0.5;
  float crack = 1.0 - abs(tfbm(p * 1.3 + seed * 2.0, 7.0, 3) * 2.0 - 1.0);

  // Bedding planes: the horizontal steps that say sedimentary rock.
  float beds = slab * 0.022 * (fract(p.y * 7.0 + tfbm(p, 3.0, 3) * 0.6) - 0.5);

  return dome * (0.34 - slab * 0.10) + bump * 0.020 - pow(crack, 4.0) * 0.016 + beds;
}

/* The crevices again, as colour rather than as height: a shadow in a crack
   does not come back out. */
float rockCrevice(vec2 p, float seed) {
  float crack = 1.0 - abs(tfbm(p * 1.3 + seed * 2.0, 7.0, 3) * 2.0 - 1.0);
  return pow(crack, 4.0);
}

vec4 rockSprite(vec2 p, float id, float dusk) {
  float seed = 3.1 + id * 7.37;
  float lime = id < 3.0 ? 1.0 : 0.0;          // limestone slab or ironstone
  float e = 1.0 / 512.0;
  float m, mx, my;
  float h = rockHeight(p, seed, lime, m);
  if (m <= 0.0) return vec4(0.0);
  float hx = rockHeight(p + vec2(e, 0.0), seed, lime, mx);
  float hy = rockHeight(p + vec2(0.0, e), seed, lime, my);

  vec3 nrm = normalize(vec3(-(hx - h) / e, -(hy - h) / e, 1.0));
  vec3 L = normalize(vec3(-0.58, -0.72, 0.38));
  float diff = clamp(dot(nrm, L), 0.0, 1.0);
  float sky = 0.5 + 0.5 * nrm.z;

  vec3 lit  = mix(mix(vec3(0.58, 0.51, 0.43), vec3(0.70, 0.65, 0.54), lime),
                  vec3(0.32, 0.22, 0.24), dusk);
  vec3 mid  = mix(mix(vec3(0.33, 0.28, 0.24), vec3(0.48, 0.44, 0.36), lime),
                  vec3(0.16, 0.11, 0.13), dusk);
  vec3 dark = mix(mix(vec3(0.13, 0.11, 0.10), vec3(0.19, 0.17, 0.14), lime),
                  vec3(0.05, 0.04, 0.05), dusk);

  // Weighted towards the diffuse term: an ambient-heavy mix lit every face
  // of the rock about equally, which is what made them read as bread rolls.
  vec3 col = mix(dark, mid, sky * 0.78);
  col = mix(col, lit, pow(diff, 1.35) * 1.05);

  // Mineral streaks, plus the red dust that gets into everything out here.
  float grain = tfbm(p * 2.0 + seed * 3.0, 14.0, 3);
  col *= 0.86 + 0.28 * grain;
  float dust = smoothstep(0.55, 0.95, nrm.z) * smoothstep(0.35, 0.05, p.y);
  col = mix(col, mix(vec3(0.74, 0.54, 0.34), vec3(0.32, 0.20, 0.22), dusk), dust * 0.30);

  col *= 1.0 - rockCrevice(p, seed) * 0.35;

  // Bedded into the sand: the last tenth fades out rather than ending on a
  // line, and the whole lower third falls away into its own shadow.
  float bed = smoothstep(0.96, 0.90, p.y);
  col *= 1.0 - smoothstep(0.62, 0.94, p.y) * 0.42;
  return vec4(col, m * bed);
}

/* Distance from p to the segment ab. */
float segDist(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a, ba = b - a;
  float t = clamp(dot(pa, ba) / max(1e-6, dot(ba, ba)), 0.0, 1.0);
  return length(pa - ba * t);
}

/* Where stem fi of a plant ends up, given its spread and length. Shared so
   the seed heads and leaves can sit on the stems that carry them. */
vec2 stemTip(float fi, float seed, float spread, float len0, float len1) {
  float r1 = h21(vec2(fi, seed));
  float r2 = h21(vec2(fi + 31.0, seed));
  float r3 = h21(vec2(fi + 67.0, seed));
  float r4 = h21(vec2(fi + 97.0, seed));
  vec2 root = vec2(0.5 + (r4 - 0.5) * 0.13, 0.95 - r3 * 0.03);
  float ang = -1.5708 + (r1 - 0.5) * spread;
  float len = len0 + r2 * len1 - abs(r1 - 0.5) * len1 * 0.4;
  vec2 dir = vec2(cos(ang), sin(ang));
  vec2 tip = root + dir * len;
  vec2 side = vec2(-dir.y, dir.x) * (r1 - 0.5) * len * 0.55;
  return tip + vec2(side.x * 0.5, len * 0.10 * r2);
}

/* The plants beside a Saudi track, as seven sprites:

   0,1  thumam / arfaj — straw tussocks, the commonest thing on a gravel plain
   2,3  ghada / arta   — dense shrubs of thin grey-green whips, no leaves
   4    a dead one     — bleached twigs, which is half of what is out there
   5    a saltbush     — a low grey-green mound of tiny leaves
   6    a thorn bush   — a short trunk under a flat, dark canopy

   All of them are built from the same stems, with the numbers and the palette
   doing the work. */
vec4 plantSprite(vec2 p, float k, float dusk) {
  float seed = 17.0 + k * 11.13;
  int kind = int(k + 0.5);

  float spread = 1.45;
  float len0 = 0.22, len1 = 0.34;
  float wRoot = 0.0065, wTip = 0.0012;
  float heads = 9.0, headR = 0.011;
  vec3 tipCol = vec3(0.84, 0.74, 0.46);
  vec3 rootCol = vec3(0.31, 0.29, 0.14);
  vec3 headCol = vec3(0.78, 0.68, 0.40);
  float stems = 38.0;
  float trunk = 0.0;

  if (kind == 2 || kind == 3) {               // ghada: whips, no seed heads
    spread = 1.50; len0 = 0.24; len1 = 0.38;
    wRoot = 0.0042; wTip = 0.0013;
    heads = 0.0; stems = 56.0;
    tipCol = vec3(0.47, 0.49, 0.34);
    rootCol = vec3(0.25, 0.23, 0.16);
  } else if (kind == 4) {                     // dead: sparse, bleached, stiff
    spread = 2.20; len0 = 0.18; len1 = 0.30;
    wRoot = 0.0070; wTip = 0.0020;
    heads = 0.0; stems = 22.0;
    tipCol = vec3(0.70, 0.63, 0.51);
    rootCol = vec3(0.33, 0.28, 0.21);
  } else if (kind == 5) {                     // saltbush: a low leafy mound
    spread = 2.40; len0 = 0.10; len1 = 0.17;
    wRoot = 0.0055; wTip = 0.0020;
    heads = 30.0; headR = 0.020; stems = 30.0;
    tipCol = vec3(0.41, 0.43, 0.29);
    rootCol = vec3(0.24, 0.23, 0.16);
    headCol = vec3(0.42, 0.44, 0.29);
  } else if (kind == 6) {                     // thorn bush over a short trunk
    spread = 1.60; len0 = 0.26; len1 = 0.22;
    wRoot = 0.0085; wTip = 0.0020;
    heads = 20.0; headR = 0.019; stems = 20.0;
    tipCol = vec3(0.38, 0.36, 0.25);
    rootCol = vec3(0.23, 0.19, 0.13);
    headCol = vec3(0.32, 0.36, 0.24);
    trunk = 1.0;
  }

  tipCol = mix(tipCol, vec3(0.35, 0.25, 0.27), dusk);
  rootCol = mix(rootCol, vec3(0.11, 0.10, 0.11), dusk);
  headCol = mix(headCol, vec3(0.28, 0.22, 0.23), dusk);

  float alpha = 0.0;
  vec3 col = vec3(0.0);
  float best = 1e9;

  if (trunk > 0.5) {
    float d = segDist(p, vec2(0.5, 0.97), vec2(0.5 + 0.02, 0.70));
    float a = 1.0 - smoothstep(0.013, 0.021, d);
    if (a > 0.0) {
      col = mix(rootCol, tipCol, 0.3) * (0.8 + 0.5 * smoothstep(0.021, 0.010, d));
      alpha = max(alpha, a);
      best = d;
    }
  }

  for (int i = 0; i < 56; i++) {
    float fi = float(i);
    if (fi >= stems) break;
    float r1 = h21(vec2(fi, seed));
    float r2 = h21(vec2(fi + 31.0, seed));
    float r3 = h21(vec2(fi + 67.0, seed));
    float r4 = h21(vec2(fi + 97.0, seed));

    vec2 root = vec2(0.5 + (r4 - 0.5) * 0.13, 0.95 - r3 * 0.03);
    if (trunk > 0.5) root = vec2(0.5 + 0.02, 0.70 + (r3 - 0.5) * 0.04);

    float ang = -1.5708 + (r1 - 0.5) * spread;
    float len = len0 + r2 * len1 - abs(r1 - 0.5) * len1 * 0.4;
    vec2 dir = vec2(cos(ang), sin(ang));
    vec2 tip = root + dir * len;
    vec2 side = vec2(-dir.y, dir.x) * (r1 - 0.5) * len * 0.55;
    vec2 mid = mix(root, tip, 0.5) + side;
    tip += vec2(side.x * 0.5, len * 0.10 * r2);

    float d = min(segDist(p, root, mid), segDist(p, mid, tip));
    float along = clamp((root.y - p.y) / max(0.02, root.y - tip.y), 0.0, 1.0);
    float wide = mix(wRoot, wTip, along) * (0.7 + r2 * 0.7);
    float a = 1.0 - smoothstep(wide * 0.55, wide * 1.45, d);

    if (a > 0.0) {
      vec3 c = mix(rootCol, tipCol, along * (0.55 + 0.6 * r2));
      c *= 0.74 + 0.42 * r1 + 0.22 * r4;        // some branches catch the sun
      if (d < best) { best = d; col = c; }
      alpha = max(alpha, a);
    }

    // Seed heads on the tussocks, leaf clusters on the bushes — placed on
    // this stem rather than computed separately, which is how the first
    // version ended up with foliage floating beside the plant. This has to
    // run whether or not the pixel is on the stem itself, or a leaf is only
    // ever drawn where a twig already is.
    if (heads <= 0.0) continue;
    float every = max(1.0, floor(stems / heads));
    if (mod(fi, every) > 0.5) continue;

    for (int j = 0; j < 4; j++) {
      float fj = float(j);
      // Several small ones per stem, jittered and overlapping. Two big ones
      // apiece read as a bunch of grapes; the mass has to come from the
      // number of them, not the size.
      if (fj > 0.5 && heads < 12.0) break;
      vec2 at = mix(mid, tip, 0.25 + fj * 0.25);
      at += (vec2(h21(vec2(fi + fj * 5.0, seed + 3.0)),
                  h21(vec2(fi + fj * 5.0, seed + 9.0))) - 0.5) * headR * 2.4;
      float rr = headR * (0.55 + h21(vec2(fi + 41.0 + fj, seed)) * 0.6);
      float squash = heads > 12.0 ? (0.75 + h21(vec2(fi + fj, seed + 2.0)) * 0.8) : 1.7;
      float dh = length((p - at) / vec2(1.0, squash)) / rr;
      float ah = 1.0 - smoothstep(0.30, 1.0, dh);
      if (ah <= 0.0) continue;
      vec3 hc = headCol * (0.78 + 0.44 * clamp(1.0 - dh, 0.0, 1.0));
      hc *= 0.84 + 0.34 * h21(vec2(fi + 7.0 + fj, seed));
      col = mix(col, hc, ah);
      alpha = max(alpha, ah);
    }
  }

  return vec4(col, alpha);
}

/* ---------------------------------------------------------------- cliffs

   The outcrops the track runs between: four of them, 1024 px each, drawn the
   way the Tuwaiq escarpment breaks up — a flat cap of hard limestone over a
   fluted vertical face, with an apron of talus where the face has been
   shedding itself for a few million years. They are the one thing in the
   frame tall enough to give the horizon a shape, and they arrive on the same
   world clock as everything else standing on the ground. */
vec4 cliffSprite(vec2 p, float id, float dusk) {
  float seed = 71.0 + id * 9.13;
  float base = 0.965;

  // The cap: two or three flat steps along its length, lightly eroded.
  float steps = floor(h21(vec2(id, 3.0)) * 2.0) + 2.0;
  float stepv = floor(p.x * steps) / steps;
  float top = 0.22 + h21(vec2(id, 2.0)) * 0.30
            + (h21(vec2(stepv * 7.0 + id, 5.0)) - 0.5) * 0.15;
  top += (tfbm(p * 0.7 + seed, 14.0, 3) - 0.5) * 0.018;
  if (p.y < top - 0.02) return vec4(0.0);

  // Height up the face, 1 at the rim and 0 at the sand.
  float up = clamp((base - p.y) / max(0.001, base - top), 0.0, 1.0);

  // The sedimentary courses, indexed, so each one can carry its own colour
  // and its own set-back rather than being one more ripple in a corrugation.
  // A Tuwaiq face is a stack of storeys of slightly different rock, and a few
  // of them stand proud of the rest; that is most of what reads as detail.
  // The warp has to be gentle and low-frequency in x: a bed is one band of
  // rock along its whole length, so if the index it is looked up by swings
  // across that length the same course steps in and out of the silhouette and
  // the outline turns into a sawtooth. A quarter of a course of tilt is a
  // real bed; one and a half is a stack of plates.
  float yy = p.y + 0.009 * sin(p.y * 7.7 + id * 2.3) + 0.006 * sin(p.y * 19.0 + id);
  float cy = yy * 21.0 + (tfbm(vec2(p.x * 0.8, id), 5.0, 2) - 0.5) * 0.5;
  float ci = floor(cy);
  float course = fract(cy);
  float cr = h21(vec2(ci, id * 3.0 + 1.7));
  // Only a few courses stand proud. Stepping all of them gave a silhouette
  // like the edge of a stack of paper; two or three real ledges on a face
  // is what actually reads as structure.
  float ledge = smoothstep(0.84, 0.97, cr);

  // Half width: a battered vertical face flaring into talus at the foot.
  float wTop = 0.20 + h21(vec2(id, 7.0)) * 0.19;
  float wide = mix(wTop + 0.09, wTop, up) + smoothstep(0.34, 0.0, up) * 0.11;
  wide += (tfbm(vec2(p.y * 2.4, id), 11.0, 3) - 0.5) * 0.035;
  // Each course set back or standing out by its own amount, so the outline
  // steps storey by storey instead of running smooth from cap to talus.
  wide += ledge * 0.016 * smoothstep(0.04, 0.16, up) * smoothstep(0.98, 0.86, up);
  // One weathered notch bitten out of the face, so the four of them are not
  // the same butte drawn four times.
  float notch = h21(vec2(id, 13.0));
  wide -= smoothstep(0.26, 0.0, abs(up - 0.25 - notch * 0.5)) * (0.05 + notch * 0.09);

  float dx = abs(p.x - 0.5);
  float mask = (1.0 - smoothstep(wide - 0.006, wide, dx))
             * smoothstep(base + 0.015, base - 0.03, p.y)
             * smoothstep(top - 0.003, top + 0.005, p.y);
  if (mask <= 0.0) return vec4(0.0);

  float face = (p.x - 0.5) / max(wide, 0.001);        // -1 left .. 1 right

  // Fluting: the vertical channels runoff cuts down a limestone face. Two
  // scales, and none of it on the talus, or the whole thing reads as fur.
  float fx = p.x + tfbm(vec2(p.y * 0.35, id * 7.0), 4.0, 2) * 0.25;
  float flute = 1.0 - abs(tfbm(vec2(fx * 1.7, p.y * 0.20 + id), 9.0, 2) * 2.0 - 1.0);
  flute = pow(flute, 3.2)
        + 0.4 * pow(1.0 - abs(tfbm(vec2(fx * 2.9, p.y * 0.4 + id * 3.0), 21.0, 2) * 2.0 - 1.0), 3.5);
  flute *= smoothstep(0.18, 0.55, up);

  // Bedding: what reads at a distance is the shadow line under each course,
  // so the courses are ridged and the line is sharp.
  float beds = smoothstep(0.0, 0.16, course) * smoothstep(1.0, 0.72, course);
  beds *= smoothstep(0.05, 0.25, up) * (0.35 + 0.65 * step(0.45, cr));
  // …and the hard line a proud course throws onto the one beneath it. This is
  // the difference between a textured slab and a face with storeys in it.
  float ledgeShade = ledge * smoothstep(0.20, 0.0, course) * smoothstep(0.06, 0.22, up);

  // Joints: the vertical cracks that break a face into blocks.
  float jcol = floor(p.x * 7.0);
  float jx = fract(p.x * 7.0 + tfbm(vec2(p.y * 0.6, id), 5.0, 2) * 2.0);
  float jTop = 0.52 + h21(vec2(jcol, id + 6.0)) * 0.43;
  float jBot = max(0.30, jTop - 0.18 - h21(vec2(jcol, id + 9.0)) * 0.30);
  float joint = (1.0 - smoothstep(0.0, 0.035, min(jx, 1.0 - jx)))
              * smoothstep(jBot - 0.10, jBot + 0.06, up)
              * smoothstep(jTop + 0.10, jTop - 0.06, up)
              * smoothstep(0.24, 0.42, up)
              * step(0.62, h21(vec2(jcol, id + 3.0)));

  // Desert varnish: the dark manganese streaks that run down a face from the
  // rim wherever water comes over the cap. Long, narrow, and top-weighted —
  // they are what stops a sunlit face reading as flat paint.
  float vn = 1.0 - abs(tfbm(vec2(p.x * 6.5 + id * 5.0, p.y * 0.10), 11.0, 2) * 2.0 - 1.0);
  float varnish = pow(clamp(vn, 0.0, 1.0), 7.0) * smoothstep(0.95, 0.42, up);

  // Blocks that have come off the face and are sat in the talus, on a hashed
  // lattice: each one lit on top and dark underneath, which is enough at this
  // size to stop the apron reading as a smooth cone of gravel.
  vec2 bl = vec2(p.x * 13.0, p.y * 26.0);
  vec2 bi = floor(bl);
  vec2 bf = fract(bl) - 0.5;
  vec2 bo = (vec2(h21(bi + id), h21(bi + id + 4.0)) - 0.5) * 0.5;
  float br = 0.10 + h21(bi + id + 8.0) * 0.28;
  float boulder = smoothstep(br, br * 0.55, length((bf - bo) * vec2(1.0, 1.45)))
                * step(0.62, h21(bi + id + 12.0));
  float bLit = clamp(-(bf.y - bo.y) / max(br, 0.001), 0.0, 1.0);

  // Rubble on the talus, so the apron is not a smooth skirt.
  float rubble = tfbm(vec2(p.x * 2.0, p.y) * 3.0 + id, 34.0, 3);

  // Warmer than the loose rocks: a cliff face this size is half sunlight
  // bounced off the sand in front of it, and a cool grey slab sat in the
  // frame like a piece of another game.
  vec3 lit  = mix(vec3(0.88, 0.80, 0.65), vec3(0.38, 0.27, 0.29), dusk);
  vec3 mid  = mix(vec3(0.70, 0.61, 0.47), vec3(0.26, 0.19, 0.20), dusk);
  vec3 dark = mix(vec3(0.52, 0.44, 0.34), vec3(0.17, 0.12, 0.13), dusk);

  // Sun from the upper left. A wide gradient across the face left them all
  // reading as grey lumps; a rock this size has a lit side and a dark one.
  float sun = smoothstep(-0.90, 0.58, -face);
  vec3 col = mix(dark, mid, sun);
  col = mix(col, lit, smoothstep(0.48, 1.0, sun) * 0.90);

  col *= 1.0 - clamp(flute, 0.0, 1.2) * 0.16;
  col *= 0.90 + 0.18 * beds;
  // Each course its own stone: the beds out here run from near white to a
  // rusty brown within a single face.
  col *= 0.92 + 0.16 * cr;
  col *= 1.0 - ledgeShade * 0.34;
  col *= 1.0 - joint * 0.22;
  col *= 1.0 - varnish * 0.14;
  col *= 0.90 + 0.20 * tfbm(p * 1.6 + seed * 2.0, 18.0, 3);
  // The red dust that gets into everything out here, heaviest low down.
  col = mix(col, col * mix(vec3(1.10, 0.92, 0.74), vec3(1.0), dusk),
            smoothstep(0.75, 0.05, up) * 0.55);

  // The cap catches the sun flat on, with a hard bright lip along its edge;
  // the base sits in its own shadow.
  col = mix(col, lit, smoothstep(0.93, 1.0, up) * 0.35);
  col = mix(col, lit * 1.12, smoothstep(0.985, 1.0, up) * 0.75);
  col *= 1.0 - smoothstep(0.35, 0.0, up) * 0.20;

  // Talus: the skirt of broken rock and blown sand at the foot.
  vec3 scree = mix(vec3(0.66, 0.50, 0.33), vec3(0.27, 0.18, 0.20), dusk);
  float apron = smoothstep(0.26, 0.0, up + (tfbm(vec2(p.x * 2.0, id), 13.0, 2) - 0.5) * 0.10);
  col = mix(col, scree * (0.62 + 0.8 * rubble), apron * 0.80);
  vec3 bcol = scree * (0.70 + 0.55 * h21(bi + id + 16.0));
  col = mix(col, mix(bcol * 0.66, bcol * 1.18, bLit), boulder * apron * 0.70);
  // …and the shadow the face throws across its own foot.
  col *= 1.0 - smoothstep(-0.1, 0.8, face) * apron * 0.35;

  return vec4(col, mask);
}

vec4 bakeCliffs(vec2 uv, float dusk) {
  vec2 cell = vec2(floor(uv.x * 2.0), floor(uv.y * 2.0));
  vec2 p = vec2(fract(uv.x * 2.0), fract(uv.y * 2.0));
  return cliffSprite(p, cell.y * 2.0 + cell.x, dusk);
}

vec4 bakeProps(vec2 uv, float dusk) {
  // Four columns, three rows: five rocks then seven plants.
  vec2 cell = vec2(floor(uv.x * 4.0), floor(uv.y * 3.0));
  vec2 p = vec2(fract(uv.x * 4.0), fract(uv.y * 3.0));
  float id = cell.y * 4.0 + cell.x;
  return id < 5.0 ? rockSprite(p, id, dusk) : plantSprite(p, id - 5.0, dusk);
}

/* ------------------------------------------------------------------ main */

/* One sample of whichever layer is being baked, at plate coordinates
   u (0..1 across) and v (0 top .. 1 bottom). Colour is returned straight,
   not premultiplied; main() handles the weighting. */
vec4 plate(float u, float v, float dusk) {
  vec4 outc;

  if (uLayer == 0) {
    outc = bakeSky(u, v, dusk);
  } else if (uLayer == 1) {
    // Tuwaiq limestone: the escarpment that runs past Riyadh is pale
    // cream-grey and flat-topped, not the red of the sand in front of it.
    outc = bakeRange(u, v, dusk, 3.0, 2.6, 0.62, 0.42,
                     mix(vec3(0.76, 0.70, 0.58), vec3(0.26, 0.19, 0.26), dusk),
                     mix(vec3(0.48, 0.43, 0.36), vec3(0.14, 0.10, 0.16), dusk));
  } else if (uLayer == 2) {
    outc = bakeRange(u, v, dusk, 17.0, 1.7, 0.55, 0.10,
                     mix(vec3(0.82, 0.76, 0.63), vec3(0.30, 0.20, 0.24), dusk),
                     mix(vec3(0.46, 0.40, 0.33), vec3(0.11, 0.08, 0.13), dusk));
  } else if (uLayer == 3) {
    outc = bakeDunes(u, v, dusk);
  } else if (uLayer == 4) {
    outc = bakeSand(vec2(u, v), dusk);
  } else if (uLayer == 5) {
    outc = bakeProps(vec2(u, v), dusk);
  } else if (uLayer == 6) {
    outc = bakeTrack(vec2(u, v), dusk);
  } else {
    outc = bakeCliffs(vec2(u, v), dusk);
  }
  return outc;
}

/* Rotated-grid supersampling. Everything interesting in this shader is high
   frequency — strata banded 42 to the plate, wind ripples at 150, the
   silhouette itself — and at one sample per pixel all of it aliased into
   moire. Four jittered samples cost nothing offline and are the single
   cheapest quality win available here. */
vec3 gAcc;      // coverage-weighted colour
float gCov;     // summed coverage

void addSample(vec2 px, float dusk) {
  vec4 c = plate(px.x / uRes.x, 1.0 - px.y / uRes.y, dusk);
  gAcc += c.rgb * c.a;   // weighted by coverage, so a silhouette edge does
  gCov += c.a;           // not drag the colour of empty sky into the rock
}

void main() {
  float dusk = uDusk;
  gAcc = vec3(0.0);
  gCov = 0.0;

  addSample(gl_FragCoord.xy + vec2(-0.375, -0.125), dusk);
  addSample(gl_FragCoord.xy + vec2( 0.125, -0.375), dusk);
  addSample(gl_FragCoord.xy + vec2( 0.375,  0.125), dusk);
  addSample(gl_FragCoord.xy + vec2(-0.125,  0.375), dusk);

  vec3 col = gCov > 0.0001 ? gAcc / gCov : vec3(0.0);
  float alpha = gCov * 0.25;

  // A whisper of grain keeps the big gradients from banding in 8 bits.
  col += (hash3(vec3(gl_FragCoord.xy * 0.37, 1.0)) - 0.5) * 0.012;

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), alpha);
}`;

const canvas = document.getElementById('c');
let gl, prog, uni = {};

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(sh));
  }
  return sh;
}

function init() {
  gl = canvas.getContext('webgl', {
    alpha: true, premultipliedAlpha: false, antialias: false,
    preserveDrawingBuffer: true, depth: false, stencil: false
  });
  if (!gl) throw new Error('no webgl');

  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  for (const n of ['uRes', 'uDusk', 'uLayer']) uni[n] = gl.getUniformLocation(prog, n);
}

/** Render one plate and hand back a data URL. Called from the Node driver. */
window.bake = function (w, h, layer, dusk) {
  if (!gl) init();
  canvas.width = w;
  canvas.height = h;
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(uni.uRes, w, h);
  gl.uniform1f(uni.uDusk, dusk);
  gl.uniform1i(uni.uLayer, layer);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.finish();
  return canvas.toDataURL('image/png');
};

window.bakeReady = true;
</script>
