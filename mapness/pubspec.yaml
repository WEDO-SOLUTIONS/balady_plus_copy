  firebase_core: 3.8.0
  # eliminate this after lazy-ass author update the package
  firebase_messaging: 15.1.5
  firebase_analytics: 11.3.5
  firebase_remote_config: 5.1.5

  easy_image_viewer: 1.5.1
  talker_dio_logger: 4.4.1

  # Talker logging and error handling
  talker: 4.4.1
  talker_flutter: 4.4.1

  map_styles:
    hosted: https://baladyapp-unpub.urbi.ae/
    version: 1.1.9
  equatable: 2.0.7
  flutter_insider: ^3.15.2
  flutter_hms_gms_availability: ^3.10.0

dependency_overrides:
  # for dio_http_cache
  json_serializable: 6.9.0
  dio: 5.7.0
  google_api_headers: 4.2.4
  rxdart: 0.28.0
  device_info_plus: 11.1.1
  collection: 1.19.0
  # https://github.com/flutter/flutter/issues/162437#issuecomment-2661727397
  # https://github.com/flutter/packages/pull/8656
  # Because of this issue, we have to downgrade the version of webview_flutter
  webview_flutter_wkwebview: 3.17.0
  sentry_dio: 8.14.2
  analyzer: ^6.5.0
  custom_lint_builder: ^0.7.0
  analyzer_plugin: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  random_string: 2.3.1
  flutter_lints: 5.0.0
  # a tool for running code generators
  flutter_gen_runner:
  build_runner: 2.4.13
  # the code generator
  riverpod_generator: 2.6.3
  # riverpod_lint makes it easier to work with Riverpod
  riverpod_lint: 2.6.3
  json_serializable: 6.9.0
  very_good_analysis: 6.0.0
  cached_build_runner: 0.0.7
  auto_route_generator: 9.0.0
  custom_lint: ^0.7.0
  geolocator_android: 4.6.1
  sheetify_lint: ^1.0.1

flutter:
  assets:
    - assets/
    - assets/icons/svg/
    - assets/icons/svg/profile/
    - assets/icons/lottie/
    - assets/icons/svg/quick_filters/
    - assets/icons/svg/weather/
    - assets/icons/svg/layers/
    - assets/icons/svg/places_big_new/
    - assets/icons/svg/places_new/
    - assets/images/
    - assets/images/saudi_pass/
    - assets/images_svg/
    - assets/maps/configs/
    - packages/map_styles/src/styles.2gis

flutter_gen:
  assets:
    outputs:
      package_parameter_enabled: true # <- Add this line.
  output: lib/_generated/assets
  line_length: 120
  integrations:
    flutter_svg: true
