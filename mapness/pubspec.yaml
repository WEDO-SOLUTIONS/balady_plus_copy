  dio: 5.7.0
  pretty_dio_logger: 1.4.0
  dio_smart_retry: 7.0.1
  flutter_appauth: ^9.0.0

  ##! Local Storage
  # Lightweight fast key-value database
  hive_flutter: 1.1.0
  flutter_svg: 2.0.16

  # Map urbi SDK
  dgis_map:
    path: ../urbi_map/dgis_map

  balady_plus:
    path: ..

  balady_uikit:
    hosted: https://baladyapp-unpub.urbi.ae/
    version: 4.1.2

  sheetify: 1.0.1

