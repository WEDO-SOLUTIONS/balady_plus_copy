flutter:
  assets:
    - assets/
    - assets/icons/svg/
    - assets/icons/svg/profile/
    - assets/icons/lottie/
    - assets/icons/svg/quick_filters/
    - assets/icons/svg/weather/
    - assets/icons/svg/layers/
    - assets/icons/svg/places_big_new/
    - assets/icons/svg/places_new/
    - assets/icons/svg/places_big_new_saudi_day/
    - assets/icons/svg/places_new_saudi_day/
    - assets/images/
    - assets/images/saudi_pass/
    - assets/images_svg/
    - assets/images_svg/saudi_pass/
    - assets/maps/configs/
    - packages/map_styles/src/styles.2gis
    - packages/map_styles/src/styles_saudi_day.2gis
  fonts:
    - family: numbers_icons
      fonts:
        - asset: assets/fonts/mapness_icons/numbers_icons.ttf
    - family: transport_icons
      fonts:
        - asset: assets/fonts/mapness_icons/transport_icons.ttf

flutter_gen:
  assets:
    outputs:
      package_parameter_enabled: true # <- Add this line.
  output: lib/_generated/assets
  line_length: 120
  integrations:
    flutter_svg: true
