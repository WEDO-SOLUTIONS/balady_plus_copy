  smooth_corner: ^1.1.1

  urbi_analytics:
    hosted: https://unpub.balady.gov.sa/
    version: 0.0.4

  urbi_utils:
    hosted: https://unpub.balady.gov.sa/
    version: 1.0.5

  localize_and_translate:
    git:
      url: https://github.com/Demezy/localize_and_translate
      ref: 4.1.2-dev-fixes

  collection: ^1.19.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  wakelock_plus: ^1.4.0
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  shimmer: 3.0.0
  protobuf: ^6.0.0
  fixnum: ^1.1.1
