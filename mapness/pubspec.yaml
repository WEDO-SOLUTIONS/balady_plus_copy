  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # a tool for running code generators
  flutter_gen_runner:
  build_runner: 2.13.1
  # the code generator
  riverpod_generator: ^4.0.0+1
  # riverpod_lint makes it easier to work with Riverpod
  riverpod_lint: ^3.1.0
  json_serializable: ^6.11.2
  # yet another linter
  very_good_analysis: ^10.0.0
  cached_build_runner: 0.0.7
  auto_route_generator: ^10.4.0
  custom_lint: ^0.8.1
#  todo todo update package
#  sheetify_lint: ^1.0.1

