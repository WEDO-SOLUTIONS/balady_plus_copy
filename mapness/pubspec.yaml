    - family: numbers_icons
      fonts:
        - asset: assets/fonts/mapness_icons/numbers_icons.ttf
    - family: transport_icons
      fonts:
        - asset: assets/fonts/mapness_icons/transport_icons.ttf
    - family: Orbitron
      fonts:
        - asset: assets/fonts/orbitron/Orbitron-Bold.ttf
          weight: 700

flutter_gen:
  assets:
    outputs:
      package_parameter_enabled: true # <- Add this line.
  output: lib/_generated/assets
  line_length: 120
  integrations:
    flutter_svg: true

dependency_overrides:
  sdga_design_system: 1.0.0
