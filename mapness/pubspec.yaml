  # a tool for running code generators
  flutter_gen_runner:
  build_runner: ^2.9.0
  # the code generator
  riverpod_generator: ^3.0.3
  # riverpod_lint makes it easier to work with Riverpod
  riverpod_lint: ^3.0.3
  json_serializable: ^6.11.0
  very_good_analysis: ^10.0.0
  cached_build_runner: 0.0.7
  auto_route_generator: ^10.2.6
  custom_lint: ^0.8.0
  geolocator_android: ^5.0.2
