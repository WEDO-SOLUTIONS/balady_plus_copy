      url: https://github.com/Demezy/localize_and_translate
      ref: 4.1.2-dev-fixes

  collection: 1.19.0
  flutter_localizations:
    sdk: flutter
  intl: 0.19.0
  wakelock_plus: 1.2.8
  provider: 6.1.2
  url_launcher: 6.3.1
  shimmer: 3.0.0
  cube_transition_plus: #  2.0.1 # version from pub has bug, use it when PR will be merged
    git:
      url: https://github.com/Demezy/cube_transition_plus
  protobuf: 3.1.0
  permission_handler: 12.0.0+1
  package_info_plus: 8.1.0
  hive_generator: 2.0.1
  internet_connection_checker: 1.0.0+1
  hive: 2.2.3
  path_provider: 2.1.4
  expansion_widget: 0.1.0
  uuid: 4.5.1
  carousel_slider: 5.0.0
  rxdart: 0.28.0
  geolocator: 13.0.1
  flutter_compass: 0.8.0
  vibration: 2.0.1
  share_plus: 10.1.1
  image_picker: 1.1.2
  geobase: 1.4.0+1
  crypto: 3.0.6
  mixpanel_flutter: 2.3.3
  rate_my_app: 2.2.0
  webview_flutter: 4.10.0
  auto_size_text: 3.0.0
  in_app_review: 2.0.10
  youtube_player_flutter: 9.1.1
  custom_image_crop: 0.0.13
  flutter_image_compress: 2.3.0
  flutter_uxcam: 2.5.6
  dio_http_cache: 0.3.0
  sliver_tools: 0.2.12
  json_annotation: 4.9.0
  photo_view: 0.15.0
  flutter_staggered_grid_view: 0.7.0
  app_links: 6.3.2
  flutter_keyboard_visibility: 6.0.0
  infinite_scroll_pagination: 4.1.0
  another_transformer_page_view:
    hosted: https://baladyapp-unpub.urbi.ae/
    version: 2.2.0
  cached_network_image: 3.4.1
  # Scrollable list
  scrollable_positioned_list: 0.3.8
  smooth_page_indicator: 1.2.0+3
  add_2_calendar: 3.0.1
  flutter_bloc: 8.1.6
  mocktail: 1.0.4
  freezed_annotation: 2.4.4
  freezed: 2.5.7
  flutter_hooks: 0.20.5
  hooks_riverpod: 2.6.1
  http: 1.2.2
  image: 4.3.0
  vector_math: 2.1.4
  fast_immutable_collections: 11.0.0
  adjust_sdk: 5.1.1
  flutter_animate: ^4.3.0
  flutter_gen: 5.10.0

  # TODO: upgrade after pdfx will be updated
  device_info_plus: 11.1.1
