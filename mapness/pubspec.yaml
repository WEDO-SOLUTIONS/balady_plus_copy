  flutter:
    sdk: flutter
  riverpod: 3.1.0
  flutter_riverpod: 3.1.0
  auto_route: ^11.1.0
  shared_preferences: ^2.5.4
  # the annotation package containing @riverpod
  riverpod_annotation: ^4.0.0
  async: ^2.13.0

  ##! Internet
