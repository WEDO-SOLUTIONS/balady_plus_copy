  # eliminate this after lazy-ass author update the package
  firebase_messaging: ^16.1.0
  firebase_remote_config: ^6.1.3

  talker_dio_logger: ^5.1.10

  # Talker logging and error handling
  talker: ^5.1.10
  talker_flutter: ^5.1.10

  # 1.35.x is the latest line compatible with Flutter 3.38.5 (1.36+ requires Flutter >=3.41).
  flame: ^1.35.1


  map_styles:
    hosted: https://unpub.balady.gov.sa/
    version: 1.3.13

