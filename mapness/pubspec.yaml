name: mapness
description: A new Flutter package project.

version: 2.1.0+7.4
publish_to: "none"

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  cupertino_icons: 1.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  auto_route: 9.2.2
  shared_preferences: 2.3.2
  # the annotation package containing @riverpod
  riverpod_annotation: 2.6.1
  async: 2.11.0

  ##! Internet
