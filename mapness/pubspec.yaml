name: mapness
description: A new Flutter package project.
version: 0.0.1

environment:
  sdk: '>=3.0.3 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  cupertino_icons: ^1.0.6
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.1
  go_router: 11.1.1
  rxdart: ^0.27.7
  shared_preferences: ^2.2.1
  # the annotation package containing @riverpod
  riverpod_annotation: 2.1.6
  async: ^2.11.0

  ##! Internet
  # Checks for an Active Internet connection
  internet_connection_checker: ^1.0.0+1
  # Http client for Dart, which supports Interceptors
  dio: ^5.0.0
  pretty_dio_logger: ^1.3.1
  ##! Local Storage
  # Lightweight fast key-value database
  hive_flutter: ^1.1.0
  flutter_svg: ^2.0.7

  # Map urbi SDK
  dgis_map:
    path: ../urbi_map/dgis_map
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  random_string: ^2.3.1
  flutter_lints: ^2.0.3
  # a tool for running code generators
  build_runner: 2.4.6
  # the code generator
  riverpod_generator: 2.3.3
  # riverpod_lint makes it easier to work with Riverpod
  riverpod_lint: 2.1.1
  # import custom_lint too as riverpod_lint depends on it
  custom_lint: 0.5.3

flutter:

  assets:
    - assets/
    - assets/icons/svg/
