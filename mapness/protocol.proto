syntax = "proto3";

package balady.protocol;

option go_package = "./protocol";

// Base classes

message Timestamp {
  int64 value = 1; // millis
}

enum Env {
  ENV_UNKNOWN = 0;
  ENV_DEV = 1;
  ENV_SANDBOX = 2;
  ENV_PRODUCTION = 3;
}

enum Error {
  ERROR_UNKNOWN = 0;
  ERROR_BAD_REQUEST = 1;
  ERROR_UNAUTHORIZED = 2;
  ERROR_NOT_FOUND = 3;
  ERROR_INTERNAL_SERVER_ERROR = 4;
}

message Image { string url = 1; }

message Point {
  double latitude = 1;  // Y
  double longitude = 2; // X
}

message Color { string hex = 1; }

message TextStyle { Color color = 1; }

enum FavouriteItemType {
  FAVOURITE_ITEM_TYPE_UNKNOWN = 0;
  FAVOURITE_ITEM_TYPE_HOME = 1;
  FAVOURITE_ITEM_TYPE_WORK = 2;
  FAVOURITE_ITEM_TYPE_PLACE = 3;
}

enum EntitySourceType {
  ENTITY_SOURCE_UNKNOWN = 0;
  ENTITY_SOURCE_URBI = 1;
}

enum InterestingPlaceTag {
  INTERESTING_PLACE_CATEGORY_UNKNOWN = 0;
  INTERESTING_PLACE_CATEGORY_IMMERSIVE_MODEL = 1;
  INTERESTING_PLACE_CATEGORY_FLOORS = 2;
}

enum IWishState {
  IWISH_STATE_UNKNOWN = 0;
  IWISH_STATE_PLANNED = 1;
  IWISH_STATE_COMPLETED = 2;
}

enum IWishSize {
  IWISH_SIZE_UNKNOWN = 0;
  IWISH_SIZE_NONE = 1;
  IWISH_SIZE_SMALL = 2;
  IWISH_SIZE_MEDIUM = 3;
  IWISH_SIZE_LARGE = 4;
}

enum IWishCategory {
  IWISH_CATEGORY_UNKNOWN = 0;
  IWISH_CATEGORY_JOY_PARKS = 1;
}

enum IWishFeedbackRating {
  IWISH_FEEDBACK_RATING_HAPPY = 0;
  IWISH_FEEDBACK_RATING_NEUTRAL = 1;
  IWISH_FEEDBACK_RATING_UPSET = 2;
}

// Base requests & responses
message ErrorResponse {
  message ErrorMessage {
    Error type = 1;
    int32 int_code = 2;
    optional string message = 3;
    optional string system_message = 4;
  }

  reserved 1;
  ErrorMessage error = 2;
}

message OkResponse {
  reserved 1;
  int32 code = 2;
}

// Stories

message Story {
  message Preview {
    Image image = 1;
    string title = 2;
  }

  message Video {
    string url = 1;
    string resolution = 2;
  }

  message Frame {
    message Content { repeated Image images = 1; }

    message Style {
      optional TextStyle title = 1;
      optional TextStyle description = 2;
      optional TextStyle background_color = 3;
    }
    

    message ActionButton {
      message Link { string url = 1; }

      message Style {
        optional Color background_color = 1;
        optional TextStyle text_style = 2;
      }

      string title = 1;
      Link link = 2;
      Style style = 3;
      bool is_enabled = 4;
    }

    Image background = 1;
    optional string title = 2;
    optional string description = 3;
    optional ActionButton action_button = 4;
    bool is_viewed = 5; // deprecated
    int32 duration = 6;
    Style style = 7;
    optional Content content = 8;
  }

  string id = 1;
  Preview preview = 2;
  repeated Frame frames = 3;
  bool is_viewed = 4; // deprecated
  optional int32 activate_every_n_launches = 5;
  repeated Video videos = 6;
}

message StoriesResponse {
  reserved 1;
  repeated Story stories = 2;
}

// Happiness Map

message HappinessRequest {
  message Tag { string name = 1; }

  Point point = 1;
  bool is_positive = 2;
  repeated Tag tags = 3;
  optional string text = 4;
}

// Favourites

message FavouriteItemPlace {
  message Location { Point point = 1; }

  message Entity {
    EntitySourceType source_type = 1;
    string id = 2;
  }

  Location location = 1;
  optional Entity entity = 2;
  string title = 3;
  string subtitle = 4;
}

message FavouriteItem {
  string id = 1;
  FavouriteItemPlace place = 2;
}

message FavouritesResponse {
  message Places {
    optional FavouriteItemPlace home = 1;
    optional FavouriteItemPlace work = 2;
  }

  Places places = 1;
  repeated FavouriteItem items = 2;
}

message AddFavouriteItemsRequest {
  message Item {
    message Entity {
      EntitySourceType source_type = 1;
      string id = 2;
    }

    FavouriteItemType type = 1;
    Point point = 2;
    optional Entity entity = 3;
  }

  repeated Item items = 1;
}

message DeleteFavouriteItemsRequest {
  message Item {
    FavouriteItemType type = 1;
    optional string id = 2;
  }

  repeated Item items = 1;
}

// iWish
message Category {
  int32 id = 1;
  string name_en = 2;
  string name_ar = 3;
  string icon_url = 4;
}

message IWishObjectMarker {
  message Location { Point point = 1; }

  string id = 1;
  IWishCategory category = 2 [ deprecated = true ];
  Location location = 3;
  IWishState state = 4;
  Category iwish_category = 5;
  string address = 6;
  string photo = 7;
  string name = 8;
  double distance = 9;
}

message Location { Point point = 1; }

message IWishObjectMarkerV2 {
  string id = 1;
  string name = 2;
  Location location = 3;
}

message IWishObject {
  message Location { Point point = 1; }

  message Variant {
    message Preview { Image image = 1; }

    int32 id = 1;
    string title = 2;
    Preview preview = 3;
    repeated Photo photos = 4;
  }

  message Voted {
    int32 variant_index = 1;
    bool is_feedback_sent = 2;
  }

  message Photo { Image image = 1; }

  message Metadata {
    optional string area_name = 1;
    optional string type_name = 2;
    optional int32 area_size = 3;
    optional Timestamp opening_date = 4;
  }

  string id = 1;
  IWishCategory category = 2 [ deprecated = true ];
  IWishState state = 3;
  Location location = 4;
  string title = 5;
  string subtitle = 6;
  repeated Photo photos = 7;
  repeated Variant variants = 8;
  optional int32 selected_variant_id = 9;
  bool feedback_sent = 10;
  Metadata metadata = 11;
  IWishSize size = 12;
  Category iwish_category = 13;
  repeated IWishTag iwish_tags = 14;
}

message IWishTag {
  int32 id = 1;
  string title_en = 2;
  string title_ar = 3;
  string icon_url = 4;
}

message IWishMarkersResponse { repeated IWishObjectMarker markers = 1; }

message IWishMarkersResponseV2 { repeated IWishObjectMarkerV2 markers = 1; }

message IWishItemResponse { IWishObject object = 1; }

message IWishVoteRequest { int32 variant_id = 1; }

message IWishFeedbackRequest {
  message Tag { string name = 1; }

  IWishFeedbackRating rating = 1;
  repeated Tag tags = 2;
  optional string text = 3;
}

message IWishDeleteAllFeedbacksRequest { repeated string user_ids = 1; }

// Interesting Places

message InterestingPlace {
  message Preview {
    string title = 1;
    Image image = 2;
  }

  message Location { Point point = 1; }

  message Entity {
    EntitySourceType source_type = 1;
    string id = 2;
  }

  string id = 1;
  Preview preview = 2;
  Location location = 3;
  optional Entity entity = 4;
  repeated InterestingPlaceTag tags = 5;
  optional float distance =
      6;           // Distance between user location and the place in meters
  bool pinned = 7; // Pinned is a sign that the interesting place order is fixed
                   // regardless of sorting
}

message InterestingPlacesResponse {
  repeated InterestingPlace interesting_places = 1;
}

message Profile {
  message Photo { Image image = 1; }

  reserved 5;
  optional Photo photo = 6;
}

message ProfileResponse {
  reserved 1;
  Profile profile = 2;
}

message CategoryResponse { repeated Category categories = 1; }

// Static Assets

message StaticAsset { string icons_url = 1; }

message CreateFeedbackRequest {
  message Context {
    string appVersion = 1;
    string mobileOS = 2;
    string locale = 3;
    optional string authId = 4;
    string feedbackSource = 5;
    string deviceId = 6;
  }

  message Review {
    string text = 1;
    int32  stars = 2;
    repeated string tags = 3;
  }

  string reviewText = 1; // backward compatibility
  Context context = 2;
  Review review = 3;
}

message UpdateUserIdRequest {
  string old_uuid = 1;
  string new_uuid = 2;
}