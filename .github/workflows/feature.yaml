# yamllint disable rule:line-length
---
name: Feature branch workflow

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    branches:
      - "bugfix/*"
      - "feat/*"
      - "feature/*"
      - "urbi"
      - "urbi-service/release-*"
    paths-ignore:
      - "**.md"
      - "doc/**"
      - ".git/"
      - ".vscode/"

jobs:
  check-typos:
    # runs-on: [misc]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: typos-action
        uses: crate-ci/typos@v1.23.1
        with:
          files: "mapness/**/*.dart"
          write_changes: true

  auto-request-review:
    name: Auto Request Review CODEOWNERS
    runs-on: ubuntu-latest
    # runs-on: [misc]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Request review based on files changes and/or groups the author belongs to. CODEOWNERS
        uses: urbi-ae/auto-request-review@v0.17.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: .github/reviewers.yml # Config file location override

  notify-reviewers:
    name: Notify reviewers (Teams)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    needs: auto-request-review
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: 🔔 Notify reviewers in Microsoft Teams (Adaptive Card + mentions)
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL_PR }}
          TEAMS_MAPPING_FILE: ${{ github.workspace }}/.github/teams_mapping.yml
        run: |
          set -euo pipefail
  
          # PR info
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_API_URL="${{ github.event.pull_request.url }}"
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          EVENT_ACTION="${{ github.event.action }}"
  
          # Get reviewers (GitHub logins)
          REVIEWERS="$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${PR_API_URL}/requested_reviewers" \
            | jq -r '.users // [] | map(.login) | join(" ")')"
  
          if [ -z "${REVIEWERS}" ]; then
            echo "No reviewers to notify."
            exit 0
          fi
  
          # Build mentions for Teams Adaptive Card
          # Mapping file format: github_login: teams_user_id (AAD Object ID UUID)
          MENTION_TEXT=""
          MSTEAMS_ENTITIES='[]'
          NOT_FOUND_REVIEWERS=""
  
          i=0
          for reviewer in ${REVIEWERS}; do
            teams_id="$(reviewer=${reviewer} yq e '.[env(reviewer)] // ""' "${TEAMS_MAPPING_FILE}")"
  
            if [ -n "${teams_id}" ] && [ "${teams_id}" != "null" ]; then
              i=$((i+1))
              tag="<at>reviewer${i}</at>"
              MENTION_TEXT+="${tag} "
  
              # Add mention entity
              MSTEAMS_ENTITIES="$(jq -c \
                --arg id "${teams_id}" \
                --arg name "${reviewer}" \
                --arg text "${tag}" \
                '. + [{
                  "type": "mention",
                  "text": $text,
                  "mentioned": { "id": $id, "name": $name }
                }]' <<< "${MSTEAMS_ENTITIES}")"
  
              echo "Teams id ${teams_id} for reviewer ${reviewer}"
            else
              NOT_FOUND_REVIEWERS+="${reviewer} "
              echo "Couldn't map github username to teams id for ${reviewer}"
            fi
          done
  
          # Decide whether to notify based on action (same behavior as old MM script)
          if [ "${EVENT_ACTION}" = "opened" ] || [ "${EVENT_ACTION}" = "reopened" ] || [ "${EVENT_ACTION}" = "ready_for_review" ]; then
            HEADER="You were assigned as a reviewer:"
          elif [ "${EVENT_ACTION}" = "synchronize" ]; then
            HEADER="There are some changes:"
          else
            echo "Action ${EVENT_ACTION} does not require notification."
            exit 0
          fi
  
          # Build base Adaptive Card payload WITHOUT msteams.entities (keep JSON always valid)
          PAYLOAD="$(cat <<'EOF'
          {
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.5",
                  "body": [
                    { "type": "TextBlock", "size": "Large", "weight": "Bolder", "wrap": true, "text": "👀 PR review request" },
                    { "type": "TextBlock", "wrap": true, "text": "__MENTION_TEXT____HEADER__" },
                    {
                      "type": "FactSet",
                      "facts": [
                        { "title": "Pull request", "value": "[__PR_TITLE__](__PR_URL__)" },
                        { "title": "Branch", "value": "__PR_BRANCH__" },
                        { "title": "Author", "value": "__PR_AUTHOR__" }
                      ]
                    }
                  ]
                }
              }
            ]
          }
          EOF
          )"
  
          # Safely JSON-escape dynamic strings using jq, then replace placeholders
          esc() { jq -Rsa . <<< "${1}" | sed 's/^"//; s/"$//'; }
  
          PR_TITLE_ESC="$(esc "${PR_TITLE}")"
          PR_URL_ESC="$(esc "${PR_URL}")"
          PR_BRANCH_ESC="$(esc "${PR_BRANCH}")"
          PR_AUTHOR_ESC="$(esc "${PR_AUTHOR}")"
          HEADER_ESC="$(esc "${HEADER}")"
          MENTION_TEXT_ESC="$(esc "${MENTION_TEXT}")"
  
          PAYLOAD="${PAYLOAD/__MENTION_TEXT__/${MENTION_TEXT_ESC}}"
          PAYLOAD="${PAYLOAD/__HEADER__/${HEADER_ESC}}"
          PAYLOAD="${PAYLOAD/__PR_TITLE__/${PR_TITLE_ESC}}"
          PAYLOAD="${PAYLOAD/__PR_URL__/${PR_URL_ESC}}"
          PAYLOAD="${PAYLOAD/__PR_BRANCH__/${PR_BRANCH_ESC}}"
          PAYLOAD="${PAYLOAD/__PR_AUTHOR__/${PR_AUTHOR_ESC}}"
  
          # Inject msteams.entities (as real JSON, not a string) — this fixes "Invalid numeric literal"
          PAYLOAD="$(jq -c --argjson entities "${MSTEAMS_ENTITIES}" '
            .attachments[0].content.msteams = { "entities": $entities }
          ' <<< "${PAYLOAD}")"
  
          # Send main Teams notification
          curl -sS -H 'Content-Type: application/json' -d "${PAYLOAD}" "${TEAMS_WEBHOOK_URL}" >/dev/null
          echo "Teams notification sent."
  
          # Send warning if some reviewers were not mapped
          if [ -n "${NOT_FOUND_REVIEWERS// /}" ]; then
            WARN_PAYLOAD="$(cat <<'EOF'
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "themeColor": "D83B01",
            "summary": "Reviewers mapping warning",
            "title": "⚠️ Reviewers mapping warning",
            "sections": [
              { "text": "Can't map GitHub users to Teams IDs: __NOT_FOUND__" }
            ]
          }
          EOF
          )"
            NOT_FOUND_ESC="$(esc "${NOT_FOUND_REVIEWERS}")"
            WARN_PAYLOAD="${WARN_PAYLOAD/__NOT_FOUND__/${NOT_FOUND_ESC}}"
            curl -sS -H 'Content-Type: application/json' -d "${WARN_PAYLOAD}" "${TEAMS_WEBHOOK_URL}" >/dev/null
            echo "Teams mapping warning sent."
          fi

  linter:
    # runs-on: [self-hosted, Linux]
    runs-on: ubuntu-latest
    name: Lint flutter code
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: "stable"
          cache: true
      - name: Download Localazy #wait secrets from 2gis
        uses: localazy/download@v1
        with:
          read_key: ${{ secrets.LOCALAZY_READ_KEY }}
          write_key: ${{ secrets.LOCALAZY_WRITE_KEY }}

      - name: Generate locale
        run: |
          cd mapness
          # FIXME: Workaround, see https://github.com/localazy/download/issues/3
          sudo chown -R "$USER:$USER" lib/l10n || true
          mkdir -p lib/l10n/generated
          flutter gen-l10n

#       NOT USED
#      - name: Setup SSH
#        uses: webfactory/ssh-agent@v0.9.0
#        with:
#          ssh-private-key: |
#                ${{ secrets.BALADY_AUTHORIZATION_DEPLOY_KEY_PLAIN }}
#                ${{ secrets.BALADY_UIKIT_DEPLOY_KEY_PLAIN }}

      - name: Setup dgis_map_platform_interface
        run: |
          cd urbi_map/dgis_map_platform_interface
          mkdir lib/src/pigeons/
          mkdir ../dgis_map/android/src/main/kotlin/com/dgis/map/map_api
          flutter pub get
          flutter pub run pigeon --input pigeons/messages.dart

      - name: Setup dgis_map
        env: # Set the secret as an environment variable
          BALADY_DEVELOPERS_PASS: ${{ secrets.BALADY_DEVELOPERS_PASS }}
        run: |
          cd urbi_map/dgis_map
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Download dependenices
        env:
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no
        run: |
          cd mapness
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          cd ../
          flutter pub get

      - name: Analyze Flutter
        uses: ValentinVignal/action-dart-analyze@v0.17
        with:
          fail-on: "format"
          line-length: 120
          check-renamed-files: true
