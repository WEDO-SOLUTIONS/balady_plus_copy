# yamllint disable rule:line-length
---
name: Feature branch workflow

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    branches:
      - "bugfix/*"
      - "feat/*"
      - "feature/*"
      - "urbi"
      - "release/*"
    paths-ignore:
      - "**.md"
      - "doc/**"
      - ".git/"
      - ".vscode/"

jobs:
  check-typos:
    # runs-on: [misc]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: typos-action
        uses: crate-ci/typos@v1.23.1
        with:
          files: "mapness/**/*.dart"
          write_changes: true

  auto-request-review:
    name: Auto Request Review CODEOWNERS
    runs-on: ubuntu-latest
    # runs-on: [misc]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Request review based on files changes and/or groups the author belongs to. CODEOWNERS
        uses: urbi-ae/auto-request-review@v0.17.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: .github/reviewers.yml # Config file location override

  notify-reviewers:
    name: Notify reviewers (Teams)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    needs: auto-request-review
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: 🔔 Notify reviewers in Microsoft Teams (Adaptive Card + mentions)
        shell: bash
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL_PR }}
          TEAMS_MAPPING_FILE: ${{ github.workspace }}/.github/teams_mapping.yml

          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_API_URL: ${{ github.event.pull_request.url }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_ACTION: ${{ github.event.action }}

          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          : "${TEAMS_WEBHOOK_URL:?missing TEAMS_WEBHOOK_URL}"
          : "${TEAMS_MAPPING_FILE:?missing TEAMS_MAPPING_FILE}"
          : "${PR_API_URL:?missing PR_API_URL (run on pull_request events)}"

          # Get reviewers (GitHub logins)
          REVIEWERS="$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "${PR_API_URL}/requested_reviewers" \
            | jq -r '.users // [] | map(.login) | join(" ")')"

          if [ -z "${REVIEWERS}" ]; then
            echo "No reviewers to notify."
            exit 0
          fi

          # Build mentions for Teams Adaptive Card
          MENTION_TEXT=""
          MSTEAMS_ENTITIES='[]'
          NOT_FOUND_REVIEWERS=""

          i=0
          for reviewer in ${REVIEWERS}; do
            teams_id="$(reviewer=${reviewer} yq e '.[env(reviewer)] // ""' "${TEAMS_MAPPING_FILE}")"

            if [ -n "${teams_id}" ] && [ "${teams_id}" != "null" ]; then
              i=$((i+1))
              tag="<at>reviewer${i}</at>"
              MENTION_TEXT+="${tag} "

              MSTEAMS_ENTITIES="$(jq -c \
                --arg id "${teams_id}" \
                --arg name "${reviewer}" \
                --arg text "${tag}" \
                '. + [{
                  "type": "mention",
                  "text": $text,
                  "mentioned": { "id": $id, "name": $name }
                }]' <<< "${MSTEAMS_ENTITIES}")"

              echo "Teams id ${teams_id} for reviewer ${reviewer}"
            else
              NOT_FOUND_REVIEWERS+="${reviewer} "
              echo "Couldn't map github username to teams id for ${reviewer}"
            fi
          done

          # Decide whether to notify based on action
          case "${EVENT_ACTION}" in
            opened|reopened|ready_for_review) HEADER="You were assigned as a reviewer:" ;;
            synchronize) HEADER="There are some changes:" ;;
            *) echo "Action ${EVENT_ACTION} does not require notification."; exit 0 ;;
          esac

          # Build Adaptive Card payload safely with jq
          PAYLOAD="$(jq -nc \
            --arg pr_title "${PR_TITLE}" \
            --arg pr_url "${PR_URL}" \
            --arg pr_branch "${PR_BRANCH}" \
            --arg pr_author "${PR_AUTHOR}" \
            --arg header "${HEADER}" \
            --arg mention "${MENTION_TEXT}" \
            --argjson entities "${MSTEAMS_ENTITIES}" \
            '{
              type:"message",
              attachments:[{
                contentType:"application/vnd.microsoft.card.adaptive",
                content:{
                  "$schema":"http://adaptivecards.io/schemas/adaptive-card.json",
                  type:"AdaptiveCard",
                  version:"1.5",
                  msteams:{entities:$entities},
                  body:[
                    {type:"TextBlock", size:"Large", weight:"Bolder", wrap:true, text:"👀 PR review request"},
                    {type:"TextBlock", wrap:true, text:($mention + $header)},
                    {type:"FactSet", facts:[
                      {title:"Pull request", value:("[" + $pr_title + "](" + $pr_url + ")")},
                      {title:"Branch", value:$pr_branch},
                      {title:"Author", value:$pr_author}
                    ]}
                  ]
                }
              }]
            }')"

          curl -sS -H 'Content-Type: application/json' -d "${PAYLOAD}" "${TEAMS_WEBHOOK_URL}" >/dev/null
          echo "Teams notification sent."

          if [ -n "${NOT_FOUND_REVIEWERS// /}" ]; then
            WARN_PAYLOAD="$(jq -nc --arg nf "${NOT_FOUND_REVIEWERS}" '{
              "@type":"MessageCard",
              "@context":"https://schema.org/extensions",
              themeColor:"D83B01",
              summary:"Reviewers mapping warning",
              title:"⚠️ Reviewers mapping warning",
              sections:[{text:("Can'\''t map GitHub users to Teams IDs: " + $nf)}]
            }')"
            curl -sS -H 'Content-Type: application/json' -d "${WARN_PAYLOAD}" "${TEAMS_WEBHOOK_URL}" >/dev/null
            echo "Teams mapping warning sent."
          fi

      - name: 🔔 Notify reviewers in Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_MAPPING_FILE: ${{ github.workspace }}/.github/tg_mapping.yml

          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_API_URL: ${{ github.event.pull_request.url }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_ACTION: ${{ github.event.action }}

          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          REVIEWERS="$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "${PR_API_URL}/requested_reviewers" \
            | jq -r '.users // [] | map(.login) | join(" ")')"

          if [ -z "${REVIEWERS}" ]; then
            echo "No reviewers to notify."
            exit 0
          fi

          case "${EVENT_ACTION}" in
            opened|reopened|ready_for_review) HEADER="You were assigned as a reviewer" ;;
            synchronize) HEADER="There are some changes" ;;
            *) echo "Action ${EVENT_ACTION} does not require notification."; exit 0 ;;
          esac

          MENTION_TEXT=""
          for reviewer in ${REVIEWERS}; do
            tg_id="$(reviewer=${reviewer} yq e '.[env(reviewer)] // ""' "${TG_MAPPING_FILE}" || true)"
            if [ -n "${tg_id}" ] && [ "${tg_id}" != "null" ]; then
              MENTION_TEXT="${MENTION_TEXT}<a href=\"tg://user?id=${tg_id}\">${reviewer}</a> "
            else
              MENTION_TEXT="${MENTION_TEXT}${reviewer} "
            fi
          done

          MSG="$(printf '👀 PR review request\n\n%s\n<b>%s</b>\n\n<b>PR:</b> <a href="%s">%s</a>\n<b>Branch:</b> %s\n<b>Author:</b> %s' \
            "$MENTION_TEXT" "$HEADER" "$PR_URL" "$PR_TITLE" "$PR_BRANCH" "$PR_AUTHOR")"

          payload=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$MSG" \
            '{
              "chat_id": $chat_id,
              "text": $text,
              "parse_mode": "HTML",
              "disable_web_page_preview": true
            }')

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data "$payload"
          echo "Telegram notification sent."

  linter:
    # runs-on: [self-hosted, Linux]
    runs-on: ubuntu-latest
    name: Lint flutter code
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # actions/checkout persists GITHUB_TOKEN as a global http.extraheader
          # for github.com, which overrides our own PAT below for every other
          # github.com clone (e.g. map_styles.git) since GITHUB_TOKEN is scoped
          # only to this repo. Disable it so our url.insteadOf mapping wins.
          persist-credentials: false

      - name: Configure git auth for private WEDO-SOLUTIONS package repos
        run: |
          git config --global url."https://x-access-token:${{ secrets.WEDO_PACKAGES_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Generate pubspec overrides for unpub-hosted packages
        # ubuntu-latest has no VPN route to unpub.balady.gov.sa, so `flutter pub get`
        # can't resolve these hosted deps here. Override them with git deps (default
        # branch) pointing at the same private repos instead, CI-only, never committed.
        # Both files get the full set: mapness resolves the root package's deps too
        # via its `path: ..` dependency, and dependency_overrides don't propagate
        # across that boundary — each pubspec_overrides.yaml only covers its own
        # entrypoint's resolution.
        run: |
          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            balady_uikit:
              git:
                url: https://github.com/WEDO-SOLUTIONS/balady_uikit.git
            balady_authorization:
              git:
                url: https://github.com/WEDO-SOLUTIONS/balady_authorization.git
            balady_design_system:
              git:
                url: https://github.com/WEDO-SOLUTIONS/balady-design-system.git
            flutter_picker_plus:
              git:
                url: https://github.com/WEDO-SOLUTIONS/flutter_picker_plus.git
            urbi_analytics:
              git:
                url: https://github.com/WEDO-SOLUTIONS/urbi_analytics.git
            urbi_utils:
              git:
                url: https://github.com/WEDO-SOLUTIONS/urbi_utils.git
            another_transformer_page_view:
              git:
                url: https://github.com/WEDO-SOLUTIONS/another_transformer_page_view.git
            map_styles:
              git:
                url: https://github.com/WEDO-SOLUTIONS/map_styles.git
          EOF

          cat > mapness/pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            balady_uikit:
              git:
                url: https://github.com/WEDO-SOLUTIONS/balady_uikit.git
            balady_authorization:
              git:
                url: https://github.com/WEDO-SOLUTIONS/balady_authorization.git
            balady_design_system:
              git:
                url: https://github.com/WEDO-SOLUTIONS/balady-design-system.git
            flutter_picker_plus:
              git:
                url: https://github.com/WEDO-SOLUTIONS/flutter_picker_plus.git
            urbi_analytics:
              git:
                url: https://github.com/WEDO-SOLUTIONS/urbi_analytics.git
            urbi_utils:
              git:
                url: https://github.com/WEDO-SOLUTIONS/urbi_utils.git
            another_transformer_page_view:
              git:
                url: https://github.com/WEDO-SOLUTIONS/another_transformer_page_view.git
            map_styles:
              git:
                url: https://github.com/WEDO-SOLUTIONS/map_styles.git
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: "stable"

      - name: Download Localazy #wait secrets from 2gis
        uses: localazy/download@v1
        with:
          read_key: ${{ secrets.LOCALAZY_READ_KEY }}
          write_key: ${{ secrets.LOCALAZY_WRITE_KEY }}

      - name: Generate locale
        run: |
          # Re-apply keys referenced in code but not published in Localazy
          # (see mapness/l10n_overrides.json). Must run after download, before gen-l10n.
          sudo chown -R "$USER:$USER" mapness/lib/l10n || true
          python3 justscripts/apply_l10n_overrides.py
          cd mapness
          # FIXME: Workaround, see https://github.com/localazy/download/issues/3
          mkdir -p lib/l10n/generated
          flutter gen-l10n

#       NOT USED
#      - name: Setup SSH
#        uses: webfactory/ssh-agent@v0.9.0
#        with:
#          ssh-private-key: |
#                ${{ secrets.BALADY_AUTHORIZATION_DEPLOY_KEY_PLAIN }}
#                ${{ secrets.BALADY_UIKIT_DEPLOY_KEY_PLAIN }}

      - name: Add private registry to hosts
        run: echo "${{ secrets.UNPUB_SERVER_IP }} balady-unpub-stg.momah.gov.sa" | sudo tee -a /etc/hosts

      - name: Setup dgis_map_platform_interface
        run: |
          cd urbi_map/dgis_map_platform_interface
          mkdir lib/src/pigeons/
          mkdir ../dgis_map/android/src/main/kotlin/com/dgis/map/map_api
          flutter pub get
          flutter pub run pigeon --input pigeons/messages.dart

      - name: Setup dgis_map
        env: # Set the secret as an environment variable
          BALADY_DEVELOPERS_PASS: ${{ secrets.BALADY_DEVELOPERS_PASS }}
        run: |
          cd urbi_map/dgis_map
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Download dependenices
        env:
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no
        run: |
          cd mapness
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          cd ../
          flutter pub get

      - name: Analyze Flutter
        uses: ValentinVignal/action-dart-analyze@v2.1
        with:
          line-length: 120
          check-renamed-files: true
