# yamllint disable rule:line-length
---
name: Feature branch workflow

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    branches:
      - "bugfix/*"
      - "feat/*"
      - "feature/*"
      - "urbi"
      - "urbi-release-*"
    paths-ignore:
      - "**.md"
      - "doc/**"
      - ".git/"
      - ".vscode/"

jobs:
  check-typos:
    # runs-on: [misc]
    runs-on: ubuntu-latest
    steps:
      - name: typos-action
        uses: crate-ci/typos@v1.23.1
        with:
          files: "mapness/**/*.dart"
          write_changes: true

  auto-request-review:
    name: Auto Request Review CODEOWNERS
    runs-on: ubuntu-latest
    # runs-on: [misc]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Request review based on files changes and/or groups the author belongs to. CODEOWNERS
        uses: urbi-ae/auto-request-review@v0.17.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: .github/reviewers.yml # Config file location override

  notify-reviewers:
    name: Notify reviewers
    if: ${{ !github.event.pull_request.draft }}
    # runs-on: [misc]
    runs-on: ubuntu-latest
    needs: auto-request-review
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Send notification
        env:
          MM_CHANNEL_ID: ${{ secrets.MM_REVIEWERS_CHANNEL_ID }}
          MM_BOT_TOKEN: ${{ secrets.MM_BOT_TOKEN }}
          MM_DOMAIN: ${{ secrets.MM_DOMAIN }}
          MM_MAPPING_FILE: ${{ github.workspace }}/.github/mm_mapping.yml
        run: |
          # Get info about PR
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_API_URL="${{ github.event.pull_request.url }}"
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          EVENT_ACTION="${{ github.event.action }}"

          # Get reviewers
          REVIEWERS=$(curl -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" ${PR_API_URL}/requested_reviewers | jq -r '.users // [] | map(.login) | join(" ")')

          # If no reviewers, exiting
          if [ -z "${REVIEWERS}" ]; then
            echo "No reviewers to notify."
            exit 0
          fi

          # Get mattermost usernames from github usernames
          MENTION_REVIEWERS=""
          NOT_FOUND_REVIEWERS=""
          for reviewer in ${REVIEWERS}; do
            mattermost_user="$(reviewer=${reviewer} yq e '.[env(reviewer)] // ""' ${{ env.MM_MAPPING_FILE }})"
            if [ -n "${mattermost_user}" ]; then
              MENTION_REVIEWERS+="@${mattermost_user} "
              echo "Mattermost user ${mattermost_user} for reviewer ${reviewer}"
            else
              NOT_FOUND_REVIEWERS+="${reviewer} "
              echo "Couldn't map github username to mattermost for ${reviewer}"
            fi
          done

          # Create message depending on action type
          if [ "${EVENT_ACTION}" == "opened" ] || [ "${EVENT_ACTION}" == "reopened" ] || [ "${EVENT_ACTION}" == "ready_for_review" ]; then
            MESSAGE="${MENTION_REVIEWERS}\n\
          You were assigned as a reviewer:\n\
          **Pull request**: [${PR_TITLE}](${PR_URL})\n"
          elif [ "${EVENT_ACTION}" == "synchronize" ]; then
            MESSAGE="${MENTION_REVIEWERS}\n\
          There are some changes:\n\
          **Pull request**: [${PR_TITLE}](${PR_URL})\n"
          fi

          # Send notification mentioning reviewers
          curl -X POST -H 'Content-type: application/json' -H "Authorization: Bearer ${MM_BOT_TOKEN}" https://${MM_DOMAIN}/api/v4/posts -d "{\
            \"channel_id\": \"${MM_CHANNEL_ID}\", \
            \"message\": \"\
          ${MESSAGE}\
          **Branch**: ${PR_BRANCH}\n\
          **Author**: ${PR_AUTHOR}\
          \"\
          }"

          # Send notification if we couldn't map some reviewers to mattermost users
          if [ -n "${NOT_FOUND_REVIEWERS}" ]; then
            curl -X POST -H 'Content-type: application/json' -H "Authorization: Bearer ${MM_BOT_TOKEN}" https://${MM_DOMAIN}/api/v4/posts -d "{\
              \"channel_id\": \"${MM_CHANNEL_ID}\", \
              \"message\": \"Can't map github users to mattermost: $NOT_FOUND_REVIEWERS\"\
            }"
          fi

  linter:
    # runs-on: [self-hosted, Linux]
    runs-on: ubuntu-latest
    name: Lint flutter code
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: "stable"
          cache: true
      - name: Download Localazy
        uses: localazy/download@v1
        with:
          read_key: ${{ secrets.LOCALAZY_READ_KEY }}
          write_key: ${{ secrets.LOCALAZY_WRITE_KEY }}

      - name: Generate locale
        run: |
          cd mapness
          # FIXME: Workaround, see https://github.com/localazy/download/issues/3
          sudo chown github:github -R lib/l10n
          mkdir -p lib/l10n/generated
          flutter gen-l10n

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
                ${{ secrets.BALADY_AUTHORIZATION_DEPLOY_KEY_PLAIN }}
                ${{ secrets.BALADY_UIKIT_DEPLOY_KEY_PLAIN }}

      - name: Setup dgis_map_platform_interface
        run: |
          cd urbi_map/dgis_map_platform_interface
          mkdir lib/src/pigeons/
          mkdir ../dgis_map/android/src/main/kotlin/com/dgis/map/map_api
          flutter pub get
          flutter pub run pigeon --input pigeons/messages.dart

      - name: Setup dgis_map
        env: # Set the secret as an environment variable
          BALADY_DEVELOPERS_PASS: ${{ secrets.BALADY_DEVELOPERS_PASS }}
        run: |
          cd urbi_map/dgis_map
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Download dependenices
        env:
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no
        run: |
          cd mapness
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          cd ../
          flutter pub get

      - name: Analyze Flutter
        uses: ValentinVignal/action-dart-analyze@v0.17
        with:
          fail-on: "format"
          line-length: 120
          check-renamed-files: true
