  build:
    name: Build Android
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3
      - name: ⚙️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.10.3"
          channel: "stable"
          cache: true
      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "12.x"
          cache: "gradle"
        id: java
      - name: 🤖🔨 Development setup dgis_map_platform_interface
        run: |
          cd urbi_map/dgis_map_platform_interface
          mkdir lib/src/pigeons/
          mkdir ../dgis_map/android/src/main/kotlin/com/dgis/map/map_api
          flutter pub get
          flutter pub run pigeon --input pigeons/messages.dart
      - name: 🤖🔨 Development setup dgis_map
        run: |
          cd urbi_map/dgis_map
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: 🤖🔨 Development setup mapness
        run: |
          cd mapness
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🤖🔨 Download strings from Localazy
        uses: localazy/download@v1
        with:
          read_key: ${{ secrets.LOCALAZY_READ_KEY }}
          write_key: ${{ secrets.LOCALAZY_WRITE_KEY }}

      - name: 🤖🔨 Build Android app
        run: |
          flutter build apk --target lib/main_dev.dart --dart-define=GIT_BRANCH="$(git rev-parse --abbrev-ref HEAD)" --dart-define=GIT_COMMIT="$(git --no-pager show -s --format='%s')" --dart-define=VENDOR_CONFIG=prod
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-production.apk
          mv ./.github/workflows/staging-vendor-config.jsonx android/app/src/main/assets/vendor-config.jsonx
          flutter build apk --target lib/main_dev.dart --dart-define=GIT_BRANCH="$(git rev-parse --abbrev-ref HEAD)" --dart-define=GIT_COMMIT="$(git --no-pager show -s --format='%s')" --dart-define=VENDOR_CONFIG=staging
      - name: 🤖🔨 Upload Production apk
        uses: actions/upload-artifact@v3
        with:
          name: app-production.apk
          path: build/app/outputs/flutter-apk/app-production.apk
      - name: 🤖🔨 Upload Staging apk
        uses: actions/upload-artifact@v3
        with:
          name: app-staging.apk
          path: build/app/outputs/flutter-apk/app-release.apk

