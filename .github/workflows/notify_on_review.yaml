name: Notify on review (Teams + Telegram)

on:
  pull_request_review:
    types: [submitted]

jobs:
  notify-on-approvals:
    name: Notify when PR has 2 approvals
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Fetch PR reviews
        uses: octokit/request-action@v2.x
        id: reviews
        with:
          route: GET /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Count unique approvals (latest review per user)
        id: approvals
        run: |
          set -euo pipefail

          JSON='${{ steps.reviews.outputs.data }}'

          APPROVALS=$(
            echo "$JSON" | jq -r '
              sort_by(.submitted_at)
              | reduce .[] as $r ({}; .[$r.user.login] = $r.state)
              | to_entries
              | map(select(.value == "APPROVED"))
              | length
            '
          )

          echo "approval=$APPROVALS" >> "$GITHUB_OUTPUT"
          echo "Current unique approvals = $APPROVALS"

      - name: Send Teams notification if PR has 2 approvals
        if: steps.approvals.outputs.approval >= 2
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL_PR }}
        run: |
          set -euo pipefail

          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          APPROVALS="${{ steps.approvals.outputs.approval }}"

          MERGERS_FILE="${{ github.workspace }}/.github/mergers.yml"
          TEAMS_MAPPING_FILE="${{ github.workspace }}/.github/teams_mapping.yml"

          MENTION_TEXT=""
          ENTITIES="[]"

          while IFS= read -r gh; do
            [ -z "$gh" ] && continue

            tid=$(yq -r ".\"$gh\" // \"\"" "$TEAMS_MAPPING_FILE" || true)
            echo "merger='$gh' -> tid='$tid'"

            if [ -n "$tid" ] && [ "$tid" != "null" ]; then
              MENTION_TEXT="${MENTION_TEXT}<at>${gh}</at> "
              ENTITIES=$(echo "$ENTITIES" | jq --arg id "$tid" --arg name "$gh" '
                . + [{
                  "type":"mention",
                  "text":("<at>"+$name+"</at>"),
                  "mentioned":{"id":$id,"name":$name}
                }]
              ')
            else
              MENTION_TEXT="${MENTION_TEXT}${gh} "
            fi
          done < <(yq -r '.mergers[]' "$MERGERS_FILE")

          MESSAGE="${MENTION_TEXT}PR **[${PR_TITLE}](${PR_URL})** by **${PR_AUTHOR}** has received **${APPROVALS}** approvals. Please review and merge it."

          payload=$(jq -n \
            --arg msg "$MESSAGE" \
            --argjson entities "$ENTITIES" \
            '{
              "type":"message",
              "attachments":[
                {
                  "contentType":"application/vnd.microsoft.card.adaptive",
                  "content":{
                    "$schema":"http://adaptivecards.io/schemas/adaptive-card.json",
                    "type":"AdaptiveCard",
                    "version":"1.4",
                    "msteams":{"entities": $entities},
                    "body":[
                      {"type":"TextBlock","wrap":true,"text":"👀 PR ready to merge"},
                      {"type":"TextBlock","wrap":true,"text": $msg}
                    ]
                  }
                }
              ]
            }')

          curl -sS -X POST -H "Content-Type: application/json" --data "$payload" "$TEAMS_WEBHOOK_URL"

      - name: Send Telegram notification if PR has 2 approvals
        if: steps.approvals.outputs.approval >= 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          APPROVALS="${{ steps.approvals.outputs.approval }}"

          MERGERS_FILE="${{ github.workspace }}/.github/mergers.yml"
          TG_MAPPING_FILE="${{ github.workspace }}/.github/tg_mapping.yml"

          MENTION_TEXT=""

          while IFS= read -r gh; do
            [ -z "$gh" ] && continue

            tid=$(yq -r ".\"$gh\" // \"\"" "$TG_MAPPING_FILE" || true)
            echo "merger='$gh' -> tg_id='$tid'"

            if [ -n "$tid" ] && [ "$tid" != "null" ]; then
              MENTION_TEXT="${MENTION_TEXT}<a href=\"tg://user?id=${tid}\">${gh}</a> "
            else
              MENTION_TEXT="${MENTION_TEXT}${gh} "
            fi
          done < <(yq -r '.mergers[]' "$MERGERS_FILE")

          MESSAGE="$(printf '%s\n👀 PR ready to merge\n\n<b><a href="%s">%s</a></b> by <b>%s</b> has received <b>%s</b> approvals. Please review and merge it.' \
            "$MENTION_TEXT" "$PR_URL" "$PR_TITLE" "$PR_AUTHOR" "$APPROVALS")"

          payload=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$MESSAGE" \
            '{
              "chat_id": $chat_id,
              "text": $text,
              "parse_mode": "HTML",
              "disable_web_page_preview": true
            }')

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data "$payload"

  notify-pr-author:
    name: Notify author of PR about new review
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Map PR author to Teams user id
        id: map_teams
        run: |
          set -euo pipefail

          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          TEAMS_MAPPING_FILE="${{ github.workspace }}/.github/teams_mapping.yml"

          teams_id=$(yq -r ".\"$PR_AUTHOR\" // \"\"" "$TEAMS_MAPPING_FILE" || true)

          echo "PR author = $PR_AUTHOR"
          echo "teams_id=$teams_id" >> "$GITHUB_OUTPUT"

      - name: Map PR author to Telegram user id
        id: map_tg
        run: |
          set -euo pipefail

          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          TG_MAPPING_FILE="${{ github.workspace }}/.github/tg_mapping.yml"

          tg_id=$(yq -r ".\"$PR_AUTHOR\" // \"\"" "$TG_MAPPING_FILE" || true)

          echo "PR author = $PR_AUTHOR"
          echo "tg_id=$tg_id" >> "$GITHUB_OUTPUT"

      - name: Send Teams notification to PR author
        if: steps.map_teams.outputs.teams_id != ''
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL_PR }}
        run: |
          set -euo pipefail

          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          TEAMS_ID="${{ steps.map_teams.outputs.teams_id }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          REVIEW_STATE="${{ github.event.review.state }}"
          REVIEWER="${{ github.event.review.user.login }}"

          ENTITIES=$(jq -n --arg id "$TEAMS_ID" --arg name "$PR_AUTHOR" '
            [{
              "type":"mention",
              "text":("<at>"+$name+"</at>"),
              "mentioned":{"id":$id,"name":$name}
            }]
          ')

          MSG="<at>${PR_AUTHOR}</at> Your PR **[${PR_TITLE}](${PR_URL})** got a new review (${REVIEW_STATE}) from **${REVIEWER}**."

          payload=$(jq -n \
            --arg msg "$MSG" \
            --argjson entities "$ENTITIES" \
            '{
              "type":"message",
              "attachments":[
                {
                  "contentType":"application/vnd.microsoft.card.adaptive",
                  "content":{
                    "$schema":"http://adaptivecards.io/schemas/adaptive-card.json",
                    "type":"AdaptiveCard",
                    "version":"1.4",
                    "msteams":{"entities": $entities},
                    "body":[
                      {"type":"TextBlock","wrap":true,"text":"🔔 New PR review"},
                      {"type":"TextBlock","wrap":true,"text": $msg}
                    ]
                  }
                }
              ]
            }')

          curl -sS -X POST -H "Content-Type: application/json" --data "$payload" "$TEAMS_WEBHOOK_URL"

      - name: Send Telegram notification to PR author
        if: steps.map_tg.outputs.tg_id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          TG_ID="${{ steps.map_tg.outputs.tg_id }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          REVIEW_STATE="${{ github.event.review.state }}"
          REVIEWER="${{ github.event.review.user.login }}"

          MSG="$(printf '🔔 New PR review\n\n<a href="tg://user?id=%s">%s</a> your PR <b><a href="%s">%s</a></b> got a new review (<b>%s</b>) from <b>%s</b>.' \
            "$TG_ID" "$PR_AUTHOR" "$PR_URL" "$PR_TITLE" "$REVIEW_STATE" "$REVIEWER")"

          payload=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$MSG" \
            '{
              "chat_id": $chat_id,
              "text": $text,
              "parse_mode": "HTML",
              "disable_web_page_preview": true
            }')

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data "$payload"

      - name: Can't map PR author to Teams or Telegram
        if: steps.map_teams.outputs.teams_id == '' && steps.map_tg.outputs.tg_id == ''
        run: |
          echo "Can't convert GitHub username '${{ github.event.pull_request.user.login }}' to Teams or Telegram user id"
