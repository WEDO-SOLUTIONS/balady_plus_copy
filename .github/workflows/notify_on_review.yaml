name: Notify on review

on:
  pull_request_review:
    types:
      - submitted

jobs:
  notify-on-approvals:
    name: Notify when PR has 2 approvals
    # runs-on: [misc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - uses: octokit/request-action@v2.x
        id: check_approvals
        with:
          route: GET /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: test_variables
        run: |
          JSON_RESPONSE='${{ steps.check_approvals.outputs.data }}'
          CURRENT_APPROVALS_COUNT=$(echo $JSON_RESPONSE | jq -c '[.[] | select(.state | contains("APPROVED")) ] | length')
          echo "approval=${CURRENT_APPROVALS_COUNT}" >> $GITHUB_OUTPUT
          echo "Current approvals = ${CURRENT_APPROVALS_COUNT}"
      - name: Send notification if PR has 2 approvals
        if: steps.test_variables.outputs.approval >= 2
        env:
          MM_CHANNEL_ID: ${{ secrets.MM_REVIEWERS_CHANNEL_ID }}
          MM_BOT_TOKEN: ${{ secrets.MM_BOT_TOKEN }}
          MM_DOMAIN: ${{ secrets.MM_DOMAIN }}
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          MM_MERGERS_FILE="${{ github.workspace }}/.github/mergers.yml"

          mergers=$(yq e '.mergers | join(", ")' "${MM_MERGERS_FILE}")

          MESSAGE="PR **[${PR_TITLE}](${PR_URL})** by **${PR_AUTHOR}** has received 2 or more approvals. ${mergers}, please review and merge it."

          curl -X POST -H 'Content-type: application/json' -H "Authorization: Bearer ${MM_BOT_TOKEN}" https://${MM_DOMAIN}/api/v4/posts -d "{\
            \"channel_id\": \"${MM_CHANNEL_ID}\", \
            \"message\": \"${MESSAGE}\"\
          }"

  notify-pr-author:
    name: Notify author of PR about new review
    # runs-on: [misc]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Get Mattermost username for PR author
        id: get_mm_username
        run: |

          # Get info about PR
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"

          MM_MAPPING_FILE="${{ github.workspace }}/.github/mm_mapping.yml"
          mattermost_user=$(yq e ".${PR_AUTHOR} // \"\"" "${MM_MAPPING_FILE}")
          echo "Mattermost user for PR author ${PR_AUTHOR} is ${mattermost_user}"
          echo "mm_user=${mattermost_user}" >> $GITHUB_OUTPUT
      - name: Send notification to PR author
        if: steps.get_mm_username.outputs.mm_user != ''
        env:
          MM_CHANNEL_ID: ${{ secrets.MM_REVIEWERS_CHANNEL_ID }}
          MM_BOT_TOKEN: ${{ secrets.MM_BOT_TOKEN }}
          MM_DOMAIN: ${{ secrets.MM_DOMAIN }}
        run: |
          MM_USER="${{ steps.get_mm_username.outputs.mm_user }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"

          MESSAGE="@${MM_USER} Your PR **[${PR_TITLE}](${PR_URL})** got new review."
          curl -X POST -H 'Content-type: application/json' -H "Authorization: Bearer ${MM_BOT_TOKEN}" https://${MM_DOMAIN}/api/v4/posts -d "{\
            \"channel_id\": \"${MM_CHANNEL_ID}\", \
            \"message\": \"${MESSAGE}\"\
          }"
      - name: Cant get PR author MM username
        if: steps.get_mm_username.outputs.mm_user == ''
        run: |
          echo "Cant convert Github username ${PR_AUTHOR} to MM username"
