# yamllint disable rule:line-length
---
name: 🔨🤖 Android Build

permissions: write-all

concurrency:
  # Ensure only one run per (branch + environment), cancel older ones
  group: android-${{ github.event_name }}-${{ github.head_ref || github.ref_name || inputs.branch }}-${{ inputs.environment || 'auto' }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to build"
        required: true
        default: "core"
        type: string
      environment:
        description: "Environment / flavor"
        required: true
        type: choice
        options: [stg, prod, pre]
      build_label:
        description: "Custom build label (e.g. 'fix-login', 'release-candidate')"
        required: false
        default: ""
        type: string

jobs:
  build:
    name: Build Android (manual or PR merged)
    runs-on: ubuntu-latest # [self-hosted, macOS, ARM64]
    timeout-minutes: 60

    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Resolve build context (branch/env/ref)
        id: ctx
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ inputs.branch }}"
            ENVIRONMENT="${{ inputs.environment }}"
            CHECKOUT_REF="${{ inputs.branch }}"
            BASE_BRANCH=""
            HEAD_BRANCH=""
          else
          # pull_request closed + merged == true (guarded by job.if)
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
          BRANCH="$HEAD_BRANCH"
        
          # Build merged result (exact commit that got merged into base)
          CHECKOUT_REF="${{ github.event.pull_request.merge_commit_sha }}"
        
          # Temporary: always build stg
          ENVIRONMENT="stg"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"

          echo "Resolved:"
          echo "  event        = ${{ github.event_name }}"
          echo "  checkout_ref = $CHECKOUT_REF"
          echo "  branch       = $BRANCH"
          echo "  environment  = $ENVIRONMENT"
          [ -n "$BASE_BRANCH" ] && echo "  base_branch  = $BASE_BRANCH" || true
          [ -n "$HEAD_BRANCH" ] && echo "  head_branch  = $HEAD_BRANCH" || true

      - name: 🧹 Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.checkout_ref }}

      - name: Inject git variables
        shell: bash
        run: |
          # Store last commit message as CI_GIT_COMMIT (used as "commit" info)
          echo "CI_GIT_COMMIT=$(git --no-pager show -s --format='%s')" >> ${GITHUB_ENV}

          # Current date suffix used in artifact naming
          export CI_DATE=$(date '+%Y-%m-%d-%H-%M-%S')

          # Branch (manual: input branch, PR: head branch)
          export CI_GIT_BRANCH="${{ steps.ctx.outputs.branch }}"

          # For manual workflow, CI_IS_PR empty; for PR build, set prefix
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            export CI_IS_PR="pr-"
          else
            export CI_IS_PR=""
          fi

          # Load release version components from .release_version file
          source .release_version
          export CI_RELEASE_VERSION="${major}.${minor}.${patch}-rc${candidate}"

          # Export variables to GitHub Actions environment
          echo "CI_RELEASE_VERSION=${CI_RELEASE_VERSION}" >> ${GITHUB_ENV}
          echo "CI_GIT_BRANCH=${CI_GIT_BRANCH}" >> ${GITHUB_ENV}

          # Generate a safe slug from branch name (replace non-alnum with '-')
          CI_GIT_BRANCH_SLUG=$(printf '%s' "$CI_GIT_BRANCH" \
            | sed -E 's/[^[:alnum:]]+/-/g; s/^-+//; s/-+$//')
          # Artifact suffix: [optional label] + [optional pr-] + branch slug + timestamp
          BUILD_LABEL="${{ inputs.build_label }}"
          BUILD_LABEL_SLUG=$(printf '%s' "$BUILD_LABEL" | sed -E 's/[^[:alnum:]]+/-/g; s/^-+//; s/-+$//')
          if [ -n "$BUILD_LABEL_SLUG" ]; then
            echo "CI_ARTIFACT_SUFFIX=${BUILD_LABEL_SLUG}-${CI_IS_PR}${CI_GIT_BRANCH_SLUG}-${CI_DATE}" >> ${GITHUB_ENV}
          else
            echo "CI_ARTIFACT_SUFFIX=${CI_IS_PR}${CI_GIT_BRANCH_SLUG}-${CI_DATE}" >> ${GITHUB_ENV}
          fi
          echo "CI_IS_PR=${CI_IS_PR}" >> ${GITHUB_ENV}
          echo "PATH=${PATH}:/opt/homebrew/bin" >> ${GITHUB_ENV}

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Setup Flutter
        run: |
          fvm install
          fvm use

      - name: "Setup just"
        uses: extractions/setup-just@v2
        with:
          just-version: "1.25.2"

      - name: Install Localazy CLI
        run: npm install -g @localazy/cli

      - name: "Prebuild"
        env:
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no
          LOCALAZY_READ_KEY: ${{ secrets.LOCALAZY_READ_KEY }}
          LOCALAZY_WRITE_KEY: ${{ secrets.LOCALAZY_WRITE_KEY }}
        run: |
          just locale_gen

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17.x"
          #cache: "gradle"
        id: java

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🤖🔨 Development setup dgis_map_platform_interface
        run: |
          cd urbi_map/dgis_map_platform_interface
          mkdir -p lib/src/pigeons/
          mkdir -p ../dgis_map/android/src/main/kotlin/com/dgis/map/map_api
          fvm flutter pub get
          fvm flutter pub run pigeon --input pigeons/messages.dart

      - name: 🤖🔨 Development setup dgis_map
        env:
          BALADY_DEVELOPERS_PASS: ${{ secrets.BALADY_DEVELOPERS_PASS }}
        run: |
          cd urbi_map/dgis_map
          fvm flutter pub get
          fvm flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🤖🔨 Development setup mapness
        env:
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no
        run: |
          cd mapness
          fvm flutter pub get
          fvm flutter pub run build_runner build --delete-conflicting-outputs
          # Restore assets.gen.dart — flutter_gen_runner version on CI may differ from local
          git checkout HEAD -- lib/_generated/assets/assets.gen.dart

      - name: Select Android build params
        id: select
        shell: bash
        run: |
          ENVIRONMENT="${{ steps.ctx.outputs.environment }}"
          echo "Selected environment: ${ENVIRONMENT}"

          # Each flavor reports into its own PostHog project, so R8 mappings
          # must be uploaded to the matching one; stg and pre share a project.
          if [ "$ENVIRONMENT" = "stg" ]; then
            echo "flavor=stg" >> "$GITHUB_OUTPUT"
            echo "target=lib/main_stg.dart" >> "$GITHUB_OUTPUT"
            echo "vendor_config=momrah-stage" >> "$GITHUB_OUTPUT"
            echo "build_name_prefix=momrah-stage" >> "$GITHUB_OUTPUT"
            echo "posthog_project_id=${{ vars.POSTHOG_PROJECT_ID_STG }}" >> "$GITHUB_OUTPUT"
          elif [ "$ENVIRONMENT" = "prod" ]; then
            echo "flavor=prod" >> "$GITHUB_OUTPUT"
            echo "target=lib/main_prod.dart" >> "$GITHUB_OUTPUT"
            echo "vendor_config=momrah-prod" >> "$GITHUB_OUTPUT"
            echo "build_name_prefix=momrah-prod" >> "$GITHUB_OUTPUT"
            echo "posthog_project_id=${{ vars.POSTHOG_PROJECT_ID_PROD }}" >> "$GITHUB_OUTPUT"
          elif [ "$ENVIRONMENT" = "pre" ]; then
            echo "flavor=pre" >> "$GITHUB_OUTPUT"
            echo "target=lib/main_urbi_pre.dart" >> "$GITHUB_OUTPUT"
            echo "vendor_config=urbi-pre-prod" >> "$GITHUB_OUTPUT"
            echo "build_name_prefix=urbi-pre" >> "$GITHUB_OUTPUT"
            echo "posthog_project_id=${{ vars.POSTHOG_PROJECT_ID_STG }}" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown environment: ${ENVIRONMENT}"
            exit 1
          fi

          echo "Flavor: $(grep '^flavor=' $GITHUB_OUTPUT | cut -d= -f2)"
          echo "Target: $(grep '^target=' $GITHUB_OUTPUT | cut -d= -f2)"
          echo "Vendor config: $(grep '^vendor_config=' $GITHUB_OUTPUT | cut -d= -f2)"
          echo "Build name prefix: $(grep '^build_name_prefix=' $GITHUB_OUTPUT | cut -d= -f2)"

      - name: Ensure Flutter engine artifacts (Android) and packages are present
        shell: bash
        run: |
          fvm flutter precache --android --force
          fvm flutter pub cache repair
          fvm flutter pub get

      - name: Install PostHog CLI
        continue-on-error: true
        run: npm install -g @posthog/cli@latest

      - name: 🤖🔨 Build Android app
        env:
          FLAVOR: ${{ steps.select.outputs.flavor }}
          TARGET: ${{ steps.select.outputs.target }}
          VENDOR_CONFIG: ${{ steps.select.outputs.vendor_config }}
          BUILD_NAME_PREFIX: ${{ steps.select.outputs.build_name_prefix }}
          # R8 mapping upload for crash reporting. The Gradle plugin applies
          # itself only when POSTHOG_CLI_API_KEY is set (android/app/build.gradle),
          # so with no secret configured the build is byte-for-byte what it was.
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_HOST: https://eu.posthog.com
          POSTHOG_CLI_PROJECT_ID: ${{ steps.select.outputs.posthog_project_id }}
        run: |
          echo "Building flavor: ${FLAVOR}"
          echo "Target: ${TARGET}"
          echo "Vendor config: ${VENDOR_CONFIG}"
          echo "Build name prefix: ${BUILD_NAME_PREFIX}"

          fvm flutter build apk \
            --flavor "${FLAVOR}" \
            --target "${TARGET}" \
            --dart-define=CI_RELEASE_VERSION="${CI_RELEASE_VERSION}" \
            --dart-define=CI_BUILD_NAME="${BUILD_NAME_PREFIX}-${CI_ARTIFACT_SUFFIX}" \
            --dart-define=GIT_BRANCH="${CI_GIT_BRANCH}" \
            --dart-define=GIT_COMMIT="${CI_GIT_COMMIT}" \
            --dart-define=VENDOR_CONFIG="${VENDOR_CONFIG}"

          mv "build/app/outputs/flutter-apk/app-${FLAVOR}-release.apk" \
             "build/app/outputs/flutter-apk/${BUILD_NAME_PREFIX}-${CI_ARTIFACT_SUFFIX}.apk"

      - name: 📤 Upload APK to GitHub Releases
        id: upload_apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ARTIFACT_NAME="${{ steps.select.outputs.build_name_prefix }}-${CI_ARTIFACT_SUFFIX}.apk"
          LOCAL_FILE="build/app/outputs/flutter-apk/${ARTIFACT_NAME}"
          TAG="build-${CI_ARTIFACT_SUFFIX}"

          if [ ! -f "$LOCAL_FILE" ]; then
            echo "APK not found: $LOCAL_FILE"
            exit 1
          fi

          NOTES="Branch: ${CI_GIT_BRANCH}"$'\n'"Environment: ${{ steps.ctx.outputs.environment }}"$'\n'"Author: ${{ github.actor }}"$'\n'"Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "Creating release $TAG..."
          gh release create "$TAG" \
            --title "$ARTIFACT_NAME" \
            --notes "$NOTES" \
            --prerelease \
            "$LOCAL_FILE"

          RELEASE_URL=$(gh release view "$TAG" --json url -q .url)
          echo "release-url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "Release created: $RELEASE_URL"

      - name: 🧹 Delete old releases (keep last 10)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Get all pre-releases sorted by date, skip first 10
          OLD_TAGS=$(gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            | jq -r '[.[] | select(.isPrerelease == true)] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName')

          if [ -z "$OLD_TAGS" ]; then
            echo "Nothing to clean up."
            exit 0
          fi

          for tag in $OLD_TAGS; do
            echo "Deleting release $tag..."
            gh release delete "$tag" --yes --cleanup-tag || true
          done

      - name: 🔔 Send Telegram notification
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BUILDS_CHAT_ID: ${{ secrets.TELEGRAM_BUILDS_CHAT_ID }}
        run: |
          set -euo pipefail

          ARTIFACT_NAME="${{ steps.upload_apk.outputs.artifact-name }}"
          RELEASE_URL="${{ steps.upload_apk.outputs.release-url }}"
          BRANCH="${CI_GIT_BRANCH}"
          ACTOR="${{ github.actor }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          JOB_STATUS="${{ job.status }}"

          if [ "$JOB_STATUS" = "success" ]; then
            ICON="✅"
            TOPIC_NAME="${ARTIFACT_NAME}"
            DOWNLOAD_LINE="$(printf '\n📥 <a href="%s">Download APK</a>' "$RELEASE_URL")"
          else
            ICON="❌"
            TOPIC_NAME="❌ ${{ steps.select.outputs.build_name_prefix }}-${CI_ARTIFACT_SUFFIX}"
            DOWNLOAD_LINE=""
          fi

          PR_LINE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_LINE="$(printf '\n🔗 PR: %s' '${{ github.event.pull_request.html_url }}')"
          fi

          # Create forum topic
          TOPIC_RESP=$(curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/createForumTopic" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_BUILDS_CHAT_ID}\",\"name\":\"${TOPIC_NAME}\"}")

          THREAD_ID=$(echo "$TOPIC_RESP" | jq -r '.result.message_thread_id')

          if [ -z "$THREAD_ID" ] || [ "$THREAD_ID" = "null" ]; then
            echo "Failed to create topic: $TOPIC_RESP"
            exit 1
          fi

          MSG="$(printf '%s <b>Android build %s</b>\n\n🌿 Branch: <code>%s</code>\n👤 Author: %s\n🔧 Environment: %s%s%s\n▶️ <a href="%s">Open run</a>' \
            "$ICON" "$JOB_STATUS" "$BRANCH" "$ACTOR" "${{ steps.ctx.outputs.environment }}" "$PR_LINE" "$DOWNLOAD_LINE" "$RUN_URL")"

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "$TELEGRAM_BUILDS_CHAT_ID" \
              --argjson thread_id "$THREAD_ID" \
              --arg text "$MSG" \
              '{chat_id:$chat_id,message_thread_id:$thread_id,text:$text,parse_mode:"HTML",disable_web_page_preview:true}')"

          echo "Telegram notification sent."

      - name: 🧹 Cleanup workspace
        if: ${{ success() }}
        run: |
          rm -rf build/* || true
          rm -rf ~/.gradle/caches/build-cache-* || true
          df -h
