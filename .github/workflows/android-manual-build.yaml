# yamllint disable rule:line-length
---
name: 🔨🤖 Android Manual Build

permissions: write-all

concurrency:
  # Ensure only one manual run per (branch + environment), cancel older ones
  group: android-manual-${{ github.event.inputs.branch }}-${{ github.event.inputs.environment }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to build"
        required: true
        default: "urbi"
        type: string
      environment:
        description: "Environment / flavor"
        required: true
        type: choice
        options:
          - stg
          - prod
          - pre

jobs:
  build:
    name: Build Android (manual)
    runs-on: ubuntu-latest
    # For self-hosted Linux runner, uncomment the line below and comment ubuntu-latest
    # runs-on: [self-hosted, Linux]
    timeout-minutes: 60

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          # Checkout the branch selected in the manual trigger
          ref: ${{ github.event.inputs.branch }}

      - name: 🧹 Free disk space (aggressive)
        run: |
          echo "Before cleanup:"
          df -h

          # Remove large SDKs and tools that are not required for this build
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL

          # Remove large Android SDK components we don't use here
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /usr/local/lib/android/sdk/cmdline-tools || true

          # Clean up Docker images
          docker image prune -f || true

          echo "After cleanup:"
          df -h

      - name: Inject git variables
        run: |
          # Store last commit message as CI_GIT_COMMIT (used as "commit" info)
          echo "CI_GIT_COMMIT=$(git --no-pager show -s --format='%s')" >> ${GITHUB_ENV}

          # Current date suffix used in artifact naming
          export CI_DATE=$(date '+%Y-%m-%d-%H-%M-%S')

          # For manual workflow, branch comes from input
          export CI_GIT_BRANCH="${{ github.event.inputs.branch }}"
          export CI_IS_PR=""

          # Load release version components from .release_version file
          source .release_version
          export CI_RELEASE_VERSION="${major}.${minor}.${patch}-rc${candidate}"

          # Export variables to GitHub Actions environment
          echo "CI_RELEASE_VERSION=${CI_RELEASE_VERSION}" >> ${GITHUB_ENV}
          echo "CI_GIT_BRANCH=${CI_GIT_BRANCH}" >> ${GITHUB_ENV}

          # Generate a safe slug from branch name (replace non-alnum with '-')
          CI_GIT_BRANCH_SLUG=$(echo -n ${CI_GIT_BRANCH} | tr --complement --squeeze-repeats '[:alnum:]' '-')

          # Artifact suffix: [optional pr-] + branch slug + timestamp
          echo "CI_ARTIFACT_SUFFIX=${CI_IS_PR}${CI_GIT_BRANCH_SLUG}-${CI_DATE}" >> ${GITHUB_ENV}
          echo "CI_IS_PR=${CI_IS_PR}" >> ${GITHUB_ENV}

      - name: ⚙️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"
          cache: true

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17.x"
          cache: "gradle"
        id: java

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🤖🔨 Download strings from Localazy
        uses: localazy/download@v1
        with:
          read_key: ${{ secrets.LOCALAZY_READ_KEY }}
          write_key: ${{ secrets.LOCALAZY_WRITE_KEY }}

      - name: 🤖🔨 Generate dart locale bindings
        run: |
          cd mapness
          # Workaround for Localazy permissions issue on CI
          sudo chown $(whoami):$(whoami) -R lib/l10n
          mkdir -p lib/l10n/generated
          flutter gen-l10n

      - name: 🔍 Run Flutter analyzer (early check)
        run: |
          cd mapness
          flutter analyze

      - name: 🤖🔨 Development setup dgis_map_platform_interface
        run: |
          cd urbi_map/dgis_map_platform_interface

          # Ensure required directories for generated Pigeon code exist
          mkdir -p lib/src/pigeons/
          mkdir -p ../dgis_map/android/src/main/kotlin/com/dgis/map/map_api

          # Get dependencies and generate Pigeon interfaces
          flutter pub get
          flutter pub run pigeon --input pigeons/messages.dart

      - name: 🤖🔨 Development setup dgis_map
        env:
          # Secret used during build_runner or private access if required
          BALADY_DEVELOPERS_PASS: ${{ secrets.BALADY_DEVELOPERS_PASS }}
        run: |
          cd urbi_map/dgis_map
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🤖🔨 Development setup mapness
        env:
          # Allow cloning private repos without strict host key checking
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no
        run: |
          cd mapness
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🔍 Run Flutter analyzer (early check)
        run: |
          cd mapness
          flutter analyze

      - name: Select Android build params
        id: select
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          echo "Selected environment: ${ENVIRONMENT}"

          # Map environment to flavor, entrypoint target, vendor config and build name prefix
          if [ "$ENVIRONMENT" = "stg" ]; then
            echo "flavor=stg" >> "$GITHUB_OUTPUT"
            echo "target=lib/main_stg.dart" >> "$GITHUB_OUTPUT"
            echo "vendor_config=momrah-stage" >> "$GITHUB_OUTPUT"
            echo "build_name_prefix=momrah-stage" >> "$GITHUB_OUTPUT"
          elif [ "$ENVIRONMENT" = "prod" ]; then
            echo "flavor=prod" >> "$GITHUB_OUTPUT"
            echo "target=lib/main_prod.dart" >> "$GITHUB_OUTPUT"
            echo "vendor_config=momrah-prod" >> "$GITHUB_OUTPUT"
            echo "build_name_prefix=momrah-prod" >> "$GITHUB_OUTPUT"
          elif [ "$ENVIRONMENT" = "pre" ]; then
            echo "flavor=pre" >> "$GITHUB_OUTPUT"
            echo "target=lib/main_urbi_pre.dart" >> "$GITHUB_OUTPUT"
            echo "vendor_config=urbi-pre-prod" >> "$GITHUB_OUTPUT"
            echo "build_name_prefix=urbi-pre" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown environment: ${ENVIRONMENT}"
            exit 1
          fi

          echo "Flavor: $(grep '^flavor=' $GITHUB_OUTPUT | cut -d= -f2)"
          echo "Target: $(grep '^target=' $GITHUB_OUTPUT | cut -d= -f2)"
          echo "Vendor config: $(grep '^vendor_config=' $GITHUB_OUTPUT | cut -d= -f2)"
          echo "Build name prefix: $(grep '^build_name_prefix=' $GITHUB_OUTPUT | cut -d= -f2)"

      - name: 🤖🔨 Build Android app
        env:
          FLAVOR: ${{ steps.select.outputs.flavor }}
          TARGET: ${{ steps.select.outputs.target }}
          VENDOR_CONFIG: ${{ steps.select.outputs.vendor_config }}
          BUILD_NAME_PREFIX: ${{ steps.select.outputs.build_name_prefix }}
        run: |
          echo "Building flavor: ${FLAVOR}"
          echo "Target: ${TARGET}"
          echo "Vendor config: ${VENDOR_CONFIG}"
          echo "Build name prefix: ${BUILD_NAME_PREFIX}"

          flutter build apk \
            --target-platform android-arm64 \
            --flavor "${FLAVOR}" \
            --target "${TARGET}" \
            --dart-define=CI_RELEASE_VERSION="${CI_RELEASE_VERSION}" \
            --dart-define=CI_BUILD_NAME="${BUILD_NAME_PREFIX}-${CI_ARTIFACT_SUFFIX}" \
            --dart-define=GIT_BRANCH="${CI_GIT_BRANCH}" \
            --dart-define=GIT_COMMIT="${CI_GIT_COMMIT}" \
            --dart-define=VENDOR_CONFIG="${VENDOR_CONFIG}"

          # Rename output APK to include environment-specific name and artifact suffix
          mv "build/app/outputs/flutter-apk/app-${FLAVOR}-release.apk" \
             "build/app/outputs/flutter-apk/${BUILD_NAME_PREFIX}-${CI_ARTIFACT_SUFFIX}.apk"

      - name: 🤖🔨 Upload Android apk
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          # Artifact name matches the final APK file name
          name: ${{ steps.select.outputs.build_name_prefix }}-${{ env.CI_ARTIFACT_SUFFIX }}.apk
          compression-level: 0
          path: build/app/outputs/flutter-apk/${{ steps.select.outputs.build_name_prefix }}-${{ env.CI_ARTIFACT_SUFFIX }}.apk

      - name: 🔔 Send link to Microsoft Teams
        if: ${{ success() }}
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ env.CI_GIT_BRANCH }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ""  # No PR context for manual workflow; keep empty
          ARTIFACT_NAME: ${{ steps.select.outputs.build_name_prefix }}-${{ env.CI_ARTIFACT_SUFFIX }}.apk
          # Direct artifact URL from upload-artifact v4 (requires GitHub login to download)
          ARTIFACT_URL: ${{ steps.upload_apk.outputs.artifact-url }}
        run: |
          # Use blue color for success, orange-red for non-success
          COLOR="0076D7"; [ "$JOB_STATUS" != "success" ] && COLOR="D83B01"

          # No PR line for manual workflow, leave empty
          PR_LINE=""

          # ---- Extract task id (e.g. UBS-23) from branch name or PR title ----
          TASK_ID=""
          # Try to extract task id from branch name (supports slashes)
          TASK_ID=$(echo "$BRANCH"   | grep -oE '[A-Z]+-[0-9]+' | head -n1 || true)
          # Fallback: extract task id from PR title (will usually be empty here)
          if [ -z "$TASK_ID" ] && [ -n "$PR_TITLE" ]; then
            TASK_ID=$(echo "$PR_TITLE" | grep -oE '[A-Z]+-[0-9]+' | head -n1 || true)
          fi

          TASK_LINE=""
          if [ -n "$TASK_ID" ]; then
            TASK_URL="https://urbi-flutter-team.youtrack.cloud/issue/${TASK_ID}"
            TASK_LINE="**Task**: [${TASK_ID}](${TASK_URL})\n"
          fi
          # -------------------------------------------------------------------

          # Teams MessageCard payload with placeholders to replace
          PAYLOAD="$(cat <<'EOF'
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "themeColor": "__COLOR__",
            "summary": "Android manual build",
            "title": "📦 Android manual build — __STATUS__",
            "sections": [
              {
                "text": "__PR_LINE____TASK_LINE__**Branch**: [__BRANCH__](__REPO_URL__/tree/__BRANCH__)\n**Author**: __ACTOR__\n**Artifact**: [__ARTIFACT_NAME__](__ARTIFACT_URL__)\n**Run**: [Open run](__RUN_URL__)"
              }
            ]
          }
          EOF
          )"

          # Replace placeholders in the JSON payload
          PAYLOAD="${PAYLOAD/__COLOR__/$COLOR}"
          PAYLOAD="${PAYLOAD/__STATUS__/$JOB_STATUS}"
          PAYLOAD="${PAYLOAD/__PR_LINE__/$PR_LINE}"
          PAYLOAD="${PAYLOAD/__TASK_LINE__/$TASK_LINE}"
          PAYLOAD="${PAYLOAD/__BRANCH__/$BRANCH}"
          PAYLOAD="${PAYLOAD/__REPO_URL__/$REPO_URL}"
          PAYLOAD="${PAYLOAD/__ACTOR__/$ACTOR}"
          PAYLOAD="${PAYLOAD/__RUN_URL__/$RUN_URL}"
          PAYLOAD="${PAYLOAD/__ARTIFACT_NAME__/$ARTIFACT_NAME}"
          PAYLOAD="${PAYLOAD/__ARTIFACT_URL__/$ARTIFACT_URL}"

          # Send message to Microsoft Teams incoming webhook
          curl -sS -H 'Content-Type: application/json' -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL"

      - name: 🧹 Cleanup workspace
        if: ${{ success() }}
        run: |
          # Clean project build outputs and Gradle caches to free disk space
          rm -rf build/* || true
          rm -rf ~/.gradle/caches/build-cache-* || true
          df -h