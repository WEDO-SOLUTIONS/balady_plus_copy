name: Update PR Target Branches for Release

on:
  push:
    branches:
      - 'urbi-release-*'

jobs:
  update-pr-target-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Update PR target branches
        uses: actions/github-script@v6
        with:
          script: |
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            for (const pr of pullRequests) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                base: $GITHUB_REF
              });
              console.log(`Updated PR #${pr.number} to target branch ${process.env.CURRENT_BRANCH}`);
            }