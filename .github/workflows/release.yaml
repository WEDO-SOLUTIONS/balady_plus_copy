---
name: "pre-release"

on:
  push:
    branches:
      - "urbi"

jobs:
  release:
    name: "Release"
    runs-on: [self-hosted, Linux]
    steps:
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Urbi Release"
