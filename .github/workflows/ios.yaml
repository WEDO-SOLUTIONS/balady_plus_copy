# yamllint disable rule:line-length
---
name: Build iOS

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "urbi"
      - "urbi-release-*"
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    branches:
      - "urbi"
      - "urbi-release-*"
    paths-ignore:
      - "**.md"
      - "doc/**"
      - ".git/"
      - ".vscode/"

jobs:
  build:
    name: Build iOS
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # GITHUB_REF_SLUG
      - name: Inject git variables
        run: |
          echo "CI_GIT_COMMIT=$(git --no-pager show -s --format='%s')" >> ${GITHUB_ENV}
          export CI_GIT_BRANCH=${GITHUB_REF_NAME}
          export CI_IS_PR=""
          if [[ ${GITHUB_EVENT_NAME} == "pull_request" ]]; then
            export CI_GIT_BRANCH=${GITHUB_HEAD_REF}
            export CI_IS_PR="pr-"
          fi
          echo "CI_GIT_BRANCH=${CI_GIT_BRANCH}" >> ${GITHUB_ENV}
          CI_GIT_BRANCH_SLUG=$(echo -n ${CI_GIT_BRANCH} | tr -c -s '[:alnum:]' '-')
          echo "CI_ARTIFACT_SUFFIX=${CI_IS_PR}${CI_GIT_BRANCH_SLUG}" >> ${GITHUB_ENV}
          echo "CI_IS_PR=${CI_IS_PR}" >> ${GITHUB_ENV}
          echo "PATH=${PATH}:/opt/homebrew/bin" >> ${GITHUB_ENV}

      - name: Setup keychain
        env:
          LANG: en_US.UTF-8
          FILE_BALADY_CER: ${{ secrets.FILE_BALADY_CER }}
          FILE_BALADY_MOBILEPROVISION: ${{ secrets.FILE_BALADY_MOBILEPROVISION }}
          FILE_BALADY_P12: ${{ secrets.FILE_BALADY_P12 }}
        run: |
          KC="$HOME/Library/Keychains/build.keychain"
          KC_PASS='build-pass'
          KEY="$RUNNER_TEMP/balady.p12"
          CERT="$RUNNER_TEMP/balady.cer"
          PROFILE="$RUNNER_TEMP/balady.mobileprovision"
          APPLE_CERTS=(
              "AppleWWDRCAG2.cer"
              "AppleWWDRCAG3.cer"
              "AppleWWDRCAG4.cer"
              "AppleWWDRCAG5.cer"
              "AppleWWDRCAG6.cer"
              "AppleWWDRCAG7.cer"
              "AppleWWDRCAG8.cer"
              "DeveloperIDG2CA.cer"
          )

          # Presetup
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "$FILE_BALADY_CER" | base64 --decode > $CERT
          echo "$FILE_BALADY_P12" | base64 --decode > $KEY
          echo "$FILE_BALADY_MOBILEPROVISION" | base64 --decode > $PROFILE

          # Setup keychain
          security create-keychain -p $KC_PASS $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p $KC_PASS $KC
          # sudo chown -R root $KC-db

          curl https://developer.apple.com/certificationauthority/AppleWWDRCA.cer -o $RUNNER_TEMP/AppleWWDRCA.cer
          security import $RUNNER_TEMP/AppleWWDRCA.cer -k $KC -t cert -A -P '' -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild -T /usr/bin/productsign

          for APPLE_CERT in ${APPLE_CERTS[@]}; do
              curl https://www.apple.com/certificateauthority/$APPLE_CERT -o $RUNNER_TEMP/$APPLE_CERT
              security import $RUNNER_TEMP/$APPLE_CERT -k $KC -t cert -A -P '' -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild -T /usr/bin/productsign
          done

          security import $KEY -k $KC -f pkcs12 -A -P 'balady' -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild -T /usr/bin/productsign
          security import $CERT -k $KC -t cert -A -P '' -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild -T /usr/bin/productsign || true

          security default-keychain -s $KC
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k $KC_PASS $KC
          security list-keychains -s $KC

          # Install profile
          security cms -D -i $PROFILE -k $KC > $RUNNER_TEMP/provision.plist
          UUID=`/usr/libexec/PlistBuddy -c 'print UUID' $RUNNER_TEMP/provision.plist`

          cp $PROFILE ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

          security find-identity -p codesigning

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.10.3"
          channel: "stable"
          cache: true

      - name: Development setup mapness
        run: |
          flutter pub get
          cd mapness
          flutter pub get

      - name: iOS Setup
        env:
          LANG: en_US.UTF-8
        run: |
          cd ios
          echo FLUTTER PRECACHE
          flutter precache --ios
          echo POD REPO UPDATE
          pod repo update || true
          echo POD UPDATE
          pod update
          echo POD INSTALL
          pod install

      - name: Development setup dgis_map
        env: # Set the secret as an environment variable
          BALADY_DEVELOPERS_PASS: ${{ secrets.BALADY_DEVELOPERS_PASS }}
          LANG: en_US.UTF-8
        run: |
          cd urbi_map/dgis_map
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          mkdir -p ios/_DELETE_ME_
          curl -u "balady-developers:${BALADY_DEVELOPERS_PASS}" -O https://artifactory.2gis.dev/vendor-ios-release/10.2.1/Release/DGisFullSDK.zip
          rm -rf ios/_DELETE_ME_/DGis.xcframework
          unzip DGisFullSDK.zip -d ios/_DELETE_ME_
          rm DGisFullSDK.zip

      - name: Build app
        run: |
          KC="$HOME/Library/Keychains/build.keychain"
          KC_PASS='build-pass'

          momrahBundle='momra.balady.ios'
          urbiBundle='ae.urbi.balady'

          momrahTeam='9VKA788PDD'
          urbiTeam='A34FT8KT4H'

          codeSignAutomatic='CODE_SIGN_STYLE = Automatic;'
          codeSignManual='CODE_SIGN_STYLE = Manual;'

          codeSignIdentityDevelopment='CODE_SIGN_IDENTITY = "Apple Development";'
          codeSignIdentityDistribution='CODE_SIGN_IDENTITY = "iPhone Distribution";'

          provisionProfileNone='PROVISIONING_PROFILE_SPECIFIER = "";'
          provisionProfileAdHoc='PROVISIONING_PROFILE_SPECIFIER = "Balady Ad Hoc";'

          appDisplayNameProd='$(APP_DISPLAY_NAME)';
          appDisplayNameDev='Balady Dev';

          sed -i '' "s/$momrahBundle/$urbiBundle/" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/$momrahTeam/$urbiTeam/" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/$codeSignAutomatic/$codeSignManual/" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/$codeSignIdentityDevelopment/$codeSignIdentityDistribution/" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/$provisionProfileNone/$provisionProfileAdHoc/" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/$appDisplayNameProd/$appDisplayNameDev/" ios/Runner/Info.plist
          git apply mapness/scripts/sdkkey.patch || print_style '' 'red' 'could not apply sdk key patch'
          git apply mapness/scripts/icon.patch || print_style '' 'red' 'could not apply ios icon patch'

          # Build
          security unlock-keychain -p $KC_PASS $KC
          security find-identity -p codesigning

          fvm flutter build ipa --release --export-options-plist ios/ad_hoc_options.plist --target lib/main_dev.dart --flavor dev
          curl -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlbWFpbCI6ImEuc3RyaXpobmV2QHVyYmkuYWUifQ.DgmqmgZ-DeQfBt0R36s7nftEkk-XnFr6VVi2syD-jTE" -X PUT -F file=@build/ios/ipa/balady_plus.ipa https://baladyapp-builds.urbi.ae/builds/${CI_ARTIFACT_SUFFIX}

      - name: Cleanup keychain
        if: ${{ always() }}
        run: |
          LKC="$HOME/Library/Keychains/login.keychain"
          KC="$HOME/Library/Keychains/build.keychain"

          security list-keychains -s $LKC
          security default-keychain -s $LKC
          security delete-keychain $KC

          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/
