# yamllint disable rule:line-length
---
name: Build iOS

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "urbi"
      - "urbi-release-*"
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    branches:
      - "urbi"
      - "urbi-release-*"
    paths-ignore:
      - "**.md"
      - "doc/**"
      - ".git/"
      - ".vscode/"

jobs:
  build:
    name: Build iOS
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      LANG: en_US.UTF-8
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # GITHUB_REF_SLUG
      - name: Inject git variables
        run: |
          echo "CI_GIT_COMMIT=$(git --no-pager show -s --format='%s')" >> ${GITHUB_ENV}
          export CI_GIT_BRANCH=${GITHUB_REF_NAME}
          export CI_IS_PR=""
          if [[ ${GITHUB_EVENT_NAME} == "pull_request" ]]; then
            export CI_GIT_BRANCH=${GITHUB_HEAD_REF}
            export CI_IS_PR="pr-"
          fi
          source .release_version
          export CI_RELEASE_VERSION="${major}.${minor}.${patch}-rc${candidate}"
          echo "CI_RELEASE_VERSION=${CI_RELEASE_VERSION}" >> ${GITHUB_ENV}
          echo "CI_GIT_BRANCH=${CI_GIT_BRANCH}" >> ${GITHUB_ENV}
          CI_GIT_BRANCH_SLUG=$(echo -n ${CI_GIT_BRANCH} | tr -c -s '[:alnum:]' '-')
          echo "CI_ARTIFACT_SUFFIX=${CI_IS_PR}${CI_GIT_BRANCH_SLUG}" >> ${GITHUB_ENV}
          echo "CI_IS_PR=${CI_IS_PR}" >> ${GITHUB_ENV}
          echo "PATH=${PATH}:/opt/homebrew/bin" >> ${GITHUB_ENV}

      - name: Setup keychain
        env:
          FILE_BALADY_CER: ${{ secrets.FILE_BALADY_CER }}
          FILE_BALADY_MOBILEPROVISION: ${{ secrets.FILE_BALADY_MOBILEPROVISION }}
          FILE_BALADY_P12: ${{ secrets.FILE_BALADY_P12 }}
          FILE_APPSTORE_KEY: ${{ secrets.FILE_APPSTORE_KEY }}
        run: |
          zsh .github/scripts/setup_keychain.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"
          cache: true

      - name: "Setup just"
        uses: extractions/setup-just@v2
        with:
          just-version: "1.25.2"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.BALADY_AUTHORIZATION_DEPLOY_KEY_PLAIN }}
            ${{ secrets.BALADY_UIKIT_DEPLOY_KEY_PLAIN }}

      - name: "Prebuild"
        env:
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no
        run: |
          just apply-patches
          just locale_gen
          just ios_setup
          just prebuild

      - name: Build app
        run: |
          KC="$HOME/Library/Keychains/build.keychain"
          KC_PASS='build-pass'

          zsh .github/scripts/ad_hoc_patch.sh

          git apply mapness/scripts/sdkkey.patch || echo 'could not apply sdk key patch'
          git apply mapness/scripts/icon.patch || echo 'could not apply ios icon patch'

          # Build
          security unlock-keychain -p $KC_PASS $KC
          security find-identity -p codesigning

          fvm flutter build ipa --release --export-options-plist ios/ad_hoc_options.plist --target lib/main_prod.dart --flavor prod  --dart-define=CI_BUILD_NAME="${CI_ARTIFACT_SUFFIX}" --dart-define=CI_RELEASE_VERSION="${CI_RELEASE_VERSION}"
          BUILD_URL=$(curl -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlbWFpbCI6ImEuc3RyaXpobmV2QHVyYmkuYWUifQ.DgmqmgZ-DeQfBt0R36s7nftEkk-XnFr6VVi2syD-jTE" -X PUT -F file=@build/ios/ipa/balady_plus.ipa https://baladyapp-builds.urbi.ae/builds/momrah-${CI_ARTIFACT_SUFFIX}  | jq -r '.install_link')
          echo "BUILD_URL_PROD=${BUILD_URL}" >> ${GITHUB_ENV}

          fvm flutter build ipa --release --export-options-plist ios/ad_hoc_options.plist --target lib/main_stg.dart --flavor stg
          BUILD_URL=$(curl -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlbWFpbCI6ImEuc3RyaXpobmV2QHVyYmkuYWUifQ.DgmqmgZ-DeQfBt0R36s7nftEkk-XnFr6VVi2syD-jTE" -X PUT -F file=@build/ios/ipa/balady_plus.ipa https://baladyapp-builds.urbi.ae/builds/momrah-stg-${CI_ARTIFACT_SUFFIX}  | jq -r '.install_link')
          echo "BUILD_URL_STAGE=${BUILD_URL}" >> ${GITHUB_ENV}

          fvm flutter build ipa --release --export-options-plist ios/ad_hoc_options.plist --target lib/main_urbi_pre.dart --flavor pre
          BUILD_URL=$(curl -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlbWFpbCI6ImEuc3RyaXpobmV2QHVyYmkuYWUifQ.DgmqmgZ-DeQfBt0R36s7nftEkk-XnFr6VVi2syD-jTE" -X PUT -F file=@build/ios/ipa/balady_plus.ipa https://baladyapp-builds.urbi.ae/builds/momrah-pre-${CI_ARTIFACT_SUFFIX}  | jq -r '.install_link')
          echo "BUILD_URL_PRE=${BUILD_URL}" >> ${GITHUB_ENV}

      - name: Send notification to mattermost channel
        env: # Set the secret as an environment variable
          MM_CHANNEL_ID: ${{ secrets.MM_CHANNEL_ID }}
          MM_BOT_TOKEN: ${{ secrets.MM_BOT_TOKEN }}
          MM_DOMAIN: ${{ secrets.MM_DOMAIN }}
        run: |
          is_pr=""
          if [ -n "${CI_IS_PR}" ]; then
            is_pr="**Pull Request**: [${{ github.event.pull_request.title }}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${{ github.event.pull_request.number }})\n"
          fi
          curl -X POST -H 'Content-type: application/json' -H "Authorization: Bearer ${MM_BOT_TOKEN}" https://${MM_DOMAIN}/api/v4/posts -d "{ \
            \"channel_id\": \"${MM_CHANNEL_ID}\", \
            \"message\": \"\
          ${is_pr}\
          **Branch**: [${CI_GIT_BRANCH}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${CI_GIT_BRANCH})\n\
          **Author**: ${GITHUB_ACTOR}\n\
          **iOS pre**: [Build](${BUILD_URL_PRE})\n\
          **iOS prod**: [Build](${BUILD_URL_PROD})\n\
          **iOS stage**: [Build](${BUILD_URL_STAGE})\" \
          }"

      - name: Cleanup keychain
        if: ${{ always() }}
        run: |
          LKC="${HOME}/Library/Keychains/login.keychain"
          KC="${HOME}/Library/Keychains/build.keychain"
          security list-keychains -s $LKC
          security default-keychain -s $LKC
          security delete-keychain $KC

          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/
