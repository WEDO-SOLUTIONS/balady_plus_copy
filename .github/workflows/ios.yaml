# yamllint disable rule:line-length
---
name: Build iOS

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || inputs.branch || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to build"
        required: true
        default: "urbi"
        type: string
  # Automatic trigger on PR close (commented out - uncomment to enable automatic builds on PR merge)
  # pull_request:
  #   types: [closed]
  #   branches:
  #     - "urbi"
  #     - "urbi-service/release-*"
  #   paths-ignore:
  #     - "**.md"
  #     - "doc/**"
  #     - ".git/"
  #     - ".vscode/"

jobs:
  build:
    name: Build iOS
    # Condition for PR trigger (commented out - uncomment to enable automatic builds on PR merge)
    # if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.draft == false)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      LANG: en_US.UTF-8
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          # For manual dispatch: use input branch. For PR: use merge commit
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.pull_request.merge_commit_sha || github.ref }}

      # GITHUB_REF_SLUG
      - name: Inject git variables
        run: |
          echo "CI_GIT_COMMIT=$(git --no-pager show -s --format='%s')" >> ${GITHUB_ENV}

          # Determine branch and PR prefix based on event type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual dispatch: use input branch
            export CI_GIT_BRANCH="${{ inputs.branch }}"
            export CI_IS_PR=""
          else
            # PR event (commented out trigger - uncomment PR trigger above to use this)
            export CI_GIT_BRANCH="${{ github.event.pull_request.head.ref }}"
            export CI_IS_PR="pr-"
          fi
          source .release_version
          export CI_RELEASE_VERSION="${major}.${minor}.${patch}-rc${candidate}"
          echo "CI_RELEASE_VERSION=${CI_RELEASE_VERSION}" >> ${GITHUB_ENV}
          echo "CI_GIT_BRANCH=${CI_GIT_BRANCH}" >> ${GITHUB_ENV}
          CI_GIT_BRANCH_SLUG=$(echo -n ${CI_GIT_BRANCH} | tr -c -s '[:alnum:]' '-')
          echo "CI_ARTIFACT_SUFFIX=${CI_IS_PR}${CI_GIT_BRANCH_SLUG}" >> ${GITHUB_ENV}
          echo "CI_IS_PR=${CI_IS_PR}" >> ${GITHUB_ENV}
          echo "PATH=${PATH}:/opt/homebrew/bin" >> ${GITHUB_ENV}

      - name: AdSedare
        env:
          FILE_BALADY_CER: ${{ secrets.FILE_BALADY_CER }}
          FILE_BALADY_MOBILEPROVISION: ${{ secrets.FILE_BALADY_MOBILEPROVISION }}
          FILE_BALADY_P12: ${{ secrets.FILE_BALADY_P12 }}
          FILE_APPSTORE_KEY: ${{ secrets.FILE_APPSTORE_KEY }}
          ADSEDARE_MM_TOKEN: ${{ secrets.ADSEDARE_MM_TOKEN }}
          APPLE_DEVELOPER_PASSWORD: ${{ secrets.APPLE_DEVELOPER_PASSWORD }}
        run: |
          export PATH="$HOME/.rvm/rubies/ruby-3.4.2/bin:$PATH"
          export PATH="$HOME/.gem/ruby/3.4.0/bin:$PATH"
          zsh .github/scripts/run_adsedare.sh

      - name: Setup Flutter
        run: |
          fvm install
          fvm use

      - name: "Setup just"
        uses: extractions/setup-just@v2
        with:
          just-version: "1.25.2"

#      - name: Setup SSH
#        uses: webfactory/ssh-agent@v0.9.0
#        with:
#          ssh-private-key: |
#            ${{ secrets.BALADY_AUTHORIZATION_DEPLOY_KEY_PLAIN }}
#            ${{ secrets.BALADY_UIKIT_DEPLOY_KEY_PLAIN }}

      - name: "Prebuild"
        env:
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no
        run: |
          just apply-patches-ios
          just locale_gen
          just ios_setup
          just prebuild

      - name: Install PostHog CLI
        continue-on-error: true
        run: |
          # This job runs on a self-hosted Mac, where Node is not guaranteed —
          # so the vendor's standalone installer is used rather than npm. It
          # drops the binary in ~/.posthog, which is the first place the pod's
          # upload-symbols.sh looks, so no PATH wiring is needed.
          # Reused across runs when the runner keeps $HOME between jobs.
          if [ -x "$HOME/.posthog/posthog-cli" ]; then
            echo "posthog-cli already installed: $("$HOME/.posthog/posthog-cli" --version)"
            exit 0
          fi
          curl --proto '=https' --tlsv1.2 -LsSf https://download.posthog.com/cli | sh
          "$HOME/.posthog/posthog-cli" --version

      - name: Build app
        env:
          IPADROME_API_KEY: ${{ secrets.IPADROME_API_KEY }}
          # Symbol upload for crash reporting. Absent secrets simply skip the
          # upload — see .github/scripts/upload_ios_symbols.sh. Project ids
          # differ per flavor because each flavor writes to its own PostHog
          # project; stg and pre share one.
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_PROJECT_ID_PROD: ${{ vars.POSTHOG_PROJECT_ID_PROD }}
          POSTHOG_PROJECT_ID_STG: ${{ vars.POSTHOG_PROJECT_ID_STG }}
        run: |
          KC="$HOME/Library/Keychains/build.keychain"
          KC_PASS='build-pass'

          git apply mapness/scripts/sdkkey.patch || echo 'could not apply sdk key patch'
          git apply mapness/scripts/icon.patch || echo 'could not apply ios icon patch'

          # Build
          security unlock-keychain -p $KC_PASS $KC
          security find-identity -p codesigning

          AUTH_HEADER="Authorization: Bearer $IPADROME_API_KEY"
          APP_BUNDLE_ID="ae.urbi-service.balady"

          PROD_CHANNEL_NAME="prod-${CI_ARTIFACT_SUFFIX}"
          STG_CHANNEL_NAME="stg-${CI_ARTIFACT_SUFFIX}"
          PRE_CHANNEL_NAME="pre-${CI_ARTIFACT_SUFFIX}"

          PROD_RESPONSE=$(curl -s -X POST "https://baladyapp-builds.urbi.ae/api/channels/" \
            -H "$AUTH_HEADER" \
            -F "name=$PROD_CHANNEL_NAME" \
            -F "app_bundle_id=$APP_BUNDLE_ID")
          PROD_CHANNEL_ID=$(echo $PROD_RESPONSE | jq -r '.id')
          echo "Created production channel with ID: $PROD_CHANNEL_ID"

          STG_RESPONSE=$(curl -s -X POST "https://baladyapp-builds.urbi.ae/api/channels/" \
            -H "$AUTH_HEADER" \
            -F "name=$STG_CHANNEL_NAME" \
            -F "app_bundle_id=$APP_BUNDLE_ID")
          STG_CHANNEL_ID=$(echo $STG_RESPONSE | jq -r '.id')
          echo "Created staging channel with ID: $STG_CHANNEL_ID"

          PRE_RESPONSE=$(curl -s -X POST "https://baladyapp-builds.urbi.ae/api/channels/" \
            -H "$AUTH_HEADER" \
            -F "name=$PRE_CHANNEL_NAME" \
            -F "app_bundle_id=$APP_BUNDLE_ID")
          PRE_CHANNEL_ID=$(echo $PRE_RESPONSE | jq -r '.id')
          echo "Created pre-production channel with ID: $PRE_CHANNEL_ID"

          fvm flutter build ipa --release --export-options-plist ios/ad_hoc_options.plist --target lib/main_prod.dart --flavor prod  --dart-define=CI_BUILD_NAME="${CI_ARTIFACT_SUFFIX}" --dart-define=CI_RELEASE_VERSION="${CI_RELEASE_VERSION}"
          # Right after the build: the next one overwrites the xcarchive.
          .github/scripts/upload_ios_symbols.sh "${POSTHOG_PROJECT_ID_PROD}"
          RESPONSE=$(curl -s -X POST "https://baladyapp-builds.urbi.ae/api/channels/$PROD_CHANNEL_ID/builds" \
            -H "$AUTH_HEADER" \
            -F "version=${CI_ARTIFACT_SUFFIX}" \
            -F "expiration_type=on_push" \
            -F "expire_days=30" \
            -F "file=@build/ios/ipa/balady_plus.ipa")
          BUILD_UUID=$(echo $RESPONSE | jq -r '.id')
          BUILD_URL="https://baladyapp-builds.urbi.ae/install/${BUILD_UUID}"
          echo "BUILD_URL_PROD=${BUILD_URL}" >> ${GITHUB_ENV}

          fvm flutter build ipa --release --export-options-plist ios/ad_hoc_options.plist --target lib/main_stg.dart --flavor stg
          .github/scripts/upload_ios_symbols.sh "${POSTHOG_PROJECT_ID_STG}"
          RESPONSE=$(curl -s -X POST "https://baladyapp-builds.urbi.ae/api/channels/$STG_CHANNEL_ID/builds" \
            -H "$AUTH_HEADER" \
            -F "version=${CI_ARTIFACT_SUFFIX}-stg" \
            -F "expiration_type=on_push" \
            -F "expire_days=30" \
            -F "file=@build/ios/ipa/balady_plus.ipa")
          BUILD_UUID=$(echo $RESPONSE | jq -r '.id')
          BUILD_URL="https://baladyapp-builds.urbi.ae/install/${BUILD_UUID}"
          echo "BUILD_URL_STAGE=${BUILD_URL}" >> ${GITHUB_ENV}

          fvm flutter build ipa --release --export-options-plist ios/ad_hoc_options.plist --target lib/main_urbi_pre.dart --flavor pre
          # pre writes to the same PostHog project as stg (shared phc_ key).
          .github/scripts/upload_ios_symbols.sh "${POSTHOG_PROJECT_ID_STG}"
          RESPONSE=$(curl -s -X POST "https://baladyapp-builds.urbi.ae/api/channels/$PRE_CHANNEL_ID/builds" \
            -H "$AUTH_HEADER" \
            -F "version=${CI_ARTIFACT_SUFFIX}-pre" \
            -F "expiration_type=on_push" \
            -F "expire_days=30" \
            -F "file=@build/ios/ipa/balady_plus.ipa")
          BUILD_UUID=$(echo $RESPONSE | jq -r '.id')
          BUILD_URL="https://baladyapp-builds.urbi.ae/install/${BUILD_UUID}"
          echo "BUILD_URL_PRE=${BUILD_URL}" >> ${GITHUB_ENV}

      - name: 🔔 Send iOS builds to Microsoft Teams
        if: always()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

          JOB_STATUS: ${{ job.status }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

          CI_GIT_BRANCH: ${{ env.CI_GIT_BRANCH }}
          CI_IS_PR: ${{ env.CI_IS_PR }}

          # PR-related variables (only available when PR trigger is enabled)
          # PR_TITLE: ${{ github.event.pull_request.title || '' }}
          # PR_NUMBER: ${{ github.event.pull_request.number || '' }}

          BUILD_URL_PRE: ${{ env.BUILD_URL_PRE }}
          BUILD_URL_PROD: ${{ env.BUILD_URL_PROD }}
          BUILD_URL_STAGE: ${{ env.BUILD_URL_STAGE }}

        run: |
          # Color: blue = success, orange-red otherwise
          COLOR="0076D7"; [ "$JOB_STATUS" != "success" ] && COLOR="D83B01"

          # PR line for notification (commented out - uncomment PR trigger above to use this)
          # PR_LINE=""
          # if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          #   PR_TITLE="${{ github.event.pull_request.title || '' }}"
          #   PR_NUMBER="${{ github.event.pull_request.number || '' }}"
          #   if [ -n "$PR_NUMBER" ]; then
          #     PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
          #     PR_LINE="**Pull Request**: [${PR_TITLE}](${PR_URL})\n\n"
          #   fi
          # fi

          PAYLOAD="$(cat <<'EOF'
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "themeColor": "__COLOR__",
            "summary": "iOS builds",
            "title": "🍏 iOS builds — __STATUS__",
            "sections": [
              {
                "text": "__PR_LINE__**Branch**: [__BRANCH__](__REPO_URL__/tree/__BRANCH__)\n\n**Author**: __ACTOR__\n\n**Run**: [Open run](__RUN_URL__)\n\n**iOS pre**: [Build](__BUILD_URL_PRE__)\n\n**iOS prod**: [Build](__BUILD_URL_PROD__)\n\n**iOS stage**: [Build](__BUILD_URL_STAGE__)"
              }
            ]
          }
          EOF
          )"

          PAYLOAD="${PAYLOAD/__COLOR__/$COLOR}"
          PAYLOAD="${PAYLOAD/__STATUS__/$JOB_STATUS}"
          # PR_LINE is empty for manual dispatch, uncomment above to populate for PR events
          PAYLOAD="${PAYLOAD/__PR_LINE__/${PR_LINE:-}}"
          PAYLOAD="${PAYLOAD/__BRANCH__/$CI_GIT_BRANCH}"
          PAYLOAD="${PAYLOAD/__REPO_URL__/$GITHUB_SERVER_URL/$GITHUB_REPOSITORY}"
          PAYLOAD="${PAYLOAD/__ACTOR__/$GITHUB_ACTOR}"
          PAYLOAD="${PAYLOAD/__RUN_URL__/$RUN_URL}"
          PAYLOAD="${PAYLOAD/__BUILD_URL_PRE__/$BUILD_URL_PRE}"
          PAYLOAD="${PAYLOAD/__BUILD_URL_PROD__/$BUILD_URL_PROD}"
          PAYLOAD="${PAYLOAD/__BUILD_URL_STAGE__/$BUILD_URL_STAGE}"

          curl -sS -H 'Content-Type: application/json' -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL"

      - name: Cleanup keychain
        if: ${{ always() }}
        run: |
          LKC="${HOME}/Library/Keychains/login.keychain"
          KC="${HOME}/Library/Keychains/build.keychain"
          security list-keychains -s $LKC
          security default-keychain -s $LKC
          security delete-keychain $KC

          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/
