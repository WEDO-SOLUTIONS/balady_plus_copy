      #     MM_CHANNEL_ID: ${{ secrets.MM_CHANNEL_ID }}
      #     MM_BOT_TOKEN: ${{ secrets.MM_BOT_TOKEN }}
      #     MM_DOMAIN: ${{ secrets.MM_DOMAIN }}
      #   run: |
      #     is_pr=""
      #     if [ -n "${CI_IS_PR}" ]; then
      #       is_pr="Pull Request build;"
      #     fi
      #     curl -X POST -H 'Content-type: application/json' -H "Authorization: Bearer ${MM_BOT_TOKEN}" https://${MM_DOMAIN}/api/v4/posts -d "{ \
      #       \"channel_id\": \"${MM_CHANNEL_ID}\", \
      #       \"message\": \"[Build](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}): Number ${GITHUB_RUN_ID}; Branch ${CI_GIT_BRANCH}; ${is_pr}\" \
      #     }"
