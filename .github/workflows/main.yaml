  # - name: ⚠️ℹ️ Run Dart analysis for app package
  #   uses: zgosalvez/github-actions-analyze-dart@v2.0.9
  # - name: ⚠️ℹ️ Run Dart analysis for dgis_map package
  #   uses: zgosalvez/github-actions-analyze-dart@v2.0.9
  #   with:
  #     working-directory: "${{github.workspace}}/urbi_map/dgis_map"
  # - name: ⚠️ℹ️ Run Dart analysis for dgis_map_platform_interface package
  #   uses: zgosalvez/github-actions-analyze-dart@v2.0.9
  #   with:
