# yamllint disable rule:line-length
---
name: 🔨🧪 Build & Test

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "urbi"
      - "urbi-release-*"
  pull_request:
    types: [closed]  
    branches:
      - "urbi"
      - "urbi-release-*"
      - "urbi-service/**"
    paths-ignore:
      - "**.md"
      - "doc/**"
      - ".git/"
      - ".vscode/"

jobs:
  build:
    name: Build Android
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    # runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: 🧹 Free disk space (aggressive)
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /usr/local/lib/android/sdk/cmdline-tools || true
          docker image prune -f || true
          echo "After cleanup:"
          df -h

      # GITHUB_REF_SLUG
      - name: Inject git variables
        run: |
          echo "CI_GIT_COMMIT=$(git --no-pager show -s --format='%s')" >> ${GITHUB_ENV}
          export CI_DATE=$(date '+%Y-%m-%d-%H-%M-%S')

          # Default (non-PR push)
          export CI_GIT_BRANCH=${GITHUB_REF_NAME}
          export CI_IS_PR=""

          # If workflow triggered by PR
          if [[ ${GITHUB_EVENT_NAME} == "pull_request" ]]; then
            if [[ ${GITHUB_EVENT_PULL_REQUEST_MERGED} == "true" ]]; then
              # PR merged → use target branch (base)
              export CI_GIT_BRANCH=${GITHUB_BASE_REF}
              export CI_IS_PR=""
            else
              # PR not merged yet (draft or opened)
              export CI_GIT_BRANCH=${GITHUB_HEAD_REF}
              export CI_IS_PR="pr-"
            fi
          fi

          source .release_version
          export CI_RELEASE_VERSION="${major}.${minor}.${patch}-rc${candidate}"

          echo "CI_RELEASE_VERSION=${CI_RELEASE_VERSION}" >> ${GITHUB_ENV}
          echo "CI_GIT_BRANCH=${CI_GIT_BRANCH}" >> ${GITHUB_ENV}

          CI_GIT_BRANCH_SLUG=$(echo -n ${CI_GIT_BRANCH} | tr --complement --squeeze-repeats '[:alnum:]' '-')
          echo "CI_ARTIFACT_SUFFIX=${CI_IS_PR}${CI_GIT_BRANCH_SLUG}-${CI_DATE}" >> ${GITHUB_ENV}
          echo "CI_IS_PR=${CI_IS_PR}" >> ${GITHUB_ENV}

      # - name: Setup requirements
      #   env: # Set the secret as an environment variable
      #     BALADY_UIKIT_DEPLOY_KEY: ${{ secrets.BALADY_UIKIT_DEPLOY_KEY }}
      #     BALADY_AUTHORIZATION_DEPLOY_KEY: ${{ secrets.BALADY_AUTHORIZATION_DEPLOY_KEY }}
      #   run: |
      #     echo "${BALADY_UIKIT_DEPLOY_KEY}" | base64 --decode > ${GITHUB_WORKSPACE}/.balady-uikit.key
      #     chmod 600 ${GITHUB_WORKSPACE}/.balady-uikit.key
      #     echo "${BALADY_AUTHORIZATION_DEPLOY_KEY}" | base64 --decode > ${GITHUB_WORKSPACE}/.balady-authorization.key
      #     chmod 600 ${GITHUB_WORKSPACE}/.balady-authorization.key

      - name: ⚙️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: "stable"
          cache: true

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17.x"
          cache: "gradle"
        id: java

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🤖🔨 Download strings from Localazy
        uses: localazy/download@v1
        with:
          read_key: ${{ secrets.LOCALAZY_READ_KEY }}
          write_key: ${{ secrets.LOCALAZY_WRITE_KEY }}

      - name: 🤖🔨 Generate dart locale bindings
        run: |
          cd mapness
          # FIXME: Workaround, see https://github.com/localazy/download/issues/3
          sudo chown $(whoami):$(whoami) -R lib/l10n
          mkdir -p lib/l10n/generated
          flutter gen-l10n

      - name: 🤖🔨 Development setup dgis_map_platform_interface
        run: |
          cd urbi_map/dgis_map_platform_interface
          mkdir lib/src/pigeons/
          mkdir ../dgis_map/android/src/main/kotlin/com/dgis/map/map_api
          flutter pub get
          flutter pub run pigeon --input pigeons/messages.dart

      - name: 🤖🔨 Development setup dgis_map
        env: # Set the secret as an environment variable
          BALADY_DEVELOPERS_PASS: ${{ secrets.BALADY_DEVELOPERS_PASS }}
        run: |
          cd urbi_map/dgis_map
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      # - name: Setup SSH
      #   uses: webfactory/ssh-agent@v0.9.0
      #   with:
      #     ssh-private-key: |
      #           ${{ secrets.BALADY_AUTHORIZATION_DEPLOY_KEY_PLAIN }}
      #           ${{ secrets.BALADY_UIKIT_DEPLOY_KEY_PLAIN }}

      - name: 🤖🔨 Development setup mapness
        env:
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no
        run: |
          cd mapness
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🤖🔨 Build Android app
        run: |
          # flutter build apk --flavor pre --target lib/main_urbi_pre.dart --dart-define=CI_RELEASE_VERSION="${CI_RELEASE_VERSION}" --dart-define=CI_BUILD_NAME="urbi-pre-${CI_ARTIFACT_SUFFIX}" --dart-define=GIT_BRANCH="${CI_GIT_BRANCH}" --dart-define=GIT_COMMIT="${CI_GIT_COMMIT}" --dart-define=VENDOR_CONFIG=urbi-pre-prod
          # mv build/app/outputs/flutter-apk/app-pre-release.apk build/app/outputs/flutter-apk/urbi-pre-${CI_ARTIFACT_SUFFIX}.apk
          # flutter build apk --flavor prod --target lib/main_prod.dart --dart-define=CI_RELEASE_VERSION="${CI_RELEASE_VERSION}" --dart-define=CI_BUILD_NAME="momrah-prod-${CI_ARTIFACT_SUFFIX}" --dart-define=GIT_BRANCH="${CI_GIT_BRANCH}" --dart-define=GIT_COMMIT="${CI_GIT_COMMIT}" --dart-define=VENDOR_CONFIG=momrah-prod
          # mv build/app/outputs/flutter-apk/app-prod-release.apk build/app/outputs/flutter-apk/momrah-prod-${CI_ARTIFACT_SUFFIX}.apk
          flutter build apk --target-platform android-arm64 --flavor stg --target lib/main_stg.dart --dart-define=CI_RELEASE_VERSION="${CI_RELEASE_VERSION}" --dart-define=CI_BUILD_NAME="momrah-stage-${CI_ARTIFACT_SUFFIX}" --dart-define=GIT_BRANCH="${CI_GIT_BRANCH}" --dart-define=GIT_COMMIT="${CI_GIT_COMMIT}" --dart-define=VENDOR_CONFIG=momrah-stage
          mv build/app/outputs/flutter-apk/app-stg-release.apk build/app/outputs/flutter-apk/momrah-stage-${CI_ARTIFACT_SUFFIX}.apk

      # - name: 🤖🔨 Upload Urbi Pre Prod apk
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: urbi-pre-${{ env.CI_ARTIFACT_SUFFIX }}.apk
      #     compression-level: 0
      #     path: build/app/outputs/flutter-apk/urbi-pre-${{ env.CI_ARTIFACT_SUFFIX }}.apk

      # - name: 🤖🔨 Upload Momrah Prod apk
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: momrah-prod-${{ env.CI_ARTIFACT_SUFFIX }}.apk
      #     compression-level: 0
      #     path: build/app/outputs/flutter-apk/momrah-prod-${{ env.CI_ARTIFACT_SUFFIX }}.apk

      - name: 🤖🔨 Upload Momrah Stage apk
        uses: actions/upload-artifact@v4
        with:
          name: momrah-stage-${{ env.CI_ARTIFACT_SUFFIX }}.apk
          compression-level: 0
          path: build/app/outputs/flutter-apk/momrah-stage-${{ env.CI_ARTIFACT_SUFFIX }}.apk

      - name: 🔔 Send link to Microsoft Teams
        if: ${{ success() }}
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ env.CI_GIT_BRANCH }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          COLOR="0076D7"; [ "$JOB_STATUS" != "success" ] && COLOR="D83B01"

          # PR line (only for pull_request)
          PR_LINE=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            PR_LINE="**Pull Request**: [${PR_TITLE}](${REPO_URL}/pull/${{ github.event.pull_request.number }})\n"
          fi

          # ---- Extract task id (UBS-23) from branch, then from PR title ----
          TASK_ID=""
          # Try from branch (supports slashes)
          TASK_ID=$(echo "$BRANCH"   | grep -oE '[A-Z]+-[0-9]+' | head -n1 || true)
          # Fallback to PR title
          if [ -z "$TASK_ID" ] && [ -n "$PR_TITLE" ]; then
            TASK_ID=$(echo "$PR_TITLE" | grep -oE '[A-Z]+-[0-9]+' | head -n1 || true)
          fi

          TASK_LINE=""
          if [ -n "$TASK_ID" ]; then
            TASK_URL="https://urbi-flutter-team.youtrack.cloud/issue/${TASK_ID}"
            TASK_LINE="**Task**: [${TASK_ID}](${TASK_URL})\n"
          fi
          # -----------------------------------------------------------------

          PAYLOAD="$(cat <<'EOF'
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "themeColor": "__COLOR__",
            "summary": "Android build",
            "title": "📦 Android build — __STATUS__",
            "sections": [
              {
                "text": "__PR_LINE____TASK_LINE__**Branch**: [__BRANCH__](__REPO_URL__/tree/__BRANCH__)\n**Author**: __ACTOR__\n**Artifact**: __ARTIFACT_NAME__ (see **Run → Artifacts**)\n**Run**: [Open run](__RUN_URL__)"
              }
            ]
          }
          EOF
          )"

          ARTIFACT_NAME="momrah-stage-${CI_ARTIFACT_SUFFIX}.apk"

          PAYLOAD="${PAYLOAD/__COLOR__/$COLOR}"
          PAYLOAD="${PAYLOAD/__STATUS__/$JOB_STATUS}"
          PAYLOAD="${PAYLOAD/__PR_LINE__/$PR_LINE}"
          PAYLOAD="${PAYLOAD/__TASK_LINE__/$TASK_LINE}"
          PAYLOAD="${PAYLOAD/__BRANCH__/$BRANCH}"
          PAYLOAD="${PAYLOAD/__REPO_URL__/$REPO_URL}"
          PAYLOAD="${PAYLOAD/__ACTOR__/$ACTOR}"
          PAYLOAD="${PAYLOAD/__RUN_URL__/$RUN_URL}"
          PAYLOAD="${PAYLOAD/__ARTIFACT_NAME__/$ARTIFACT_NAME}"

          curl -sS -H 'Content-Type: application/json' -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL"

      - name: 🧹 Cleanup workspace
        if: ${{ success() }}
        run: |
          rm -rf build/* || true
          rm -rf ~/.gradle/caches/build-cache-* || true
          df -h
