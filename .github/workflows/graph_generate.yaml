name: Lakos graph generate

on:
  push:
    branches:
      - "release/*"

permissions:
  contents: write

jobs:
  graph-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          channel: stable

      - name: Run lakos job
        run: |
          sudo apt install graphviz
          dart pub global activate lakos
          lakos -o graph/lakos.dot mapness/ --cycles-allowed
          dot -Tsvg graph/lakos.dot -o graph/lakos.svg
      - name: Push on GitHub
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add graph/
          git commit -m "chore: update lakos graph for ${{ github.ref_name }}"
          git push
