name: balady_uikit
description: Optimize layout with predefined components.

version: 4.2.1

publish_to: https://baladyapp-unpub.urbi.ae
repository: https://github.com/urbi-ae/balady_uikit
homepage: https://github.com/urbi-ae/balady_uikit

environment:
  sdk: ">=3.0.1 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI Components
  expansion_widget: ^0.1.0
  flutter_svg: ^2.0.7
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.2.0

  # Other
  build: any
  json_annotation: ^4.8.1
  path_provider: ^2.1.3
  collection: ^1.17.1
  smooth_corner: ^1.0.0
  auto_size_text: ^3.0.0
  flutter_gen: ^5.4.0
  inspector: ^2.1.0
  cached_network_image: ^3.4.1
  urbi_utils:
    hosted: https://baladyapp-unpub.urbi.ae/
    version: ^1.0.4
  vector_graphics: ^1.1.11+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: any
  source_gen: ^1.0.4

  # Generated Assets
  flutter_gen_runner:
  cached_build_runner: ^0.0.7

flutter_gen:
  output: lib/gen/assets
  line_length: 120
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/icons/svg/map_controls/
    - assets/icons/maneuver/

  fonts:
    - family: BaladyIcons.ttf
      fonts:
        - asset: assets/fonts/BaladyIcons.ttf
    - family: weather_icons
      fonts:
        - asset: assets/fonts/mapness_icons/weather_icons.ttf
    - family: transport_icons
      fonts:
        - asset: assets/fonts/mapness_icons/transport_icons.ttf
    - family: system_icons
      fonts:
        - asset: assets/fonts/mapness_icons/system_icons.ttf
    - family: social_icons
      fonts:
        - asset: assets/fonts/mapness_icons/social_icons.ttf
    - family: places_16_icons
      fonts:
        - asset: assets/fonts/mapness_icons/places_16_icons.ttf
    - family: places_icons
      fonts:
        - asset: assets/fonts/mapness_icons/places_icons.ttf
    - family: general_icons
      fonts:
        - asset: assets/fonts/mapness_icons/general_icons.ttf
    - family: general_16_icons
      fonts:
        - asset: assets/fonts/mapness_icons/general_16_icons.ttf
    - family: general_32_icons
      fonts:
        - asset: assets/fonts/mapness_icons/general_32_icons.ttf
    - family: general_48_icons
      fonts:
        - asset: assets/fonts/mapness_icons/general_48_icons.ttf
    - family: events_on_the_route_icons
      fonts:
        - asset: assets/fonts/mapness_icons/events_on_the_route_icons.ttf

    - family: Frutiger
      fonts:
        - asset: assets/fonts/FrutigerLTArabic55Roman.ttf
          weight: 400
        - asset: assets/fonts/FrutigerLTArabic65Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600

    - family: Golos
      fonts:
        - asset: assets/fonts/golos/GolosText-Regular.ttf
          weight: 400
        - asset: assets/fonts/golos/GolosText-Medium.ttf
          weight: 500
        - asset: assets/fonts/golos/GolosText-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/golos/GolosText-Bold.ttf
          weight: 700
        - asset: assets/fonts/golos/GolosText-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/golos/GolosText-Black.ttf
          weight: 900
