skip_output:
  - meta # Skips lefthook version printing
  # - summary        # Skips summary block (successful and failed steps) printing
  - empty_summary # Skips summary heading when there are no steps to run
  - success # Skips successful steps printing
  # - failure        # Skips failed steps printing
  - execution # Skips printing any execution logs (but prints if the execution failed)
  - execution_out # Skips printing execution output (but still prints failed commands output)
  - execution_info # Skips printing `EXECUTE > ...` logging
  - skips # Skips "skip" printing (i.e. no files matched)

pre-commit:
  skip: rebase
  scripts:
    "baladi-linter.sh":
      runner: bash
      fail_text: "linter check fail"
  commands:
    dart-formatter:
      glob: mapness/**/*.dart
      run: dart format --fix {staged_files} && git add {staged_files}

commit-msg:
  skip: rebase
  scripts:
    "commit-msg-validator.sh":
      fail_text: "Commit message validation failed"
      runner: bash

pre-push:
  scripts:
    "branch-name-validator.sh":
      runner: bash
      fail_text: "Branch name validation failed"
