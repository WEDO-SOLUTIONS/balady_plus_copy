targets:
  $default:
    builders:
      balady_uikit|color_generator:
        enabled: true

builders:
  balady_uikit|color_generator:
    import: "lib/gen/color_generator.dart"
    builder_factories: ["colorConstantsBuilder"]
    build_extensions:
      .json: [".color_constants.dart"]
    auto_apply: dependents
    build_to: source