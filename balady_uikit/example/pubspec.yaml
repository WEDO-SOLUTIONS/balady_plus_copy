name: example
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.7
  flutter_animate: ^4.5.0
  widgetbook_annotation: ^3.1.0
  widgetbook: ^3.8.1
  urbi_utils:
    hosted: https://baladyapp-unpub.urbi.ae/
    version: ^1.0.4
  balady_uikit:
    path: ../
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
#  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.1.4
  widgetbook_generator: ^3.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - ../assets/icons/
    - ../assets/icons/svg/
    - ../assets/icons/svg/map_controls/
    - ../assets/icons/maneuver/