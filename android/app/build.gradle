plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "org.jetbrains.kotlin.plugin.compose"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdk = 36
    namespace "momra.balady.android"
    ndkVersion = "28.2.13676358"

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.2"
    }


    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "momra.balady.android"
        minSdkVersion 26
        multiDexEnabled true
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }

        debug {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            shrinkResources false
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    flavorDimensions "default"
    productFlavors {
        stg {
            dimension "default"
            resValue "string", "app_name", "Balady+بلدي"
            manifestPlaceholders = [
                    partner: "baladyappuat",
                    'appAuthRedirectScheme': 'com.balady',
            ]
//            versionNameSuffix ".stg"
//            applicationIdSuffix ".stg"
//            applicationId  "com.balady.balady_app"
        }
        prod {
            dimension "default"
            resValue "string", "app_name", "Balady+بلدي"
            manifestPlaceholders = [
                    partner: "baladyapp",
                    'appAuthRedirectScheme': 'com.balady',
            ]
        }
        pre {
            dimension "default"
            resValue "string", "app_name", "Balady+بلدي"
            manifestPlaceholders = [
                    partner: "baladyappuat",
                    'appAuthRedirectScheme': 'com.balady',
            ]
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    lint {
        checkReleaseBuilds false
    }

}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
    implementation 'com.android.installreferrer:installreferrer:2.2'
    implementation 'com.adjust.sdk:adjust-android-meta-referrer:5.0.1'
    implementation 'androidx.glance:glance-appwidget:1.0.0'
    implementation 'com.huawei.agconnect:agconnect-core:1.9.1.301'
    // AndroidX Media support for MediaSessionCompat, PlaybackStateCompat, MediaMetadataCompat
    implementation 'androidx.media:media:1.7.0'
    implementation 'com.adjust.sdk:adjust-android:5.4.0'
    implementation 'com.adjust.sdk:adjust-android-oaid:5.4.0'
    implementation 'com.huawei.hms:ads-identifier:3.4.62.300'
}

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.huawei.agconnect'

// أضٝ هذا الجزء هنا ٝي النهاية تماماً
configurations.all {
    resolutionStrategy {
        // هذا السطر يمنع التضارب بين مكتبات هواوي المختلٝة
        force 'com.huawei.hms:common:6.10.0.300'
    }
}