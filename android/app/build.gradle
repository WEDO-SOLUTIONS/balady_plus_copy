plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "org.jetbrains.kotlin.plugin.compose"
}

// R8 renames Java/Kotlin symbols in release builds (`minifyEnabled true` below),
// so native crash frames reach PostHog as `a.b()`. The plugin uploads the R8
// mapping file after each release build, which is what turns them back into real
// names. It shells out to `posthog-cli`, so it is applied only when upload
// credentials are present: a developer building release locally has neither the
// CLI nor the key, and their build must not fail over reporting. See
// docs/analytics/SYMBOL_UPLOAD.md for the CI wiring.
if (System.getenv("POSTHOG_CLI_API_KEY")) {
    apply plugin: "com.posthog.android"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdk = 36
    namespace "momra.balady.android"
    ndkVersion = "28.2.13676358"

    // Store native libraries uncompressed and page-aligned inside the APK/AAB.
    // Required for 16 KB page-size support: compressed .so entries cannot be
    // 16 KB zip-aligned, which makes Play flag the app as not supporting 16 KB
    // devices even when every .so's ELF segments are already aligned.
    packaging {
        jniLibs {
            useLegacyPackaging = false

            // The BytePlus/ByteDance `encryptor` AAR (transitive of
            // RangersAppLog-Lite-cn) ships a libEncryptorP.so whose armeabi-v7a
            // and x86_64 variants are only 4 KB ELF-aligned. arm64-v8a is 64 KB
            // and fully compliant. 16 KB page-size devices are all 64-bit ARM,
            // so these 32-bit/x86_64 copies can never run on one — but Play's
            // static 16 KB check still flags them. Drop just those two variants;
            // every other ABI/library is kept intact.
            excludes += [
                'lib/armeabi-v7a/libEncryptorP.so',
                'lib/x86_64/libEncryptorP.so',
            ]
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.2"
    }


    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "momra.balady.android"
        minSdkVersion 26
        multiDexEnabled true
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }

        debug {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            shrinkResources false
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    flavorDimensions "default"
    productFlavors {
        stg {
            dimension "default"
            resValue "string", "app_name", "Balady+بلدي"
            versionCode =  (flutterVersionCode.toInteger()) + 105637
            manifestPlaceholders = [
                    partner: "baladyappuat",
                    'appAuthRedirectScheme': 'com.balady',
            ]
        }
        prod {
            dimension "default"
            resValue "string", "app_name", "Balady+بلدي"
            manifestPlaceholders = [
                    partner: "baladyapp",
                    'appAuthRedirectScheme': 'com.balady',
            ]
        }
        pre {
            dimension "default"
            resValue "string", "app_name", "Balady+بلدي"
            versionCode =  (flutterVersionCode.toInteger()) + 105637
            manifestPlaceholders = [
                    partner: "baladyappuat",
                    'appAuthRedirectScheme': 'com.balady',
            ]
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    lint {
        checkReleaseBuilds false
    }

}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
    implementation 'com.android.installreferrer:installreferrer:2.2'
    implementation 'com.adjust.sdk:adjust-android-meta-referrer:5.0.1'
    implementation 'androidx.glance:glance-appwidget:1.0.0'
    implementation 'com.huawei.agconnect:agconnect-core:1.9.1.301'
    // AndroidX Media support for MediaSessionCompat, PlaybackStateCompat, MediaMetadataCompat
    implementation 'androidx.media:media:1.7.0'
    implementation 'com.adjust.sdk:adjust-android:5.4.0'
    implementation 'com.adjust.sdk:adjust-android-oaid:5.4.0'
    implementation 'com.huawei.hms:ads-identifier:3.4.62.300'
    // BytePlus RangersAppLog (DataFinder) native Android SDK. The Flutter plugin
    // declares this only as `compileOnly`, so the app must provide the runtime
    // dependency — otherwise classes like com.bytedance.applog.InitConfig /
    // IDataObserver are missing at runtime (NoClassDefFoundError → crash).
    implementation 'com.bytedance.applog:RangersAppLog-Lite-cn:6.14.2'
}

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.huawei.agconnect'

// أضٝ هذا الجزء هنا ٝي النهاية تماماً
configurations.all {
    resolutionStrategy {
        // هذا السطر يمنع التضارب بين مكتبات هواوي المختلٝة
        force 'com.huawei.hms:common:6.10.0.300'
        // home_widget uses "1.+" which resolves to 1.3.0-alpha01 requiring compileSdk 37 + AGP 9.1.0.
        // Pin to latest stable 1.x to stay on compileSdk 36 / AGP 8.x.
        force 'androidx.glance:glance-appwidget:1.1.0'
        force 'androidx.glance:glance:1.1.0'
    }
}