buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
        maven { url 'https://developer.huawei.com/repo/' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://developer.huawei.com/repo/' }
        maven {url "https://mobilesdk.useinsider.com/android"}
        // BytePlus RangersAppLog (DataFinder) native Android SDK.
        maven { url 'https://artifact.bytedance.com/repository/Volcengine/' }
    }

    subprojects {
        // home_widget declares glance "1.+", which resolves to 1.3.0-alpha02 requiring
        // compileSdk 37 + AGP 9.x. The same force in app/build.gradle only covers :app's
        // classpath — subprojects resolve their own, so pin here too.
        configurations.all {
            resolutionStrategy {
                force 'androidx.glance:glance-appwidget:1.1.0'
                force 'androidx.glance:glance:1.1.0'
            }
        }
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                    // Set minimum compileSdkVersion/compileSdk to 34+ (androidx.fragment 1.7 /
                    // androidx.window 1.2 refuse to compile against anything older).
                    // otp_autofill 4.1.0 / smart_auth 1.1.1 / urbi_analytics 0.0.4 are pinned
                    // to exactly 34: androidx.fragment 1.7 in their classpath demands >=34,
                    // while the SDK 35+ stubs add @Nullable annotations (PackageInfo.signatures,
                    // SigningInfo) that their Kotlin sources predate and fail to compile against.
                    def legacyKotlinPlugins = ['otp_autofill', 'smart_auth', 'urbi_analytics']
                    def pinnedSdk = legacyKotlinPlugins.contains(project.name) ? 34 : null
                    def minSdk = 34
                    def targetSdk = 36

                    // Set compileSdk (new syntax)
                    try {
                        if (pinnedSdk != null) {
                            compileSdk = pinnedSdk
                        } else if (compileSdk == null || (compileSdk instanceof Number && compileSdk < minSdk)) {
                            compileSdk = targetSdk
                        }
                    } catch (Exception e) {
                        // compileSdk property doesn't exist, try compileSdkVersion
                    }

                    // Set compileSdkVersion (old syntax) as fallback
                    try {
                        if (pinnedSdk != null) {
                            compileSdkVersion = pinnedSdk
                        } else if (compileSdkVersion == null || (compileSdkVersion instanceof Number && compileSdkVersion < minSdk)) {
                            compileSdkVersion = targetSdk
                        }
                    } catch (Exception e) {
                        // compileSdkVersion property doesn't exist
                    }
                    // Force Java 17 for all subprojects to fix Java 8 deprecation warnings
                    compileOptions {
                        sourceCompatibility JavaVersion.VERSION_17
                        targetCompatibility JavaVersion.VERSION_17
                    }
                }
                // Set Kotlin JVM target for Android projects with Kotlin
                project.tasks.matching { it instanceof org.jetbrains.kotlin.gradle.tasks.KotlinCompile }.configureEach {
                    kotlinOptions {
                        jvmTarget = "17"
                    }
                }
            }
            // Also set Java toolchain for non-Android projects
            if (project.hasProperty('java')) {
                project.java {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
