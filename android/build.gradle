buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
        maven { url 'https://developer.huawei.com/repo/' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Unity export ships prebuilt .aar files in unityLibrary/libs
        flatDir {
            dirs "${project(':unityLibrary').projectDir}/libs"
        }
        maven { url 'https://developer.huawei.com/repo/' }
        maven {url "https://mobilesdk.useinsider.com/android"}
        // BytePlus RangersAppLog (DataFinder) native Android SDK.
        maven { url 'https://artifact.bytedance.com/repository/Volcengine/' }
    }

    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                    // Set minimum compileSdkVersion/compileSdk to 30+ (required for Java 9+)
                    // Ensure all plugins have at least SDK 30 for Java 17 compatibility
                    def minSdk = 30
                    def targetSdk = 36

                    // Set compileSdk (new syntax)
                    try {
                        if (compileSdk == null || (compileSdk instanceof Number && compileSdk < minSdk)) {
                            compileSdk = targetSdk
                        }
                    } catch (Exception e) {
                        // compileSdk property doesn't exist, try compileSdkVersion
                    }

                    // Set compileSdkVersion (old syntax) as fallback
                    try {
                        if (compileSdkVersion == null || (compileSdkVersion instanceof Number && compileSdkVersion < minSdk)) {
                            compileSdkVersion = targetSdk
                        }
                    } catch (Exception e) {
                        // compileSdkVersion property doesn't exist
                    }
                    // Force Java 17 for all subprojects to fix Java 8 deprecation warnings
                    compileOptions {
                        sourceCompatibility JavaVersion.VERSION_17
                        targetCompatibility JavaVersion.VERSION_17
                    }
                }
                // Set Kotlin JVM target for Android projects with Kotlin
                project.tasks.matching { it instanceof org.jetbrains.kotlin.gradle.tasks.KotlinCompile }.configureEach {
                    kotlinOptions {
                        jvmTarget = "17"
                    }
                }
            }
            // Also set Java toolchain for non-Android projects
            if (project.hasProperty('java')) {
                project.java {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
