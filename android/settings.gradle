pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version '8.13.2' apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
    id "org.jetbrains.kotlin.plugin.compose" version "2.1.0" apply false
    id "com.google.gms.google-services" version "4.3.15" apply false
    // Uploads R8 mapping files to PostHog so release crash stacks are readable
    // instead of `a.b()`. Applied conditionally in app/build.gradle — only when
    // upload credentials are present, so local builds never depend on it.
    id "com.posthog.android" version "1.4.0" apply false
}

include ":app"
// Unity penalty game (flutter_embed_unity) — exported from tifo-penalty-unity
include ":unityLibrary"
