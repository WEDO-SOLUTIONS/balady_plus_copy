name: dgis_map
description: Android implementation of the dgis_map plugin
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.dgis.map
        pluginClass: DgisMapPlugin
      ios:
        pluginClass: DgisMapPlugin

  assets:
    - assets/svg/

dependencies:
  flutter:
    sdk: flutter
  dgis_map_platform_interface:
    path: ../dgis_map_platform_interface
  dio: ^5.9.0
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  plugin_platform_interface: 2.1.8
  build_runner: ^2.10.4
  flutter_lints: ^6.0.0
  dart_style: ^3.1.3
