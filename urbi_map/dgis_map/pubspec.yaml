name: dgis_map
description: Android implementation of the dgis_map plugin
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=2.18.6 <3.0.0"
  flutter: ">=3.3.10"

flutter:
  plugin:
    platforms:
      android:
        package: com.dgis.map
        pluginClass: DgisMapPlugin
      ios:
        pluginClass: DgisMapPlugin

  assets:
    - assets/svg/
    - assets/json/panoramas_test.json

dependencies:
  flutter:
    sdk: flutter
  dgis_map_platform_interface:
    path: ../dgis_map_platform_interface
  json_annotation: 4.8.0
  dio: 4.0.6
  flutter_svg: 2.0.5
  fl_chart: 0.62.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  plugin_platform_interface: 2.1.4
  build_runner: 2.3.3
  flutter_lints: 2.0.1
  json_serializable: 6.6.0
