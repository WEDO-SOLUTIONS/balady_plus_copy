group 'com.example.my_plugin'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
        maven { url 'https://developer.huawei.com/repo/' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://artifactory.2gis.dev/sdk-maven-release" }
        maven { url 'https://developer.huawei.com/repo/' }
        // flatDir {
        //     dirs project(':dgis_map').file('_delete_me_')
        // }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.dgis.map"
    compileSdkVersion 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 26
    }

    buildFeatures {
        viewBinding true
    }

}

dependencies {
    implementation"com.google.android.gms:play-services-location:21.0.1"
    implementation 'androidx.car.app:app:1.4.0'
    // Dgis sdk
    implementation "ru.dgis.sdk:sdk-full:12.7.1"
    // implementation (name: 'sdk-full-latest', ext: 'aar')
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'com.huawei.hms:location:6.12.0.300'
    implementation 'com.huawei.agconnect:agconnect-core:1.6.5.300'
    implementation 'com.huawei.hmf:tasks:1.5.2.301'
    implementation 'com.huawei.hms:base:6.5.0.300'
}
