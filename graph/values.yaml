# Default values for chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ToBeReplaced #registry.momrah.gov.sa/baladybusiness-dev/container
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ToBeReplaced #"latest"

imagePullSecrets: 
  - name: registry
nameOverride: ""
fullnameOverride: "ToBeReplaced" #""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$3
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
    nginx.ingress.kubernetes.io/use-regex: 'true'
    nginx.ingress.kubernetes.io/x-forwarded-prefix: /$1
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
  hosts:
    - host: ToBeReplaced #https://baladybusiness-dev.momra.gov.sa
      paths:
        - backend:
            service:
              name: ToBeReplaced #container
              port:
                number: 80
          path: ToBeReplaced #/(container)(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    - hosts:
      - ToBeReplaced #https://baladybusiness-dev.momra.gov.sa

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe: {}
readinessProbe: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: config-volume
#   mountPath: /usr/share/nginx/html/assets/json/settings.json
#   subPath: settings.json
# - name: config-volume
#   mountPath: /usr/share/nginx/html/assets/json/mf.manifest.json
#   subPath: mf.manifest.json

# Additional volumes on the output Deployment definition.
volumes: []
# - name: config-volume
#   configMap:
#     name: angular.app.container.config-volume
#     items:
#       - key: settings.json
#         path: settings.json
#       - key: mf.manifest.json
#         path: mf.manifest.json

nodeSelector: {}
tolerations: []
affinity: {}

cm: {}
  #KeyName01: Value01
  #KeyName02: Value02

cmVolume: []