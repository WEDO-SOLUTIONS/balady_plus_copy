const BOT_NAMES = {
  ar:["فهد","سعود","ناصر","عبدالله","تركي","ماجد","بدر","خالد"],
  en:["Fahad","Saud","Nasser","Abdullah","Turki","Majed","Badr","Khaled"]
};
function botName(i){ const l = BOT_NAMES[LANG] || BOT_NAMES.en; return l[i % l.length]; }

const Lobby = {
  room: null,
  selected: [],
  seats: null,

  init(){
    const url = new URL(location.href);
    this.room = (url.searchParams.get("room") || "").toUpperCase() || this.newRoom();
    this.seats = [
      {type:"human", human:true, name:T("you"), id:"me"},
      {type:"bot", human:false, name:botName(0)},
      {type:"bot", human:false, name:botName(1)},
      {type:"bot", human:false, name:botName(2)}
    ];
  },

  newRoom(){
    const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let s = "";
    for (let i=0;i<6;i++) s += A[Math.floor(Math.random()*A.length)];
    return s;
  },

  deepLink(){
    const base = location.origin && location.origin !== "null"
      ? location.origin + location.pathname : "https://baladyplus.sa/mini/baloot/";
    return base + "?room=" + this.room;
  },

  refreshBotNames(){
    let i = 0;
    for (const s of this.seats) if (s.type === "bot") s.name = botName(i++);
    this.seats[0].name = T("you");
  },

  /* ---- main lobby ---- */
  open(){
    this.refreshBotNames();
    const body = $("#lobby-body");
    body.className = "panel centered";
    body.innerHTML = "";
    const hero = el("div", "hero");
    for (const c of [card("D","J"), card("S","A"), card("H","K")]) hero.appendChild(cardNode(c));
    body.appendChild(hero);
    body.appendChild(el("h2", null, T("lobbyTitle")));
    body.appendChild(el("p", "sub", T("lobbySub")));

    body.appendChild(el("h3", null, T("seats")));
    body.appendChild(this.seatList());

    const r1 = el("div", "row"); r1.style.marginTop = "12px";
    const b1 = el("button", "btn gold", "▶︎ " + T("startSolo"));
    b1.onclick = () => this.startGame();
    r1.appendChild(b1);
    body.appendChild(r1);

    const r2 = el("div", "row"); r2.style.marginTop = "8px";
    const b2 = el("button", "btn", "👥 " + T("inviteFriends"));
    b2.onclick = () => { UI.hide("#m-lobby"); this.openFriends(); };
    const b3 = el("button", "btn ghost sm", "📖");
    b3.onclick = () => { UI.hide("#m-lobby"); UI.openRules(); };
    r2.appendChild(b2); r2.appendChild(b3);
    body.appendChild(r2);

    body.appendChild(el("div", "hint", T("target") + " " + CFG.target + " " + T("points")));
    UI.show("#m-lobby");
  },

  seatList(){
    const wrap = el("div", null, "");
    const labels = {0:T("seatS"), 1:T("seatE"), 2:T("seatN"), 3:T("seatW")};
    for (const i of [2,1,3]){
      const s = this.seats[i];
      const row = el("div", "seatrow");
      row.appendChild(el("div", "pos", labels[i]));
      row.appendChild(el("div", "who", s.name));
      const tag = s.type === "bot" ? el("span", "tag bot", T("bot"))
                : s.joined ? el("span", "tag joined", T("joined"))
                : el("span", "tag wait", T("waiting"));
      row.appendChild(tag);
      if (s.type === "friend"){
        const x = el("button", "icon-btn", "✕");
        x.style.width = x.style.height = "26px";
        x.onclick = () => {
          this.seats[i] = {type:"bot", human:false, name:botName(i)};
          this.selected = this.selected.filter(f => f.id !== s.id);
          this.open();
        };
        row.appendChild(x);
      }
      wrap.appendChild(row);
    }
    return wrap;
  },

  /* ---- friends / invite ---- */
  openFriends(){
    Friends.request();
    this.renderFriendsList();
    UI.show("#m-friends");
  },

  renderFriendsList(){
    const body = $("#friends-body");
    body.innerHTML = "";
    body.appendChild(el("h2", null, "👥 " + T("friendsTitle")));
    body.appendChild(el("p", "sub", T("friendsSub")));

    // room code + share
    body.appendChild(el("h3", null, T("roomCode")));
    const code = el("div", null, this.room); code.id = "roomcode";
    body.appendChild(code);

    const rr = el("div", "row");
    const bCopy = el("button", "btn ghost", "⧉ " + T("copy"));
    bCopy.onclick = async () => {
      const txt = this.deepLink();
      try{
        if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(txt);
        else { const ta = el("textarea"); ta.value = txt; document.body.appendChild(ta);
               ta.select(); document.execCommand("copy"); ta.remove(); }
        toast(T("copied"));
      }catch(e){ toast(txt); }
    };
    const bShare = el("button", "btn gold", "↗ " + T("share"));
    bShare.onclick = async () => {
      const text = (LANG === "ar" ? "العب بلوت معي في بلدي+ — رمز الغرفة: " : "Play Baloot with me on Balady+ — room: ") + this.room;
      const url = this.deepLink();
      const sentToHost = Bridge.send("share", {room:this.room, url, text});
      if (navigator.share){ try{ await navigator.share({title:"Baloot", text, url}); return; }catch(e){} }
      if (!sentToHost) { bCopy.onclick(); }
    };
    rr.appendChild(bCopy); rr.appendChild(bShare);
    body.appendChild(rr);

    // friends list
    body.appendChild(el("h3", null, T("myFriends")));
    const list = el("div", "flist");
    const all = Friends.all();
    if (!Friends.loaded()){
      list.appendChild(el("div", "empty", T("loadingFriends")));
    } else if (!all.length){
      list.appendChild(el("div", "empty", T("noFriends").replace(/\n/g, "<br>")));
    } else {
      for (const f of all){
        const on = this.selected.some(x => x.id === f.id);
        const item = el("div", "fitem" + (on ? " on" : ""));
        item.appendChild(el("div", "av", (f.name || "#").trim().charAt(0).toUpperCase()));
        const meta = el("div", "meta");
        meta.appendChild(el("div", "n", f.name));
        meta.appendChild(el("div", "s", "#" + f.id + (f.online ? " • " + (LANG==="ar"?"متصل":"online") : "")));
        item.appendChild(meta);
        item.appendChild(el("div", "pick", on ? "✓" : ""));
        item.onclick = () => {
          if (on) this.selected = this.selected.filter(x => x.id !== f.id);
          else if (this.selected.length < 3) this.selected.push(f);
          else toast(LANG === "ar" ? "ثلاثة أصدقاء كحد أقصى" : "Three friends maximum");
          this.renderFriendsList();
        };
        list.appendChild(item);
      }
    }
    body.appendChild(list);

    // add by player number — mirrors the in-app "تحدي بلدي" friends flow
    body.appendChild(el("h3", null, T("addByNumber")));
    const addRow = el("div", "row");
    const inp = el("input", "field");
    inp.placeholder = T("addHint");
    inp.setAttribute("inputmode", "numeric");
    const bAdd = el("button", "btn sm gold", T("add"));
    bAdd.onclick = () => {
      const f = Friends.addLocal(inp.value);
      if (f){ inp.value = ""; this.renderFriendsList(); }
      else toast(LANG === "ar" ? "رقم غير صالح أو مضاف مسبقاً" : "Invalid or already added");
    };
    addRow.appendChild(inp); addRow.appendChild(bAdd);
    body.appendChild(addRow);

    if (Bridge.hasHost()){
      const bHost = el("button", "btn ghost wide", T("hostInvite"));
      bHost.style.marginTop = "8px";
      bHost.onclick = () => Bridge.send("getFriends", {force:true});
      body.appendChild(bHost);
    }

    body.appendChild(el("div", "divider"));
    const rGo = el("div", "row");
    const bGo = el("button", "btn gold", T("seatThem"));
    bGo.onclick = () => this.seatSelected();
    const bBack = el("button", "btn ghost sm", "←");
    bBack.onclick = () => { UI.hide("#m-friends"); this.open(); };
    rGo.appendChild(bGo); rGo.appendChild(bBack);
    body.appendChild(rGo);

    body.appendChild(el("div", "hint", LANG === "ar"
      ? "الدعوة تُرسل عبر تطبيق بلدي+. حتى انضمام صديقك يلعب البوت مكانه بنفس الاسم."
      : "Invitations are delivered by the Balady+ app. Until a friend joins, a bot plays that seat under their name."));
  },

  seatSelected(){
    // partner first, then right, then left
    const order = [2,1,3];
    for (let i=0;i<order.length;i++){
      const seat = order[i], f = this.selected[i];
      this.seats[seat] = f
        ? {type:"friend", human:false, name:f.name, id:f.id, joined:false}
        : {type:"bot", human:false, name:botName(seat)};
    }
    if (this.selected.length){
      Bridge.send("invite", {
        room: this.room,
        deepLink: this.deepLink(),
        ids: this.selected.map(f => f.id),
        seats: order.map((s,i) => ({seat:s, id:this.selected[i] ? this.selected[i].id : null}))
      });
      toast(T("inviteSent", {n:this.selected.map(f => f.name).join("، ")}));
    }
    UI.hide("#m-friends");
    this.open();
  },

  friendJoined(f){
    if (!f) return;
    const seat = this.seats.findIndex(s => s.type === "friend" && String(s.id) === String(f.id));
    const i = (typeof f.seat === "number" && f.seat > 0 && f.seat < 4) ? f.seat : seat;
    if (i > 0){
      this.seats[i].joined = true;
      if (f.name) this.seats[i].name = f.name;
      toast(this.seats[i].name + " — " + T("joined"));
      UI.renderSeats();
      if (!$("#m-lobby").hidden) this.open();
    }
  },

  applyRoom(r){
    if (!r) return;
    if (r.room) this.room = String(r.room).toUpperCase();
    if (Array.isArray(r.seats)){
      r.seats.forEach((s, i) => {
        if (i === 0 || !s) return;
        this.seats[i] = s.bot
          ? {type:"bot", human:false, name:s.name || botName(i)}
          : {type:"friend", human:false, name:s.name || ("#"+s.id), id:s.id, joined:!!s.joined};
      });
    }
    if (!$("#m-friends").hidden) this.renderFriendsList();
    if (!$("#m-lobby").hidden) this.open();
    UI.renderSeats();
  },

  startGame(){
    UI.hide("#m-lobby");
    Game.start(this.seats.map(s => ({...s})));
  }
};

const RULES_AR = `
<div class="rules">
<p><b>بلوت</b> — أربعة لاعبين، فريقان (أنت وشريكك في المقابل). ٣٢ ورقة (٧ إلى الآكل)، ٨ أوراق لكل لاعب.</p>

<h3>المزايدة</h3>
<ul>
<li>تُوزَّع ٥ أوراق لكل لاعب وتُكشف ورقة في الوسط.</li>
<li>في الجولة الأولى: <b>حكم</b> على نوع الورقة المكشوفة، أو <b>صن</b> (بدون حكم)، أو <b>بس</b>.</li>
<li><b>الصن يعلى على الحكم</b> في نفس الجولة.</li>
<li>إذا باص الجميع: جولة ثانية تختار فيها أي نوع للحكم أو الصن. وإذا باص الجميع مرة أخرى يُعاد التوزيع.</li>
<li>من زايد يأخذ الورقة المكشوفة + ورقتين، والباقون ٣ أوراق لكل منهم.</li>
</ul>

<h3>ترتيب الأوراق والنقاط</h3>
<table>
<tr><th>الورقة</th><th>صن</th><th>حكم (غير الحكم)</th><th>حكم (نوع الحكم)</th></tr>
<tr><td>الولد (J)</td><td>٢</td><td>٢</td><td><b>٢٠</b></td></tr>
<tr><td>٩</td><td>٠</td><td>٠</td><td><b>١٤</b></td></tr>
<tr><td>الآكل (A)</td><td>١١</td><td>١١</td><td>١١</td></tr>
<tr><td>١٠</td><td>١٠</td><td>١٠</td><td>١٠</td></tr>
<tr><td>الشايب (K)</td><td>٤</td><td>٤</td><td>٤</td></tr>
<tr><td>البنت (Q)</td><td>٣</td><td>٣</td><td>٣</td></tr>
<tr><td>٨ / ٧</td><td>٠</td><td>٠</td><td>٠</td></tr>
</table>
<p>الترتيب في الصن: آكل &gt; ١٠ &gt; شايب &gt; بنت &gt; ولد &gt; ٩ &gt; ٨ &gt; ٧.<br>
في نوع الحكم: ولد &gt; ٩ &gt; آكل &gt; ١٠ &gt; شايب &gt; بنت &gt; ٨ &gt; ٧.</p>
<p>آخر أكلة تُضيف <b>١٠</b> نقاط. مجموع الصن ١٣٠، ومجموع الحكم ١٦٢.</p>

<h3>قواعد اللعب</h3>
<ul>
<li>يجب اتباع نوع الورقة المطروحة إن وُجد لديك.</li>
<li>في الحكم: إذا لم يكن لديك النوع وجب عليك القطع بالحكم، إلا إذا كانت الأكلة لشريكك.</li>
<li>يجب أن تعلو على الحكم المطروح إن استطعت.</li>
</ul>

<h3>المشاريع</h3>
<ul>
<li><b>سرا</b> ٣ متتالية من نفس النوع = ٢٠</li>
<li><b>خمسين</b> ٤ متتالية = ٥٠</li>
<li><b>مية</b> ٥ متتالية أو ٤ أوراق متشابهة (آكل/شايب/بنت/١٠/٩) = ١٠٠</li>
<li><b>أربعمية</b> ٤ ولد = ٤٠٠</li>
<li><b>بلوت</b> شايب وبنت نوع الحكم = ٢٠ (في الحكم فقط)</li>
</ul>
<p>يحتسب المشاريع الفريق صاحب أعلى مشروع فقط. تُضاف قيمتها إلى نقاط الأكلات ثم تُقسَّم، ولأن الصن يُقسَّم على ٥ والحكم على ١٠ فإن <b>قيمة المشروع في الصن ضِعف قيمتها في الحكم</b> (الخمسين = ١٠ نقاط في الصن و٥ في الحكم، والأربعمية = ٨٠ في الصن و٤٠ في الحكم).</p>

<h3>الحساب</h3>
<ul>
<li>الصن: النقاط ÷ ٥ (الباقي ٣ فأكثر يُقرَّب لأعلى) — ٢٦ نقطة للجولة.</li>
<li>الحكم: النقاط ÷ ١٠ (الباقي ٦ فأكثر يُقرَّب لأعلى) — ١٦ نقطة للجولة.</li>
<li><b>خسارة</b>: إذا حصل فريق المزايد على نقاط أقل من الخصم تذهب كل نقاط الجولة للخصم.</li>
<li><b>كبوت</b>: أخذ الأكلات الثماني = ٤٤ في الصن، ٢٥ في الحكم.</li>
<li>التعادل = <b>أرض</b>، تُضاف نقاط الجولة إلى الجولة التالية.</li>
<li>اللعبة حتى <b>١٥٢</b> نقطة.</li>
</ul>
</div>`;

const RULES_EN = `
<div class="rules">
<p><b>Baloot</b> — four players in two partnerships (you and the player opposite). 32 cards (7 to Ace), 8 cards each.</p>

<h3>Bidding</h3>
<ul>
<li>Five cards are dealt to each player and one card is turned face up.</li>
<li>First round: bid <b>Hokum</b> (that card's suit is trump), <b>Sun</b> (no trump), or <b>Pass</b>.</li>
<li><b>Sun outbids Hokum</b> within the same round.</li>
<li>If all pass, a second round lets you pick any trump suit or Sun. All passing again means a redeal.</li>
<li>The bidder takes the face-up card plus two more; everyone else gets three.</li>
</ul>

<h3>Card ranking &amp; points</h3>
<table>
<tr><th>Card</th><th>Sun</th><th>Hokum (plain)</th><th>Hokum (trump)</th></tr>
<tr><td>J</td><td>2</td><td>2</td><td><b>20</b></td></tr>
<tr><td>9</td><td>0</td><td>0</td><td><b>14</b></td></tr>
<tr><td>A</td><td>11</td><td>11</td><td>11</td></tr>
<tr><td>10</td><td>10</td><td>10</td><td>10</td></tr>
<tr><td>K</td><td>4</td><td>4</td><td>4</td></tr>
<tr><td>Q</td><td>3</td><td>3</td><td>3</td></tr>
<tr><td>8 / 7</td><td>0</td><td>0</td><td>0</td></tr>
</table>
<p>Sun order: A &gt; 10 &gt; K &gt; Q &gt; J &gt; 9 &gt; 8 &gt; 7.<br>
Trump order: J &gt; 9 &gt; A &gt; 10 &gt; K &gt; Q &gt; 8 &gt; 7.</p>
<p>The last trick is worth <b>10</b> extra. Sun totals 130 raw points, Hokum 162.</p>

<h3>Playing rules</h3>
<ul>
<li>You must follow the led suit if you hold it.</li>
<li>In Hokum, if you are void you must trump — unless your partner is already winning the trick.</li>
<li>You must over-trump a trump already played whenever you can.</li>
</ul>

<h3>Projects</h3>
<ul>
<li><b>Sra</b> — 3 in sequence, same suit = 20</li>
<li><b>Fifty</b> — 4 in sequence = 50</li>
<li><b>Hundred</b> — 5 in sequence, or four of a kind (A/K/Q/10/9) = 100</li>
<li><b>Four Hundred</b> — four Jacks = 400</li>
<li><b>Baloot</b> — K + Q of trump = 20 (Hokum only)</li>
</ul>
<p>Only the team holding the single highest project scores projects. Project values are added to the trick points before conversion, so &mdash; because Sun divides by 5 and Hokum by 10 &mdash; <b>a project is worth twice as much in Sun</b> (a Fifty is 10 points in Sun, 5 in Hokum; a Four Hundred is 80 in Sun, 40 in Hokum).</p>

<h3>Scoring</h3>
<ul>
<li>Sun: raw ÷ 5 (remainder 3+ rounds up) — 26 points per round.</li>
<li>Hokum: raw ÷ 10 (remainder 6+ rounds up) — 16 points per round.</li>
<li><b>Failed bid</b>: if the bidding team scores less than the defenders, the defenders take everything.</li>
<li><b>Kaboot</b> (all 8 tricks): 44 in Sun, 25 in Hokum.</li>
<li>A tie carries the round's points over to the next round.</li>
<li>The game is played to <b>152</b> points.</li>
</ul>
</div>`;

/* ============================================================
   Parallax
   ------------------------------------------------------------
   The scene pans inside its own crop while the wall lattice and the chrome
   drift the other way. On a phone a device-orientation reading drives it; on
   a desktop the two arrows in the corner, or the 1 and 2 keys, stand in.
   ============================================================ */
const Tilt = (() => {
  const root = document.documentElement;
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let target = 0, current = 0, manual = 0, gyro = 0, live = false, raf = 0;

  const PAN = 0.26;                 // share of the crop the scene travels, matches the CSS
  let overflow = 0;                 // px of picture hidden either side of the board
  function measure(){
    const b = $("#board");
    if (!b) return;
    const w = b.clientWidth, h = b.clientHeight;
    if (!w || !h) return;
    const scale = Math.max(w / 880, h / 553);   // background-size: cover
    overflow = Math.max(0, 880 * scale - w);
  }
  window.addEventListener("resize", () => { measure(); kick(); });

  function frame(){
    const want = manual !== 0 ? manual : gyro;
    target = Math.max(-1, Math.min(1, want));
    current += (target - current) * 0.12;
    if (Math.abs(current - target) < 0.0015) current = target;
    root.style.setProperty("--tilt", current.toFixed(4));
    // the picture slides the other way from the position percentage
    root.style.setProperty("--scene-shift", (-current * PAN * overflow).toFixed(2) + "px");
    raf = (current !== target) ? requestAnimationFrame(frame) : 0;
  }
  const kick = () => { if (!overflow) measure(); if (!raf && !reduced) raf = requestAnimationFrame(frame); };

  /* ---- the desktop stand-in ---- */
  function hold(dir, on){
    manual = on ? dir : (manual === dir ? 0 : manual);
    $("#tilt-l").classList.toggle("held", manual < 0);
    $("#tilt-r").classList.toggle("held", manual > 0);
    kick();
  }

  /* ---- the real thing ---- */
  function onOrientation(e){
    if (e.gamma == null) return;
    // gamma is the left-right tilt in degrees; a quarter turn is plenty of travel
    gyro = Math.max(-1, Math.min(1, e.gamma / 26));
    if (!live){ live = true; $("#tiltpad").classList.add("gyro"); }
    kick();
  }
  function enableGyro(){
    if (live || reduced) return;
    const DOE = window.DeviceOrientationEvent;
    if (!DOE) return;
    if (typeof DOE.requestPermission === "function"){
      // iOS only grants this from inside a user gesture
      DOE.requestPermission().then(r => {
        if (r === "granted") window.addEventListener("deviceorientation", onOrientation);
      }).catch(() => {});
    } else {
      window.addEventListener("deviceorientation", onOrientation);
    }
  }

  return { hold, enableGyro, measure, get live(){ return live; } };
})();

(function bindTilt(){
  const pad = [["#tilt-l", -1], ["#tilt-r", 1]];
  for (const [sel, dir] of pad){
    const b = $(sel);
    b.addEventListener("pointerdown", e => { e.preventDefault(); Tilt.enableGyro(); Tilt.hold(dir, true); });
    for (const ev of ["pointerup", "pointerleave", "pointercancel"])
      b.addEventListener(ev, () => Tilt.hold(dir, false));
  }
  const KEY = { "1": -1, "2": 1 };
  window.addEventListener("keydown", e => {
    if (e.repeat || !(e.key in KEY)) return;
    Tilt.hold(KEY[e.key], true);
  });
  window.addEventListener("keyup", e => { if (e.key in KEY) Tilt.hold(KEY[e.key], false); });
  // Android reports orientation without asking; iOS waits for the first tap above
  Tilt.enableGyro();
})();

/* ---- lantern pools, measured off the scene, and the embers between them ---- */
(function ambience(){
  const board = $("#board");
  if (!board) return;
  const layer = el("div", "amb");
  layer.appendChild(el("div", "wash"));
  $("#felt").insertBefore(el("div", "sheen"), board.nextSibling);

  // x / y are percentages of the picture, so they follow it as it scales
  const LAMPS = [
    {x:40.9, y:14.5, r:42, o:.58, d:5.2, dl:0},      // the lantern on the back table
    {x:14.8, y:18.1, r:24, o:.42, d:3.9, dl:-1.3},   // the candle on the left wall
    {x:52.3, y:14.5, r:22, o:.24, d:6.1, dl:-2.6},   // wall wash beside it
    {x: 2.3, y:57.9, r:28, o:.46, d:4.4, dl:-0.7},   // floor lantern, far left
    {x:97.7, y:50.6, r:30, o:.46, d:4.8, dl:-2.1}    // floor lantern, far right
  ];
  for (const L of LAMPS){
    const n = el("i", "lamp");
    n.style.cssText = "--x:" + L.x + "%;--y:" + L.y + "%;--r:" + L.r + "%;" +
                      "--o:" + L.o + ";--d:" + L.d + "s;--dl:" + L.dl + "s";
    n.appendChild(document.createElement("b"));
    layer.appendChild(n);
  }

  // embers rise near the lamps rather than all over the room
  const rnd = (a, b) => a + Math.random() * (b - a);
  for (let i = 0; i < 14; i++){
    const src = LAMPS[i % LAMPS.length];
    const n = el("i", "mote");
    n.style.cssText =
      "--x:" + (src.x + rnd(-13, 13)).toFixed(1) + "%;" +
      "--y:" + (src.y + rnd(2, 26)).toFixed(1) + "%;" +
      "--s:" + rnd(2.5, 5).toFixed(1) + "px;" +
      "--dx:" + rnd(-26, 26).toFixed(0) + "px;" +
      "--dy:" + rnd(-70, -130).toFixed(0) + "px;" +
      "--d:" + rnd(7, 15).toFixed(1) + "s;" +
      "--dl:" + (-rnd(0, 14)).toFixed(1) + "s";
    n.appendChild(document.createElement("b"));
    layer.appendChild(n);
  }
  board.insertBefore(layer, board.firstChild);
})();

/* ---- self-check (open with ?test=1) ---- */
if (new URL(location.href).searchParams.get("test") === "1"){
  const out = [];
  const ok = (name, cond) => out.push((cond ? "PASS " : "FAIL ") + name);

  // deck
  const d = makeDeck();
  ok("deck 32 unique", d.length === 32 && new Set(d.map(c=>c.id)).size === 32);

  // point totals
  const stS = {mode:"sun"}, stH = {mode:"hokum", trump:"S"};
  ok("sun total 120", d.reduce((a,c)=>a+cardPoints(c,stS),0) === 120);
  ok("hokum total 152", d.reduce((a,c)=>a+cardPoints(c,stH),0) === 152);

  // conversion
  ok("convert sun 130 -> 26", convert(130,"sun") === 26);
  ok("convert hokum 162 -> 16", convert(162,"hokum") === 16);
  ok("convert sun 62 -> 12", convert(62,"sun") === 12);   // 12 r2 -> down
  ok("convert sun 63 -> 13", convert(63,"sun") === 13);   // 12 r3 -> up
  ok("convert hokum 75 -> 7", convert(75,"hokum") === 7);
  ok("convert hokum 76 -> 8", convert(76,"hokum") === 8);

  // trick winner
  const t1 = [{seat:0,card:card("H","A")},{seat:1,card:card("H","10")},
              {seat:2,card:card("S","J")},{seat:3,card:card("H","7")}];
  ok("plain trick: ace wins", trickWinner(t1, stS) === 0);
  ok("trump beats ace", trickWinner(t1, stH) === 2);

  // must follow suit
  const hand = [card("H","7"), card("S","A"), card("C","K")];
  ok("follow suit forced",
     legalCards(hand, [{seat:3,card:card("H","K")}], stS).every(c => c.s === "H"));

  // hokum: must trump when void and partner is not winning
  const h2 = [card("S","8"), card("C","K"), card("D","A")];
  const st2 = {...stH, currentSeat:1};
  const lg = legalCards(h2, [{seat:0,card:card("H","K")}], st2);
  ok("must trump when void", lg.length === 1 && lg[0].s === "S");

  // partner winning => free discard
  const st3 = {...stH, currentSeat:2};
  const lg3 = legalCards(h2, [{seat:0,card:card("H","A")},{seat:1,card:card("H","7")}], st3);
  ok("free discard when partner winning", lg3.length === 3);

  // over-trump obligation
  const h4 = [card("S","7"), card("S","A"), card("D","9")];
  const st4 = {...stH, currentSeat:2};      // partner (seat 0) is losing to seat 1's trump
  const lg4 = legalCards(h4, [{seat:0,card:card("H","K")},{seat:1,card:card("S","10")}], st4);
  ok("must over-trump", lg4.length === 1 && lg4[0].r === "A");

  // projects
  ok("sra = 20", findProjects([card("H","7"),card("H","8"),card("H","9"),card("C","A")], stS)
      .some(p => p.kind === "sra"));
  ok("fifty = 50", findProjects([card("H","7"),card("H","8"),card("H","9"),card("H","10")], stS)
      .some(p => p.kind === "50"));
  ok("four jacks = 400", findProjects(SUITS.map(s => card(s,"J")), stS).some(p => p.value === 400));
  ok("baloot = 20", findProjects([card("S","K"),card("S","Q")], stH).some(p => p.kind === "baloot"));


  // ---- round scoring ----
  const mkRound = (mode, tricks, proj, bidder, won) => ({
    mode, trump: mode === "hokum" ? "S" : null, bidder,
    rawPoints: tricks, tricksWon: won || [4,4],
    projects:{teamPoints: proj, announcements:[]}
  });
  // a project is worth twice as much in Sun purely because Sun divides by 5
  ok("fifty in hokum = 5",  convert(50, "hokum") === 5);
  ok("fifty in sun = 10",   convert(50, "sun")   === 10);
  ok("400 in hokum = 40",   convert(400,"hokum") === 40);
  ok("400 in sun = 80",     convert(400,"sun")   === 80);

  const rNorm = scoreRound(mkRound("hokum", [100,62], [0,0], 0));
  ok("hokum split 100/62 -> 10/6", rNorm.final[0] === 10 && rNorm.final[1] === 6 && !rNorm.note);

  const rFail = scoreRound(mkRound("sun", [40,90], [0,0], 0));
  ok("failed bid gives defenders the lot",
     rFail.note === "losing" && rFail.final[0] === 0 && rFail.final[1] === CFG.sunTotal);

  const rFailP = scoreRound(mkRound("sun", [40,90], [0,50], 0));
  ok("failed bid adds the projects",
     rFailP.final[1] === CFG.sunTotal + convert(50,"sun") && rFailP.final[0] === 0);

  const rKab = scoreRound(mkRound("hokum", [162,0], [0,0], 0, [8,0]));
  ok("kaboot hokum = 25", rKab.note === "kaboot" && rKab.final[0] === CFG.kabootHokum);

  const rTie = scoreRound(mkRound("hokum", [81,81], [0,0], 0));
  ok("equal scores carry over", rTie.note === "tie" && rTie.final[0] === rTie.final[1]);

  // a big project can flip a round the bidders won on tricks - that is real Baloot
  const rFlip = scoreRound(mkRound("sun", [106,24], [0,400], 0));
  ok("a 400 flips the round", rFlip.note === "losing" &&
     rFlip.final[1] === CFG.sunTotal + convert(400,"sun"));
  // ...but a mid-sized project must not, which it would if Sun doubled on top of /5
  const rNoFlip = scoreRound(mkRound("sun", [106,24], [0,70], 0));
  ok("a 70 project does not flip (no double-counting in Sun)",
     !rNoFlip.note && rNoFlip.final[0] === convert(106,"sun") && rNoFlip.final[1] === convert(94,"sun"));

  console.log("%cBaloot self-check", "font-weight:bold", "\n" + out.join("\n"));
  const fails = out.filter(l => l.startsWith("FAIL"));
  toast(fails.length ? (fails.length + " test(s) failed — see console") : "All " + out.length + " tests passed ✓");
}
