// Classic French pip layouts, given as percentages inside the pip field.
// Two outer columns plus a middle column, exactly as a printed deck sets them.
// A pip below the middle is drawn upside down, the way a real card prints it.
const PIP_LAYOUT = {
  "7" :[[0,0],[100,0],[0,50],[100,50],[0,100],[100,100],[50,25]],
  "8" :[[0,0],[100,0],[0,50],[100,50],[0,100],[100,100],[50,25],[50,75]],
  "9" :[[0,0],[100,0],[0,33.3],[100,33.3],[0,66.7],[100,66.7],[0,100],[100,100],[50,50]],
  "10":[[0,0],[100,0],[0,33.3],[100,33.3],[0,66.7],[100,66.7],[0,100],[100,100],[50,16.7],[50,83.3]]
};

function cardNode(c, st, extraCls){
  const red = SUIT_RED[c.s];
  const n = el("div", "card " + (red ? "r" : "k") + (extraCls ? " " + extraCls : "")
            + (st && isTrump(c, st) ? " trump" : ""));
  const g = SUIT_GLYPH[c.s];
  let body;
  if (c.r === "A"){
    body = '<div class="ace">' + g + '</div>';
  } else if (PIP_LAYOUT[c.r]){
    body = '<div class="pips">' + PIP_LAYOUT[c.r].map(([x,y]) =>
      '<i class="' + (y > 50 ? "f" : "") + '" style="--x:' + x + '%;--y:' + y + '%">' + g + '</i>'
    ).join("") + '</div>';
  } else {
    body = '<div class="court"><i class="cs">' + g + '</i>' +
           '<span class="cl">' + c.r + '</span>' +
           '<i class="cs">' + g + '</i></div>';
  }
  const idx = '<span class="rk">' + c.r + '</span><span class="su">' + g + '</span>';
  n.innerHTML = '<div class="idx tl">' + idx + '</div>' + body +
                '<div class="idx br">' + idx + '</div>';
  return n;
}

/* ============================================================
   7. Game controller
   ============================================================ */
const Game = {
  G:null,        // game-level state
  R:null,        // round state
  busy:false,

  start(seatsMeta){
    this.G = newGameState(seatsMeta);
    UI.renderSeats();
    UI.renderScores();
    this.newRound();
  },

  async newRound(){
    const G = this.G;
    G.dealer = (G.dealer + 1) % 4;
    const deck = shuffle(makeDeck());
    const hands = [[],[],[],[]];
    for (let i=0;i<4;i++) hands[i] = deck.splice(0,5);
    const upcard = deck.shift();

    this.R = {
      deck, hands, upcard,
      mode:null, trump:null, bidder:-1,
      trick:[], turn:(G.dealer + 1) % 4, currentSeat:0,
      rawPoints:[0,0], tricksWon:[0,0],
      handsAtDeal:null, projects:{teamPoints:[0,0], announcements:[]},
      unseen:[], trickNo:0, lastWinner:-1
    };
    UI.hide("#m-bid");            // a panel left over from an abandoned deal
    UI.clearTrick();
    UI.setMode(null);
    UI.renderHand();
    UI.renderSeats();
    UI.renderScores();

    await wait(pace(260));
    this.bidRound = 1;
    this.bidsSeen = 0;
    this.bidLocked = false;
    this.currentBid = null;
    this.bidTurn = (G.dealer + 1) % 4;
    this.nextBid();
  },

  /* ---------------- bidding ---------------- */
  async nextBid(){
    const R = this.R, G = this.G;
    if (this.bidsSeen >= 4){
      if (this.currentBid){ return this.settleBid(); }
      if (this.bidRound === 1){
        this.bidRound = 2; this.bidsSeen = 0; this.bidTurn = (G.dealer + 1) % 4;
        toast(LANG === "ar" ? "الجولة الثانية من المزايدة" : "Second bidding round");
        await wait(pace(500));
      } else {
        UI.hide("#m-bid");
        toast(T("redeal"));
        await wait(pace(900));
        return this.newRound();
      }
    }
    const seat = this.bidTurn;
    const meta = G.seats[seat];
    if (meta.human){
      UI.showBidPanel(seat);
    } else {
      await wait(pace(620));
      const isLast = this.bidsSeen === 3 && this.bidRound === 2 && !this.currentBid;
      const b = AI.bid(R.hands[seat], seat, {mode:"sun"}, this.bidRound, R.upcard,
                       isLast, this.canAshkal());
      this.applyBid(seat, this.legalBid(b));
    }
  },

  // البند الثامن: only the third and fourth seats may say أشكل, only in the
  // first round, and only while nobody has bought.
  canAshkal(){
    return this.bidRound === 1 && !this.currentBid && this.bidsSeen >= 2;
  },

  legalBid(b){
    if (b.type === "ashkal" && !this.canAshkal()) b = {type:"sun"};
    // Sun over-rides a standing Hokum; nothing over-rides a standing Sun.
    if (!this.currentBid) return b;
    if (this.currentBid.type === "sun") return {type:"pass"};
    if (b.type === "hokum") return {type:"pass"};
    return b;
  },

  async applyBid(seat, b){
    // a double tap on a bid button would otherwise advance the auction twice
    if (this.bidLocked) return;
    this.bidLocked = true;
    UI.hide("#m-bid");
    Sound.bid();
    const label = b.type === "pass"   ? T("pass")
                : b.type === "sun"    ? T("sun")
                : b.type === "ashkal" ? T("ashkal")
                : T("hokum") + " " + SUIT_GLYPH[b.suit];
    UI.bubble(seat, label, b.type !== "pass");
    if (b.type !== "pass") this.currentBid = {...b, seat};
    this.bidsSeen++;
    this.bidTurn = (this.bidTurn + 1) % 4;
    await wait(pace(480));
    this.bidLocked = false;
    this.nextBid();
  },

  async settleBid(){
    const R = this.R, G = this.G, b = this.currentBid;
    // أشكل is a Sun bought for the partner: the partner takes the face-up card
    // and is the buyer, the player who said it keeps their own five.
    const declarer = b.type === "ashkal" ? (b.seat + 2) % 4 : b.seat;
    R.mode   = b.type === "ashkal" ? "sun" : b.type;
    R.trump  = b.type === "hokum" ? b.suit : null;
    R.bidder = declarer;
    R.ashkalBy = b.type === "ashkal" ? b.seat : -1;

    // the buyer receives the face-up card + 2, the others 3 each
    for (let k=0;k<4;k++){
      const seat = (declarer + k) % 4;
      if (seat === declarer){ R.hands[seat].push(R.upcard, ...R.deck.splice(0,2)); }
      else { R.hands[seat].push(...R.deck.splice(0,3)); }
    }
    R.upcard = null;
    R.handsAtDeal = R.hands.map(h => h.slice());
    R.projects = resolveProjects(R.handsAtDeal, R, (G.dealer + 1) % 4);
    R.unseen = [].concat(...R.hands.filter((_,i)=>i!==0).map(h=>h.slice()));

    UI.setMode(R);
    UI.renderHand(null, true);
    UI.renderSeats();

    const who = G.seats[declarer].name;
    toast(T("bidderIs") + ": " + who + " — " +
          (R.mode === "sun" ? T("sun") : T("hokum") + " " + SUIT_GLYPH[R.trump]));

    await wait(pace(700));
    for (const a of R.projects.announcements){
      UI.bubble(a.seat, projName(a.kind), true);
      await wait(pace(420));
    }

    await this.doublePhase();

    R.turn = (G.dealer + 1) % 4;
    R.trickNo = 0;
    this.step();
  },

  /* ---------------- doubling: دبل / ثري / فور / قهوة ---------------- */
  // ٧-٢: a Sun may only be doubled by a side under a hundred against a side
  // that has passed it. A Hokum is open from the first card (٧-٣).
  canDoubleNow(){
    const R = this.R, G = this.G;
    if (R.mode !== "sun") return true;
    const bidTeam = R.bidder % 2;
    return G.scores[bidTeam] > 100 && G.scores[1 - bidTeam] <= 100;
  },

  askDouble(seat, kind){
    const R = this.R, G = this.G;
    if (!G.seats[seat].human){
      return wait(pace(420)).then(() => AI.double(R.hands[seat], R, seat, kind));
    }
    return new Promise(done => UI.showDoublePanel(seat, kind, done));
  },

  async announceRaise(seat, kind, locked){
    const R = this.R;
    const bidTeam = R.bidder % 2;
    R.mult = kind === "double" ? 2 : kind === "triple" ? 3 : kind === "quad" ? 4 : R.mult;
    if (kind === "gahwa") R.gahwa = true;
    // whoever spoke last hands the count to the other side (٤-١٠)
    R.countTeam = (seat % 2 === bidTeam) ? 1 - bidTeam : bidTeam;
    if (kind === "double" || kind === "quad") R.locked = !!locked;
    if (kind === "triple" || kind === "gahwa") R.locked = false;   // always open (٧-٥)
    Sound.bid();
    UI.bubble(seat, T(kind === "double" ? "dbl" : kind === "triple" ? "triple"
                    : kind === "quad" ? "quad" : "gahwa")
                    + (R.mode === "hokum" && R.locked ? " · " + T("lockedTag") : ""), true);
    UI.renderScores();
    await wait(pace(620));
  },

  async doublePhase(){
    const R = this.R;
    const live = () => this.R === R;        // a new deal while we waited abandons this one
    R.mult = 1; R.locked = false; R.gahwa = false;
    const bidTeam = R.bidder % 2;
    R.countTeam = 1 - bidTeam;
    if (!this.canDoubleNow()) return;

    // a defender doubles, in turn order from the dealer's right
    const order = [0,1,2,3].map(k => (this.G.dealer + 1 + k) % 4);
    let doubler = -1;
    for (const seat of order){
      if (seat % 2 === bidTeam) continue;
      const a = await this.askDouble(seat, "double");
      if (!live()) return;
      if (a && a.type === "double"){ doubler = seat; await this.announceRaise(seat, "double", a.locked); break; }
    }
    if (doubler < 0 || R.mode === "sun" || !live()) return;   // ٧-١: no ثري or فور in Sun

    const a3 = await this.askDouble(R.bidder, "triple");
    if (!live()) return;
    if (!a3 || a3.type !== "triple") return;
    await this.announceRaise(R.bidder, "triple");

    const a4 = await this.askDouble(doubler, "quad");
    if (!live()) return;
    if (!a4 || a4.type !== "quad") return;
    await this.announceRaise(doubler, "quad", a4.locked);

    const a5 = await this.askDouble(R.bidder, "gahwa");
    if (!live()) return;
    if (a5 && a5.type === "gahwa") await this.announceRaise(R.bidder, "gahwa");
  },

  /* ---------------- trick play ---------------- */
  async step(){
    const R = this.R, G = this.G;
    if (R.trickNo >= 8) return this.endRound();
    const seat = R.turn;
    R.currentSeat = seat;
    UI.renderSeats();

    if (G.seats[seat].human){
      this.busy = false;
      UI.renderHand(legalCards(R.hands[seat], R.trick, R));
      return;                      // wait for a tap
    }
    this.busy = true;
    await wait(pace(520 + Math.random()*260));
    const c = AI.play(R.hands[seat], R.trick, R, seat);
    this.playCard(seat, c);
  },

  /** The card the bots would play from your seat - used by the hint and the rail. */
  suggestion(){
    const R = this.R;
    if (!R || !R.mode || R.turn !== 0 || this.busy || !this.G.seats[0].human) return null;
    if (!R.hands[0].length) return null;
    R.currentSeat = 0;
    try { return AI.play(R.hands[0], R.trick, R, 0); } catch(e){ return null; }
  },

  humanPlay(c){
    const R = this.R;
    if (this.busy || !R || R.mode === null) return;
    if (!this.G.seats[R.turn].human) return;
    R.currentSeat = R.turn;
    const legal = legalCards(R.hands[R.turn], R.trick, R);
    if (!legal.some(x => x.id === c.id)){
      toast(illegalReason(c, R.hands[R.turn], R.trick, R));
      return;
    }
    this.playCard(R.turn, c);
  },

  async playCard(seat, c){
    const R = this.R;
    this.busy = true;                 // nothing in the hand is playable mid-resolution
    R.currentSeat = seat;
    R.hands[seat] = R.hands[seat].filter(x => x.id !== c.id);
    R.unseen = R.unseen.filter(x => x.id !== c.id);
    const ekka = R.trick.length === 0 && isEkka(c, R);
    R.trick.push({seat, card:c, ekka});
    Sound.card();
    if (ekka && c.r !== "A") UI.bubble(seat, T("ekka"));
    UI.placeCard(seat, c, R);
    UI.renderHand(null);
    UI.renderSeats();

    if (R.trick.length < 4){
      R.turn = (seat + 1) % 4;
      await wait(pace(180));
      return this.step();
    }

    // trick complete
    this.busy = true;
    await wait(pace(760));
    const w = trickWinner(R.trick, R);
    const team = w % 2;
    let pts = R.trick.reduce((a,p) => a + cardPoints(p.card, R), 0);
    R.trickNo++;
    if (R.trickNo === 8) pts += 10;                 // last-trick bonus
    R.rawPoints[team] += pts;
    R.tricksWon[team]++;
    R.lastWinner = w;
    Sound.win();
    UI.bubble(w, "+" + pts);
    UI.collectTrick(w);
    await wait(pace(560));
    UI.clearTrick();
    R.trick = [];
    R.turn = w;
    this.step();
  },

  /* ---------------- end of round ---------------- */
  async endRound(){
    const R = this.R, G = this.G;
    const res = scoreRound(R);

    const gained = [res.final[0], res.final[1]];
    if (res.note === "gahwa" && res.winner >= 0){
      // قهوة: the winning team takes the whole match there and then (٧-٤)
      gained[res.winner] = Math.max(CFG.target - G.scores[res.winner], 0);
    }
    G.scores[0] += gained[0];
    G.scores[1] += gained[1];
    G.history.push({round:G.roundNo, mode:R.mode, trump:R.trump, bidder:R.bidder, res, gained});

    UI.renderScores();
    Sound.round();
    if (res.note === "kaboot" || res.note === "gahwa") Music.flourish();

    const over = G.scores[0] >= CFG.target || G.scores[1] >= CFG.target;
    if (over){
      Music.flourish();
      const winner = G.scores[0] === G.scores[1] ? -1 : (G.scores[0] > G.scores[1] ? 0 : 1);
      Bridge.send("matchResult", {scores:G.scores, winner, rounds:G.roundNo});
    }
    UI.showRoundPanel(res, gained, over);
    G.roundNo++;
  }
};

/* ============================================================
   8. UI
   ============================================================ */
const UI = {
  show(sel){ $(sel).hidden = false; },
  hide(sel){ $(sel).hidden = true; },

  refreshAll(){
    this.renderSeats(); this.renderScores(); this.renderHand();
    if (!$("#m-lobby").hidden) Lobby.open();
    if (!$("#m-menu").hidden) this.openMenu();
    if (!$("#m-friends").hidden) this.openFriends();
    if (!$("#m-rules").hidden) this.openRules();
    if (Game.R) this.setMode(Game.R);
    Fullscreen.sync();
  },

  renderScores(){
    const G = Game.G; if (!G) return;
    $("#score-us").textContent   = G.scores[0];
    $("#score-them").textContent = G.scores[1];
    $("#st-deal").textContent    = T("dealNo", {n:G.roundNo});
    const R = Game.R;
    $("#st-target").textContent  = T("toTarget", {n:CFG.target})
      + (R && R.mult > 1 ? " • ×" + R.mult + (R.locked ? " " + T("lockedTag") : "") : "");
    $("#crest-badge").textContent = G.roundNo;
  },

  renderSeats(){
    const G = Game.G, R = Game.R; if (!G) return;
    const map = {2:"#seat-n", 1:"#seat-e", 3:"#seat-w"};
    for (const seat of [1,2,3]){
      const node = $(map[seat]); node.innerHTML = "";
      const m = G.seats[seat];
      node.classList.toggle("turn", !!(R && R.mode && R.turn === seat));

      const plate = el("div", "plate");
      plate.appendChild(el("span", "nm", m.name));
      if (R && R.bidder === seat) plate.appendChild(el("span", "tag bidder", "★"));
      else if (m.type === "friend" && !m.joined) plate.appendChild(el("span", "tag wait", "…"));
      else if (R && R.hands) plate.appendChild(el("span", "tag", String(R.hands[seat].length)));
      node.appendChild(plate);

      if (R && R.hands){
        const wins = el("div", "wins");
        for (let i=0;i<8;i++) wins.appendChild(el("i", i < R.tricksWon[seat % 2] ? "on" : ""));
        node.appendChild(wins);
      }
    }
  },

  sortHand(hand, R){
    const order = SUITS.slice().sort((a,b) => {
      if (R && R.trump){ if (a === R.trump) return -1; if (b === R.trump) return 1; }
      return SUITS.indexOf(a) - SUITS.indexOf(b);
    });
    return hand.slice().sort((a,b) => {
      const d = order.indexOf(a.s) - order.indexOf(b.s);
      if (d) return d;
      const st = R || {mode:"sun"};
      return cardOrder(b, st) - cardOrder(a, st);
    });
  },

  renderHand(legal, deal){
    const wrap = $("#hand"); wrap.innerHTML = "";
    const R = Game.R;
    if (!R || !R.hands){ wrap.classList.remove("active"); this.setHint(null); return; }
    const hand = this.sortHand(R.hands[0], R);
    const myTurn = !!(R.mode && R.turn === 0 && Game.G.seats[0].human && !Game.busy);
    wrap.classList.toggle("active", myTurn);

    const tip = myTurn ? Game.suggestion() : null;
    const flip = document.documentElement.dir === "rtl" ? -1 : 1;
    const count = hand.length;
    const spread = Math.min(2.7, 20 / Math.max(count, 1));

    hand.forEach((c, i) => {
      const slot = el("div", "slot");
      const playable = myTurn && (!legal || legal.some(x => x.id === c.id));
      if (myTurn) slot.classList.add(playable ? "playable" : "blocked");
      if (tip && c.id === tip.id) slot.classList.add("tip");
      // a shallow arc, the way a real hand is held
      const t = count > 1 ? (i - (count - 1) / 2) / ((count - 1) / 2) : 0;
      const a = t * ((count - 1) / 2) * spread * flip;
      slot.style.transform =
        "translateY(" + (t * t * 9).toFixed(1) + "px) rotate(" + a.toFixed(2) + "deg)";
      const n = cardNode(c, R);
      if (deal){
        slot.classList.add("deal");
        n.style.animationDelay = (i * 55) + "ms";
      }
      slot.appendChild(n);
      slot.addEventListener("click", () => Game.humanPlay(c));
      wrap.appendChild(slot);
    });
    this.setHint(myTurn ? tip : null);
    this.renderRail();
  },

  /* ---- the green "your turn" bubble ---- */
  setHint(c){
    const h = $("#hint");
    if (!c || !Settings.hints){ h.hidden = true; return; }
    const cls = SUIT_RED[c.s] ? "sr" : "sk";
    h.innerHTML = T("tryThis") + ' ' + c.r + ' <span class="' + cls + '">' + SUIT_GLYPH[c.s] + '</span>';
    h.hidden = false;
    // sit the bubble above the card it names, clamped to the screen
    const tip = $("#hand .slot.tip");
    const wrap = $("#hintwrap").getBoundingClientRect();
    if (tip){
      const tb = tip.getBoundingClientRect();
      const w = h.offsetWidth;
      const x = Math.max(8, Math.min(wrap.width - w - 8, tb.left - wrap.left + tb.width / 2 - 26));
      h.style.insetInlineStart = "auto";
      h.style.left = x + "px";
    }
  },

  /* ---- bottom action rail ---- */
  renderRail(){
    const R = Game.R, G = Game.G;
    const main = $("#rail-main"), hint = $("#rail-hint");
    hint.style.opacity = Settings.hints ? 1 : .45;
    if (!R || !R.mode){
      main.textContent = T("takeStage");
      main.disabled = false;
      main.classList.remove("idle");
      main.onclick = () => { if (!Game.R || !Game.R.mode) Lobby.open(); };
      return;
    }
    const myTurn = R.turn === 0 && G.seats[0].human && !Game.busy;
    if (myTurn){
      const c = Game.suggestion();
      main.innerHTML = c
        ? T("play") + ' ' + c.r + ' <span style="color:' +
          (SUIT_RED[c.s] ? "#b3202f" : "#20242c") + '">' + SUIT_GLYPH[c.s] + '</span>'
        : T("play");
      main.disabled = !c;
      main.classList.remove("idle");
      main.onclick = () => { const x = Game.suggestion(); if (x) Game.humanPlay(x); };
    } else {
      main.textContent = G.seats[R.turn] ? G.seats[R.turn].name + " …" : "…";
      main.disabled = true;
      main.classList.add("idle");       // it is reading out whose turn it is
      main.onclick = null;
    }
  },

  /* ---- WINNING marker over the card that currently leads the trick ---- */
  markWinning(){
    const R = Game.R, wm = $("#winmark"), t = $("#trick");
    t.querySelectorAll(".tc.winning").forEach(n => n.classList.remove("winning"));
    if (!R || R.trick.length < 2 || t.classList.contains("collect")){ wm.hidden = true; return; }
    const w = trickWinner(R.trick, R);
    const node = t.querySelector('.tc[data-seat="' + w + '"]');
    if (!node){ wm.hidden = true; return; }
    node.classList.add("winning");
    const fb = $("#felt").getBoundingClientRect(), cb = node.getBoundingClientRect();
    wm.hidden = false;
    wm.style.left = "0px"; wm.style.top = "0px";      // measure at a known origin
    const gutter = 96;                // keep clear of the side seats
    const half = wm.offsetWidth / 2 + 6;
    const lo = Math.min(gutter + half, fb.width / 2), hi = Math.max(fb.width - gutter - half, fb.width / 2);
    const x = Math.max(lo, Math.min(hi, cb.left - fb.left + cb.width / 2));
    wm.style.left = x + "px";
    wm.style.top  = Math.max(wm.offsetHeight + 4, cb.top - fb.top - 6) + "px";
  },

  setMode(R){
    const side = $("#st-side"), mark = $("#trumpmark");
    if (!R || !R.mode){
      side.textContent = T("liveTable");
      mark.classList.remove("on"); mark.textContent = "";
      return;
    }
    const glyph = R.mode === "sun" ? "☀︎" : SUIT_GLYPH[R.trump];
    const tint  = R.mode === "sun" ? "#f4d78a" : (SUIT_RED[R.trump] ? "#ff8a96" : "#ffffff");
    side.innerHTML = (R.mode === "sun" ? T("sun") : T("hokum")) +
                     ' <span class="suit" style="color:' + tint + '">' + glyph + '</span>';
    mark.textContent = glyph;
    mark.classList.add("on");
  },

  placeCard(seat, c, R){
    const t = $("#trick");
    const n = cardNode(c, R, "tc " + POSNAME[seat] + " deal-in");
    n.dataset.seat = seat;
    t.appendChild(n);
    this.layTrick();
    setTimeout(() => this.markWinning(), 30);
  },

  /** Spread the played cards along a shallow arc, like the cards in the mock-up. */
  layTrick(){
    const cards = [...$("#trick").querySelectorAll(".tc")];
    const n = cards.length;
    cards.forEach((node, i) => {
      const t = n > 1 ? (i - (n - 1) / 2) / ((n - 1) / 2) : 0;
      node.style.setProperty("--tr", (t * 7).toFixed(2) + "deg");
      node.style.setProperty("--ty", (t * t * 13).toFixed(1) + "px");
    });
  },
  collectTrick(seat){
    const t = $("#trick");
    $("#winmark").hidden = true;
    t.classList.add("collect", "w-" + POSNAME[seat]);
  },
  clearTrick(){
    const t = $("#trick");
    t.className = "";
    t.innerHTML = "";
    $("#winmark").hidden = true;
  },

  bubble(seat, text, gold){
    const b = el("div", "bubble" + (gold ? " gold" : ""), text);
    b.dataset.pos = POSNAME[seat];
    $("#felt").appendChild(b);
    setTimeout(() => b.remove(), pace(1300));
  },

  /* ---------------- bidding panel ---------------- */
  showBidPanel(seat){
    const R = Game.R, body = $("#bid-body");
    let chosenSuit = null;
    const canSun   = !Game.currentBid || Game.currentBid.type === "hokum";
    const canHokum = !Game.currentBid;

    body.innerHTML = "";
    body.appendChild(el("h2", null, T("bidTitle")));
    body.appendChild(el("p", "sub", Game.bidRound === 1 ? T("bidSub") : T("bidSubR2")));

    if (Game.bidRound === 1 && R.upcard){
      const w = el("div", null, ""); w.id = "bidcard-wrap";
      w.appendChild(cardNode(R.upcard, {mode:"sun"}));
      body.appendChild(w);
    }

    // you must be able to see your own cards while bidding
    body.appendChild(el("div", "minilbl", LANG === "ar" ? "أوراقك" : "Your cards"));
    const mh = el("div", "minihand");
    for (const c of this.sortHand(R.hands[0], {mode:"sun"})) mh.appendChild(cardNode(c, {mode:"sun"}));
    body.appendChild(mh);

    const row1 = el("div", "row");
    if (Game.bidRound === 1){
      const bh = el("button", "btn gold", T("hokum") + " " + SUIT_GLYPH[R.upcard.s]);
      bh.disabled = !canHokum;
      bh.onclick = () => Game.applyBid(seat, {type:"hokum", suit:R.upcard.s});
      row1.appendChild(bh);
    }
    const bs = el("button", "btn gold", "☀︎ " + T("sun"));
    bs.disabled = !canSun;
    bs.onclick = () => Game.applyBid(seat, {type:"sun"});
    row1.appendChild(bs);
    body.appendChild(row1);

    if (Game.bidRound === 2){
      body.appendChild(el("h3", null, T("chooseSuit")));
      const sb = el("div", "suitbtns");
      for (const s of SUITS){
        const b = el("button", "suitbtn" + (SUIT_RED[s] ? " r" : ""), SUIT_GLYPH[s]);
        b.onclick = () => {
          chosenSuit = s;
          sb.querySelectorAll(".suitbtn").forEach(x => x.classList.remove("sel"));
          b.classList.add("sel");
          $("#bid-confirm").disabled = false;
        };
        sb.appendChild(b);
      }
      body.appendChild(sb);
      const bc = el("button", "btn wide", T("hokum"));
      bc.id = "bid-confirm"; bc.disabled = true;
      bc.style.marginTop = "8px";
      bc.onclick = () => chosenSuit && Game.applyBid(seat, {type:"hokum", suit:chosenSuit});
      body.appendChild(bc);
    }

    const row2 = el("div", "row"); row2.style.marginTop = "8px";
    if (Game.canAshkal()){
      const ba = el("button", "btn", T("ashkal"));
      ba.title = T("ashkalHint");
      ba.onclick = () => Game.applyBid(seat, {type:"ashkal"});
      row2.appendChild(ba);
    }
    const bp = el("button", "btn ghost", T("pass"));
    bp.onclick = () => Game.applyBid(seat, {type:"pass"});
    row2.appendChild(bp);
    body.appendChild(row2);
    if (Game.canAshkal()) body.appendChild(el("div", "hint", T("ashkalHint")));

    // a short summary of the hand strength, purely informative
    const proj = findProjects(R.hands[0], {mode:"sun"});
    if (proj.length){
      const names = proj.map(p => projName(p.kind)).join(LANG === "ar" ? "، " : ", ");
      body.appendChild(el("div", "hint", "✦ " + names));
    }
    this.show("#m-bid");
  },

  /* ---------------- doubling panel ---------------- */
  showDoublePanel(seat, kind, done){
    const R = Game.R, body = $("#bid-body");
    const sub = kind === "double" ? "dblSubDouble" : kind === "triple" ? "dblSubTriple"
              : kind === "quad" ? "dblSubQuad" : "dblSubGahwa";
    const name = kind === "double" ? "dbl" : kind === "triple" ? "triple"
               : kind === "quad" ? "quad" : "gahwa";

    body.innerHTML = "";
    body.appendChild(el("h2", null, T("dblTitle")));
    body.appendChild(el("p", "sub", T(sub)));

    body.appendChild(el("div", "minilbl", LANG === "ar" ? "أوراقك" : "Your cards"));
    const mh = el("div", "minihand");
    for (const c of this.sortHand(R.hands[seat], R)) mh.appendChild(cardNode(c, R));
    body.appendChild(mh);

    const answer = a => { UI.hide("#m-bid"); done(a); };
    const row = el("div", "row");
    const lockable = R.mode === "hokum" && (kind === "double" || kind === "quad");
    if (lockable){
      const bo = el("button", "btn gold", T(name) + " · " + T("openTag"));
      bo.onclick = () => answer({type:kind, locked:false});
      const bl = el("button", "btn gold", T(name) + " · " + T("lockedTag"));
      bl.onclick = () => answer({type:kind, locked:true});
      row.appendChild(bo); row.appendChild(bl);
    } else {
      const b = el("button", "btn gold wide", T(name));
      b.onclick = () => answer({type:kind});
      row.appendChild(b);
    }
    body.appendChild(row);

    const row2 = el("div", "row"); row2.style.marginTop = "8px";
    const bp = el("button", "btn ghost", T("skip"));
    bp.onclick = () => answer(null);
    row2.appendChild(bp);
    body.appendChild(row2);
    this.show("#m-bid");
  },

  /* ---------------- round result ---------------- */
  showRoundPanel(res, gained, over){
    const G = Game.G, R = Game.R, body = $("#round-body");
    const modeTxt = R.mode === "sun" ? T("sun") : T("hokum") + " " + SUIT_GLYPH[R.trump];
    body.innerHTML = "";
    body.appendChild(el("h2", null, over ? T("gameOver") : T("roundOver")));
    body.appendChild(el("p", "sub", modeTxt + " — " + G.seats[R.bidder].name));

    if (res.note === "kaboot") body.appendChild(el("div", "hint", "🏆 " + T("kaboot")));
    if (res.note === "losing") body.appendChild(el("div", "hint", "⚠︎ " + T("losing")));
    if (res.mult > 1 && res.note !== "gahwa")
      body.appendChild(el("div", "hint", "×" + res.mult + " " + T("doubledNote")
                        + (Game.R.locked ? " · " + T("lockedTag") : "")));
    if (res.note === "gahwa")   body.appendChild(el("div", "hint", "☕ " + T("gahwaNote")));
    if (res.note === "tie")    body.appendChild(el("div", "hint", "= " + T("tieNote")));

    const tab = el("table", "rtab");
    const winTeam = gained[0] === gained[1] ? -1 : (gained[0] > gained[1] ? 0 : 1);
    tab.innerHTML =
      "<tr><th></th><th>" + T("us") + "</th><th>" + T("them") + "</th></tr>" +
      "<tr><td>" + T("tricks") + "</td><td>" + res.rawTricks[0] + "</td><td>" + res.rawTricks[1] + "</td></tr>" +
      "<tr><td>" + T("gamePts") + "</td><td>" + res.cards[0] + "</td><td>" + res.cards[1] + "</td></tr>" +
      "<tr><td>" + T("projects") + "</td><td>" + (res.projPts[0] + res.balootPts[0]) +
        "</td><td>" + (res.projPts[1] + res.balootPts[1]) + "</td></tr>" +
      "<tr class='" + (winTeam >= 0 ? "win" : "") + "'><td>" + T("final") + "</td>" +
        "<td>" + (winTeam === 0 ? "<b>" + gained[0] + "</b>" : gained[0]) + "</td>" +
        "<td>" + (winTeam === 1 ? "<b>" + gained[1] + "</b>" : gained[1]) + "</td></tr>" +
      "<tr><td>" + T("target") + " " + CFG.target + "</td><td>" + G.scores[0] + "</td><td>" + G.scores[1] + "</td></tr>";
    body.appendChild(tab);

    if (over){
      const win = G.scores[0] > G.scores[1];
      body.appendChild(el("h3", null, win ? T("weWin") : T("theyWin")));
      const r = el("div", "row"); r.style.marginTop = "10px";
      const b1 = el("button", "btn gold", T("playAgain"));
      b1.onclick = () => { UI.hide("#m-round"); Game.start(Game.G.seats); };
      r.appendChild(b1);
      body.appendChild(r);
    } else {
      const r = el("div", "row"); r.style.marginTop = "12px";
      const b1 = el("button", "btn gold", T("nextRound"));
      b1.onclick = () => { UI.hide("#m-round"); Game.newRound(); };
      r.appendChild(b1);
      body.appendChild(r);
    }
    this.show("#m-round");
  },

  /* ---------------- menu ---------------- */
  openMenu(){
    const body = $("#menu-body");
    body.innerHTML = "";
    body.appendChild(el("h2", null, T("menuTitle")));

    body.appendChild(el("h3", null, T("language")));
    body.appendChild(this.seg([["ar","العربية"],["en","English"]], LANG, v => setLang(v)));

    body.appendChild(el("h3", null, T("speed")));
    body.appendChild(this.seg([["slow",T("slow")],["normal",T("normal")],["fast",T("fast")]],
      Settings.speed, v => { Settings.set("speed", v); UI.openMenu(); }));

    body.appendChild(el("h3", null, T("sound")));
    body.appendChild(this.seg([[true,T("on")],[false,T("off")]], Settings.sound,
      v => { Settings.set("sound", v === "true" || v === true); UI.openMenu(); }));

    body.appendChild(el("h3", null, T("ardah")));
    body.appendChild(this.seg([[true,T("on")],[false,T("off")]], Settings.music,
      v => { const b = v === "true" || v === true;
             Settings.set("music", b); Music.toggle(b); UI.openMenu(); }));

    body.appendChild(el("h3", null, LANG === "ar" ? "التلميحات" : "Hints"));
    body.appendChild(this.seg([[true,T("on")],[false,T("off")]], Settings.hints,
      v => { Settings.set("hints", v === "true" || v === true); UI.openMenu(); UI.renderHand(); }));

    body.appendChild(el("div", "divider"));
    const r = el("div", "row wrap");
    const b0 = el("button", "btn ghost sm", T("rules"));
    b0.onclick = () => { UI.hide("#m-menu"); UI.openRules(); };
    const b1 = el("button", "btn ghost sm", T("newGame"));
    b1.onclick = () => { UI.hide("#m-menu"); Lobby.open(); };
    const b2 = el("button", "btn gold sm", T("close"));
    b2.onclick = () => UI.hide("#m-menu");
    r.appendChild(b0); r.appendChild(b1); r.appendChild(b2);
    body.appendChild(r);
    this.show("#m-menu");
  },

  seg(options, current, onPick){
    const s = el("div", "seg");
    for (const [v, label] of options){
      const b = el("button", String(v) === String(current) ? "on" : "", label);
      b.onclick = () => onPick(v);
      s.appendChild(b);
    }
    return s;
  },

  /* ---------------- rules ---------------- */
  openRules(){
    const body = $("#rules-body");
    const ar = LANG === "ar";
    body.innerHTML = "<h2>" + T("rulesTitle") + "</h2>" + (ar ? RULES_AR : RULES_EN);
    const b = el("button", "btn gold", T("close"));
    b.style.marginTop = "14px";
    b.onclick = () => UI.hide("#m-rules");
    body.appendChild(b);
    this.show("#m-rules");
  },

  /* ---------------- friends ---------------- */
  openFriends(){ Lobby.openFriends(); },
  renderFriends(){ if (!$("#m-friends").hidden) Lobby.renderFriendsList(); }
};

/* ============================================================
   9. Lobby, room & invitations
   ============================================================ */
const BOT_NAMES = {
  ar:["فهد","سعود","ناصر","عبدالله","تركي","ماجد","بدر","خالد"],
  en:["Fahad","Saud","Nasser","Abdullah","Turki","Majed","Badr","Khaled"]
};
function botName(i){ const l = BOT_NAMES[LANG] || BOT_NAMES.en; return l[i % l.length]; }

const Lobby = {
  room: null,
  selected: [],
  seats: null,

  init(){
    const url = new URL(location.href);
    this.room = (url.searchParams.get("room") || "").toUpperCase() || this.newRoom();
    this.seats = [
      {type:"human", human:true, name:T("you"), id:"me"},
      {type:"bot", human:false, name:botName(0)},
      {type:"bot", human:false, name:botName(1)},
      {type:"bot", human:false, name:botName(2)}
    ];
  },

  newRoom(){
    const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let s = "";
    for (let i=0;i<6;i++) s += A[Math.floor(Math.random()*A.length)];
    return s;
  },

  deepLink(){
    const base = location.origin && location.origin !== "null"
      ? location.origin + location.pathname : "https://baladyplus.sa/mini/baloot/";
    return base + "?room=" + this.room;
  },

  refreshBotNames(){
    let i = 0;
    for (const s of this.seats) if (s.type === "bot") s.name = botName(i++);
    this.seats[0].name = T("you");
  },

  /* ---- main lobby ---- */
  open(){
    this.refreshBotNames();
    const body = $("#lobby-body");
    body.className = "panel centered";
    body.innerHTML = "";
    const hero = el("div", "hero");
    for (const c of [card("D","J"), card("S","A"), card("H","K")]) hero.appendChild(cardNode(c));
    body.appendChild(hero);
    body.appendChild(el("h2", null, T("lobbyTitle")));
    body.appendChild(el("p", "sub", T("lobbySub")));

    body.appendChild(el("h3", null, T("seats")));
    body.appendChild(this.seatList());

    const r1 = el("div", "row"); r1.style.marginTop = "12px";
    const b1 = el("button", "btn gold", "▶︎ " + T("startSolo"));
    b1.onclick = () => this.startGame();
    r1.appendChild(b1);
    body.appendChild(r1);

    const r2 = el("div", "row"); r2.style.marginTop = "8px";
    const b2 = el("button", "btn", "👥 " + T("inviteFriends"));
    b2.onclick = () => { UI.hide("#m-lobby"); this.openFriends(); };
    const b3 = el("button", "btn ghost sm", "📖");
    b3.onclick = () => { UI.hide("#m-lobby"); UI.openRules(); };
    r2.appendChild(b2); r2.appendChild(b3);
    body.appendChild(r2);

    body.appendChild(el("div", "hint", T("target") + " " + CFG.target + " " + T("points")));
    UI.show("#m-lobby");
  },

  seatList(){
    const wrap = el("div", null, "");
    const labels = {0:T("seatS"), 1:T("seatE"), 2:T("seatN"), 3:T("seatW")};
    for (const i of [2,1,3]){
      const s = this.seats[i];
      const row = el("div", "seatrow");
      row.appendChild(el("div", "pos", labels[i]));
      row.appendChild(el("div", "who", s.name));
      const tag = s.type === "bot" ? el("span", "tag bot", T("bot"))
                : s.joined ? el("span", "tag joined", T("joined"))
                : el("span", "tag wait", T("waiting"));
      row.appendChild(tag);
      if (s.type === "friend"){
        const x = el("button", "icon-btn", "✕");
        x.style.width = x.style.height = "26px";
        x.onclick = () => {
          this.seats[i] = {type:"bot", human:false, name:botName(i)};
          this.selected = this.selected.filter(f => f.id !== s.id);
          this.open();
        };
        row.appendChild(x);
      }
      wrap.appendChild(row);
    }
    return wrap;
  },

  /* ---- friends / invite ---- */
  openFriends(){
    Friends.request();
    this.renderFriendsList();
    UI.show("#m-friends");
  },

  renderFriendsList(){
    const body = $("#friends-body");
    body.innerHTML = "";
    body.appendChild(el("h2", null, "👥 " + T("friendsTitle")));
    body.appendChild(el("p", "sub", T("friendsSub")));

    // room code + share
    body.appendChild(el("h3", null, T("roomCode")));
    const code = el("div", null, this.room); code.id = "roomcode";
    body.appendChild(code);

    const rr = el("div", "row");
    const bCopy = el("button", "btn ghost", "⧉ " + T("copy"));
    bCopy.onclick = async () => {
      const txt = this.deepLink();
      try{
        if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(txt);
        else { const ta = el("textarea"); ta.value = txt; document.body.appendChild(ta);
               ta.select(); document.execCommand("copy"); ta.remove(); }
        toast(T("copied"));
      }catch(e){ toast(txt); }
    };
    const bShare = el("button", "btn gold", "↗ " + T("share"));
    bShare.onclick = async () => {
      const text = (LANG === "ar" ? "العب بلوت معي في بلدي+ — رمز الغرفة: " : "Play Baloot with me on Balady+ — room: ") + this.room;
      const url = this.deepLink();
      const sentToHost = Bridge.send("share", {room:this.room, url, text});
      if (navigator.share){ try{ await navigator.share({title:"Baloot", text, url}); return; }catch(e){} }
      if (!sentToHost) { bCopy.onclick(); }
    };
    rr.appendChild(bCopy); rr.appendChild(bShare);
    body.appendChild(rr);

    // friends list
    body.appendChild(el("h3", null, T("myFriends")));
    const list = el("div", "flist");
    const all = Friends.all();
    if (!Friends.loaded()){
      list.appendChild(el("div", "empty", T("loadingFriends")));
    } else if (!all.length){
      list.appendChild(el("div", "empty", T("noFriends").replace(/\n/g, "<br>")));
    } else {
      for (const f of all){
        const on = this.selected.some(x => x.id === f.id);
        const item = el("div", "fitem" + (on ? " on" : ""));
        item.appendChild(el("div", "av", (f.name || "#").trim().charAt(0).toUpperCase()));
        const meta = el("div", "meta");
        meta.appendChild(el("div", "n", f.name));
        meta.appendChild(el("div", "s", "#" + f.id + (f.online ? " • " + (LANG==="ar"?"متصل":"online") : "")));
        item.appendChild(meta);
        item.appendChild(el("div", "pick", on ? "✓" : ""));
        item.onclick = () => {
          if (on) this.selected = this.selected.filter(x => x.id !== f.id);
          else if (this.selected.length < 3) this.selected.push(f);
          else toast(LANG === "ar" ? "ثلاثة أصدقاء كحد أقصى" : "Three friends maximum");
          this.renderFriendsList();
        };
        list.appendChild(item);
      }
    }
    body.appendChild(list);

    // add by player number — mirrors the in-app "تحدي بلدي" friends flow
    body.appendChild(el("h3", null, T("addByNumber")));
    const addRow = el("div", "row");
    const inp = el("input", "field");
    inp.placeholder = T("addHint");
    inp.setAttribute("inputmode", "numeric");
    const bAdd = el("button", "btn sm gold", T("add"));
    bAdd.onclick = () => {
      const f = Friends.addLocal(inp.value);
      if (f){ inp.value = ""; this.renderFriendsList(); }
      else toast(LANG === "ar" ? "رقم غير صالح أو مضاف مسبقاً" : "Invalid or already added");
    };
    addRow.appendChild(inp); addRow.appendChild(bAdd);
    body.appendChild(addRow);

    if (Bridge.hasHost()){
      const bHost = el("button", "btn ghost wide", T("hostInvite"));
      bHost.style.marginTop = "8px";
      bHost.onclick = () => Bridge.send("getFriends", {force:true});
      body.appendChild(bHost);
    }

    body.appendChild(el("div", "divider"));
    const rGo = el("div", "row");
    const bGo = el("button", "btn gold", T("seatThem"));
    bGo.onclick = () => this.seatSelected();
    const bBack = el("button", "btn ghost sm", "←");
    bBack.onclick = () => { UI.hide("#m-friends"); this.open(); };
    rGo.appendChild(bGo); rGo.appendChild(bBack);
    body.appendChild(rGo);

    body.appendChild(el("div", "hint", LANG === "ar"
      ? "الدعوة تُرسل عبر تطبيق بلدي+. حتى انضمام صديقك يلعب البوت مكانه بنفس الاسم."
      : "Invitations are delivered by the Balady+ app. Until a friend joins, a bot plays that seat under their name."));
  },

  seatSelected(){
    // partner first, then right, then left
    const order = [2,1,3];
    for (let i=0;i<order.length;i++){
      const seat = order[i], f = this.selected[i];
      this.seats[seat] = f
        ? {type:"friend", human:false, name:f.name, id:f.id, joined:false}
        : {type:"bot", human:false, name:botName(seat)};
    }
    if (this.selected.length){
      Bridge.send("invite", {
        room: this.room,
        deepLink: this.deepLink(),
        ids: this.selected.map(f => f.id),
        seats: order.map((s,i) => ({seat:s, id:this.selected[i] ? this.selected[i].id : null}))
      });
      toast(T("inviteSent", {n:this.selected.map(f => f.name).join("، ")}));
    }
    UI.hide("#m-friends");
    this.open();
  },

  friendJoined(f){
    if (!f) return;
    const seat = this.seats.findIndex(s => s.type === "friend" && String(s.id) === String(f.id));
    const i = (typeof f.seat === "number" && f.seat > 0 && f.seat < 4) ? f.seat : seat;
    if (i > 0){
      this.seats[i].joined = true;
      if (f.name) this.seats[i].name = f.name;
      toast(this.seats[i].name + " — " + T("joined"));
      UI.renderSeats();
      if (!$("#m-lobby").hidden) this.open();
    }
  },

  applyRoom(r){
    if (!r) return;
    if (r.room) this.room = String(r.room).toUpperCase();
    if (Array.isArray(r.seats)){
      r.seats.forEach((s, i) => {
        if (i === 0 || !s) return;
        this.seats[i] = s.bot
          ? {type:"bot", human:false, name:s.name || botName(i)}
          : {type:"friend", human:false, name:s.name || ("#"+s.id), id:s.id, joined:!!s.joined};
      });
    }
    if (!$("#m-friends").hidden) this.renderFriendsList();
    if (!$("#m-lobby").hidden) this.open();
    UI.renderSeats();
  },

  startGame(){
    UI.hide("#m-lobby");
    Music.start();                      // a tap: the browser will let audio through now
    Game.start(this.seats.map(s => ({...s})));
  }
};

const RULES_AR = `

<p><b>بلوت</b> — أربعة لاعبين، فريقان (أنت وشريكك في المقابل). ٣٢ ورقة (٧ إلى الآكل)، ٨ أوراق لكل لاعب.</p>

<h3>ترتيب الأوراق والنقاط</h3>
<table>
<tr><th>الورقة</th><th>صن</th><th>حكم (غير الحكم)</th><th>حكم (نوع الحكم)</th></tr>

<tr><td>٩</td><td>٠</td><td>٠</td><td><b>١٤</b></td></tr>
<tr><td>الآكل (A)</td><td>١١</td><td>١١</td><td>١١</td></tr>
<tr><td>١٠</td><td>١٠</td><td>١٠</td><td>١٠</td></tr>
<tr><td>الشايب (K)</td><td>٤</td><td>٤</td><td>٤</td></tr>
<tr><td>البنت (Q)</td><td>٣</td><td>٣</td><td>٣</td></tr>
<tr><td>٨ / ٧</td><td>٠</td><td>٠</td><td>٠</td></tr>
</table>
<p>الترتيب في الصن: آكل &gt; ١٠ &gt; شايب &gt; بنت &gt; ولد &gt; ٩ &gt; ٨ &gt; ٧.<br>
في نوع الحكم: ولد &gt; ٩ &gt; آكل &gt; ١٠ &gt; شايب &gt; بنت &gt; ٨ &gt; ٧.</p>
<p>آخر أكلة تُضيف <b>١٠</b> نقاط. مجموع الصن ١٣٠، ومجموع الحكم ١٦٢.</p>

<h3>قواعد اللعب</h3>
<ul>
<li>يجب اتباع نوع الورقة المطروحة إن وُجد لديك.</li>
<li>في الحكم: إذا لم يكن لديك النوع وجب قطع الأكلة بالحكم إن استطعت كسبها، وإن لم تستطع فالعب ما شئت.</li>
<li>إذا طُرح الحكم وجب أن تعلو عليه إن استطعت.</li>
<li>إذا كانت الأكلة لشريكك فارمِ ما شئت، إلا إن كنت ثالثاً على فتحة شريك يمكن قطعها؛ يعفيك منها الآكل أو نطق <b>إكه</b> (أعلى ورقة باقية من نوعها).</li>
</ul>

<h3>الدبل والثري والفور والقهوة</h3>
<ul>
<li>قبل أول ورقة يجوز لأحد الخصمين <b>الدبل</b> على الحكم، وله أن يجعل اللعب <b>مقفلاً</b> فلا يفتح أحد بالحكم إلا إذا كانت يده كلها حكماً.</li>
<li>ويرد المشتري بـ<b>ثري</b>، ثم المدبّل بـ<b>فور</b> (مقفل أو مفتوح)، وأخيراً المشتري بـ<b>قهوة</b> وهي تكسب اللعبة كاملة.</li>
<li>في الصن دبل فقط، ولا يجوز إلا إذا كان فريقك على مائة أو أقل وتجاوزها الفريق الآخر.</li>
<li>الجولة المضاعفة كلها للفائز: ١٦ (أو ٢٦) × المضاعفة مع ضعف قيمة المشاريع المفروشة من الفريقين، والبلوت يبقى ٢، ولا شيء للخاسر.</li>
<li>والمضاعفة تنقل العدّ: يَعُدّ الفريق الذي لم يتكلم أخيراً.</li>
</ul>

<h3>المشاريع</h3>
<table>
<tr><th>المشروع</th><th>حكم</th><th>صن</th></tr>
<tr><td><b>سرا</b> ٣ متتالية من نفس النوع</td><td>٢</td><td>٤</td></tr>
<tr><td><b>خمسين</b> ٤ متتالية</td><td>٥</td><td>١٠</td></tr>
<tr><td><b>مية</b> ٥ متتالية أو ٤ متشابهة (شايب/بنت/ولد/١٠)</td><td>١٠</td><td>٢٠</td></tr>
<tr><td><b>أربعمية</b> ٤ آكال</td><td>١٠ (تُحسب مية)</td><td>٤٠</td></tr>
<tr><td><b>بلوت</b> شايب وبنت نوع الحكم</td><td>٢</td><td>—</td></tr>
</table>
<p>القيم أعلاه بالقيد. يحتسب المشاريع الفريق صاحب أعلى مشروع وحده — وله كل مشاريعه — وتسقط مشاريع الفريق الآخر. المية المتسلسلة أكبر من مية الأوراق المتشابهة، وترتيب المتشابهة: آكال ثم شياب ثم بنات ثم أولاد ثم عشرات. ولا تدخل الورقة في مشروعين، فلا يزيد ما في اليد على مشروعين. وأربع تسعات أو ثمانيات أو سبعات بلا قيمة. والبلوت مستقل: يحسبه أي فريق، إلا إذا كان داخل مية مفروشة له.</p>

<h3>الحساب</h3>
<ul>
<li>يَعُدّ أبناطه فريق واحد فقط: غير المشتري، أو فريق المشتري إذا دُبّلت اللعبة. في <b>الحكم</b> تُقرَّب إلى أقرب عشرة والخمسة تنزل ثم ÷ ١٠، وفي <b>الصن</b> تُقرَّب إلى أقرب عشرة إلا إذا انتهت بخمسة فلا تُقرَّب ثم ÷ ٥.</li>
<li>ويأخذ فريق المشتري باقي قيد الجولة: <b>١٦</b> في الحكم و<b>٢٦</b> في الصن — فلا تُخرج الجولة أكثر مما فيها.</li>
<li>تُضاف المشاريع فوق ذلك بقيمتها بالقيد.</li>
<li><b>خسارة</b>: إذا نقص فريق المشتري عن الخصم أخذ الخصم الجولة كاملة ومعها كل المشاريع.</li>
<li>عند تساوي القيد تكون الأفضلية لمن خسر أكثر في التقريب، فإن تساويا فلفريق المشتري.</li>
<li><b>كبوت</b>: أخذ الأكلات الثماني = ٤٤ في الصن و٢٥ في الحكم، ومعها مشاريع الفريق نفسه.</li>
<li>اللعبة حتى <b>١٥٢</b> نقطة.</li>
</ul>
</div>`;

const RULES_EN = `
<div class="rules">
<p><b>Baloot</b> — four players in two partnerships (you and the player opposite). 32 cards (7 to Ace), 8 cards each.</p>

<h3>Bidding</h3>
<ul>
<li>Five cards are dealt to each player and one card is turned face up.</li>
<li>First round: bid <b>Hokum</b> (that card's suit is trump), <b>Sun</b> (no trump), or <b>Pass</b>.</li>
<li><b>Sun outbids Hokum</b> within the same round.</li>
<li><b>Ashkal</b> — said by the third or fourth player when everyone before them passed: a Sun bought for the partner, who takes the face-up card and becomes the buyer.</li>
<li>If all pass, a second round lets you pick any trump suit or Sun. All passing again means a redeal.</li>
<li>The buyer takes the face-up card plus two more; everyone else gets three.</li>
<li>The player to the dealer's right leads to the first trick, whoever bought.</li>
</ul>

<h3>Card ranking &amp; points</h3>
<table>
<tr><th>Card</th><th>Sun</th><th>Hokum (plain)</th><th>Hokum (trump)</th></tr>
<tr><td>J</td><td>2</td><td>2</td><td><b>20</b></td></tr>
<tr><td>9</td><td>0</td><td>0</td><td><b>14</b></td></tr>
<tr><td>A</td><td>11</td><td>11</td><td>11</td></tr>
<tr><td>10</td><td>10</td><td>10</td><td>10</td></tr>
<tr><td>K</td><td>4</td><td>4</td><td>4</td></tr>
<tr><td>Q</td><td>3</td><td>3</td><td>3</td></tr>
<tr><td>8 / 7</td><td>0</td><td>0</td><td>0</td></tr>
</table>
<p>Sun order: A &gt; 10 &gt; K &gt; Q &gt; J &gt; 9 &gt; 8 &gt; 7.<br>
Trump order: J &gt; 9 &gt; A &gt; 10 &gt; K &gt; Q &gt; 8 &gt; 7.</p>
<p>The last trick is worth <b>10</b> extra. Sun totals 130 raw points, Hokum 162.</p>

<h3>Playing rules</h3>
<ul>
<li>You must follow the led suit if you hold it.</li>
<li>In Hokum, if you are void you must take the trick with a trump when you can. If you cannot beat it, anything goes — throwing a trump underneath is allowed, never forced.</li>
<li>A trump lead must be over-trumped whenever you can.</li>
<li>You may throw away when your partner is winning — except as third hand behind a partner's lead that can still be beaten. An Ace, or a lead called <b>Ekka</b> (the highest card of its suit still out), frees you.</li>
</ul>

<h3>Double, Triple, Quadruple, Gahwa</h3>
<ul>
<li>Before the first card, a defender may <b>Double</b> a Hokum — and call <b>locked</b> play, where nobody may lead a trump unless their whole hand is trumps.</li>
<li>The buyer may answer <b>Triple</b>, the doubler <b>Quadruple</b> (locked or open), and the buyer finally <b>Gahwa</b>, which wins the whole match.</li>
<li>A Sun can only be doubled, and only while your side is at 100 or less and theirs is past it. No Triple, Quadruple or Gahwa in Sun.</li>
<li>A doubled round is all or nothing: the winners take 16 (or 26) × the multiplier plus double the value of every project shown by either side, Baloot stays 2, and the losers take nothing.</li>
<li>Raising also moves the count: the side that did not speak last counts its card points.</li>
</ul>

<h3>Projects</h3>
<table>
<tr><th>Project</th><th>Hokum</th><th>Sun</th></tr>
<tr><td><b>Sra</b> — 3 in sequence, same suit</td><td>2</td><td>4</td></tr>
<tr><td><b>Fifty</b> — 4 in sequence</td><td>5</td><td>10</td></tr>
<tr><td><b>Hundred</b> — 5 in sequence, or four K/Q/J/10</td><td>10</td><td>20</td></tr>
<tr><td><b>Four Hundred</b> — four Aces</td><td>10 (a Hundred)</td><td>40</td></tr>
<tr><td><b>Baloot</b> — K + Q of trumps</td><td>2</td><td>—</td></tr>
</table>
<p>Those are game points. Only the team holding the single best project scores — and it scores every project it holds; the other team's are lost. A sequential Hundred beats a Hundred of four equal cards, and sets of four run A, K, Q, J, 10. No card serves two projects, so a hand holds at most two. Four nines, eights or sevens are worth nothing. Baloot stands apart: either team may score it, unless it sits inside a Hundred that team showed.</p>

<h3>Scoring</h3>
<ul>
<li>Only one side counts its card points — the defenders, or the buyer's team once the round has been doubled. <b>Hokum</b>: round to the nearest ten, a five rounding down, then ÷10. <b>Sun</b>: round to the nearest ten unless the total ends in five, then ÷5.</li>
<li>The buyer's team is handed the rest of the round — <b>16</b> in Hokum, <b>26</b> in Sun — so a round never pays out more than it holds.</li>
<li>Projects are added on top, as game points.</li>
<li><b>Failed bid</b>: if the buyer's team ends up with less, the defenders take the whole round plus every project in it.</li>
<li>Level game points go to the side that gave up more in the rounding; give up the same and the buyer's team takes it.</li>
<li><b>Kaboot</b> (all 8 tricks): 44 in Sun, 25 in Hokum, plus that team's own projects.</li>
<li>The game is played to <b>152</b> points.</li>
</ul>
</div>`;

const Fullscreen = {
  el(){ return document.documentElement; },
  on(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  toggle(){
    try{
      if (this.on()){
        (document.exitFullscreen || document.webkitExitFullscreen || (()=>{})).call(document);

        const e = this.el();

  sync(){
    const b = $("#btn-full");
    if (!b) return;
    b.textContent = this.on() ? "⤡" : "⛶";

};

  // this is exactly why only one team counts: in hokum both sides can round up
  let over = 0;
  for (let a = 0; a <= 162; a++) if (convert(a,"hokum") + convert(162-a,"hokum") > 16) over++;
  ok("independent hokum counts can overshoot 16 (" + over + " splits)", over > 0);
  let sunBad = 0;
  for (let a = 0; a <= 130; a++) if (convert(a,"sun") + convert(130-a,"sun") !== 26) sunBad++;
  ok("sun counts always add to 26", sunBad === 0);

  // ---- round scoring ----
  const mkRound = (mode, tricks, proj, bidder, won) => ({
    mode, trump: mode === "hokum" ? "S" : null, bidder,
    rawPoints: tricks, tricksWon: won || [4,4],
    projects:{teamPoints: proj, announcements:[]}
  });
  // team 0 buys, team 1 defends and therefore counts
  const round = (mode, defRaw, projA, projB, won) =>
    scoreRound(mkRound(mode, [(mode === "sun" ? 130 : 162) - defRaw, defRaw], [projA, projB], 0, won));

  // pagat's worked examples of the Saudi tournament scoring
  const ex1 = round("hokum", 77, 0, 0);
  ok("ex1: hokum 85/77 is 8 each and the buy stands",
     ex1.note === "tie" && ex1.final[0] === 8 && ex1.final[1] === 8);
  const ex3 = round("hokum", 56, 0, 5);
  ok("ex3: a fifty flips a hokum the buyer led on cards",
     ex3.note === "losing" && ex3.final[1] === 21 && ex3.final[0] === 0);
  const ex5 = round("sun", 66, 10, 0);
  ok("ex5: sun 64/66 with the buyer's fifty is 22 and 14",
     !ex5.note && ex5.final[0] === 22 && ex5.final[1] === 14);
  const ex6 = round("sun", 55, 0, 4);
  ok("ex6: a tie with nothing rounded goes to the buyer",
     ex6.note === "tie" && ex6.final[0] === 15 && ex6.final[1] === 15);
  const ex7 = round("sun", 41, 0, 10);
  ok("ex7: a tie goes to the side that lost more in the rounding",
     ex7.note === "losing" && ex7.final[1] === 36 && ex7.final[0] === 0);

  // the federation's own thresholds (البند الرابع ٤-٢ … ٤-٩)
  const lost = r => r.note === "losing";
  ok("4-2: sun without projects is lost at 66", lost(round("sun", 66, 0, 0)) && !lost(round("sun", 65, 0, 0)));
  ok("4-3: hokum without projects is lost at 82", lost(round("hokum", 82, 0, 0)) && !lost(round("hokum", 81, 0, 0)));
  ok("4-4: sun with a sra is lost at 56", lost(round("sun", 56, 0, 4)) && !lost(round("sun", 55, 0, 4)));
  ok("4-5: hokum with a sra is lost at 72", lost(round("hokum", 72, 0, 2)) && !lost(round("hokum", 71, 0, 2)));
  ok("4-6: sun with a fifty is lost at 41", lost(round("sun", 41, 0, 10)) && !lost(round("sun", 40, 0, 10)));
  ok("4-7: hokum with a fifty is lost at 56", lost(round("hokum", 56, 0, 5)) && !lost(round("hokum", 55, 0, 5)));
  ok("4-8: sun with a hundred is lost at 16", lost(round("sun", 16, 0, 20)) && !lost(round("sun", 15, 0, 20)));
  ok("4-9: hokum with a hundred is lost at 32", lost(round("hokum", 32, 0, 10)) && !lost(round("hokum", 31, 0, 10)));

  // a round never hands out more card points than it holds
  let bad = null;
  for (const [mode, total, cap] of [["hokum", 162, 16], ["sun", 130, 26]]){
    for (let d = 0; d <= total; d++){
      const r = round(mode, d, 0, 0);
      if (r.cards[0] + r.cards[1] !== cap) bad = mode + " " + d;
      if (!r.note && r.final[0] + r.final[1] !== cap) bad = mode + " " + d;
    }
  }
  ok("every split adds up to the round" + (bad ? " (" + bad + ")" : " (293 checked)"), !bad);

  const rFail = round("sun", 90, 0, 0);
  ok("a failed bid gives the defenders the lot",
     rFail.note === "losing" && rFail.final[0] === 0 && rFail.final[1] === CFG.sunTotal);
  const rFailP = round("sun", 90, 4, 0);
  ok("a failed bid sweeps up both sides' projects",
     rFailP.final[1] === CFG.sunTotal + 4 && rFailP.final[0] === 0);
  const rKab = scoreRound(mkRound("hokum", [162,0], [5,0], 0, [8,0]));
  ok("kaboot in hokum is 25 plus its own projects",
     rKab.note === "kaboot" && rKab.final[0] === CFG.kabootHokum + 5 && rKab.final[1] === 0);
  const rKabS = scoreRound(mkRound("sun", [130,0], [0,0], 0, [8,0]));
  ok("kaboot in sun is 44", rKabS.final[0] === CFG.kabootSun);

  // ---- doubling (البند السابع) ----
  const dbl = (mode, extra) => scoreRound(Object.assign(
    {mode, trump: mode === "hokum" ? "S" : null, bidder:0, tricksWon:[4,4]}, extra));
  // pagat ex4: the same cards as ex3, but the defenders doubled, so the buyer's
  // team counts - and with it the round swings the other way
  const ex4 = dbl("hokum", {rawPoints:[106,56], projects:{teamPoints:[0,5]}, mult:2, countTeam:0});
  ok("ex4: a double moves the count and turns the round",
     ex4.note === "doubled" && ex4.final[0] === 42 && ex4.final[1] === 0);
  const ex8 = dbl("sun", {rawPoints:[67,63], projects:{teamPoints:[0,0]}, mult:2, countTeam:0});
  ok("ex8: a doubled sun pays 52", ex8.note === "doubled" && ex8.final[0] === 52);
  const dblLost = dbl("hokum", {rawPoints:[40,122], projects:{teamPoints:[0,0]}, mult:2, countTeam:0});
  ok("a lost double pays the defenders 32", dblLost.note === "losing" && dblLost.final[1] === 32);
  const quad = dbl("hokum", {rawPoints:[106,56], projects:{teamPoints:[0,5]}, mult:4, countTeam:0});
  ok("projects double but never triple or quadruple", quad.final[0] === 16*4 + 5*2);
  const gah = dbl("hokum", {rawPoints:[106,56], projects:{teamPoints:[0,0]}, mult:4, countTeam:0, gahwa:true});
  ok("gahwa hands the match to the winner", gah.note === "gahwa" && gah.winner === 0);
  const dblBal = dbl("hokum", {rawPoints:[106,56], projects:{teamPoints:[0,0], baloot:[2,0]},
                               mult:2, countTeam:0});
  ok("baloot stays flat under a double", dblBal.final[0] === 32 + 2);

  // مقفل: no trump leads unless that is all you hold
  const lockSt = {mode:"hokum", trump:"S", locked:true, currentSeat:0};
  ok("a locked hand may not lead trumps",
     legalCards([card("S","A"), card("H","7")], [], lockSt).length === 1);
  ok("all trumps may still be led",
     legalCards([card("S","A"), card("S","7")], [], lockSt).length === 2);

  // a big project can flip a round the buyer won on cards - that is real Baloot
  const rFlip = round("sun", 24, 0, 40);
  ok("a four hundred flips the round", rFlip.note === "losing" && rFlip.final[1] === CFG.sunTotal + 40);
  const rNoFlip = round("sun", 24, 0, 4);
  ok("a sra does not flip it", !rNoFlip.note && rNoFlip.final[0] === 22 && rNoFlip.final[1] === 8);


  console.log("%cBaloot self-check", "font-weight:bold", "\n" + out.join("\n"));
  const fails = out.filter(l => l.startsWith("FAIL"));
  toast(fails.length ? (fails.length + " test(s) failed — see console") : "All " + out.length + " tests passed ✓");
}
</script>
